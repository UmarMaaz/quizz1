<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#5d6675;--bd:#dfe3ea;--ac:#2557d6;--ok:#15803d;--okb:#e3f6ea;--no:#b91c1c;--nob:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<script>
const N={I:"Islamic Studies",E:"English",M:"Maths & Reasoning",S:"Science & Tech",C:"Current Affairs",P:"Pakistan Affairs",G:"General Knowledge"};
// [cat, question, "opt|opt|opt|opt", correctIndex, explanation]
const Q=[
["I", "In which Surah are the rules of distribution of Mall-e-Ghaneemat (war booty) mentioned?", "Sura Anfal|Sura Toba|Sura Nisa|None of These", 0, "Surah Al-Anfal (Ch.8), verse 41, explicitly distributes war spoils (Khums) — one-fifth to Allah, the Prophet (PBUH), near relatives, orphans, the poor, and the wayfarer. 'Anfal' itself means spoils of war."],
["I", "In which Surah is the murder of children prohibited in fear of hunger/starvation?", "Sura An'am|Sura Mominoon|Sura Hujrat|None of These", 0, "Surah Al-An'am (Ch.6), verse 151, forbids killing children due to fear of poverty, stating Allah provides sustenance for both parents and children. A related prohibition also appears in Surah Al-Isra (17:31)."],
["I", "In how many Surahs are Haroof-e-Muqatta'at (disjointed letters) found?", "20|25|29|None of These", 2, "Haroof-e-Muqatta'at (abbreviated letters/fawatih) appear at the beginning of 29 Surahs of the Holy Quran. Examples: Alif Lam Meem (Al-Baqarah), Ya Seen, Ha Meem. Their precise meaning remains among divine secrets (Mutashabihat)."],
["I", "How many times is the name 'Muhammad (PBUH)' directly mentioned in the Holy Quran?", "4|5|6|None of these", 0, "The name 'Muhammad (PBUH)' appears exactly 4 times: Al-Imran (3:144), Al-Ahzab (33:40), Muhammad (47:2), and Al-Fath (48:29). The name 'Ahmad' appears once in As-Saff (61:6). Muhammad specifically = 4 times."],
["I", "Which book of Seerat-e-Rasool (RA) in Urdu is written entirely without dots/points?", "Rasool Alam|Hadi Alam|Sarwar Alam|None of These", 2, "'Sarwar Alam' is the famous Seerat book written entirely in undotted (nuqta-free) Urdu letters — a remarkable literary feat. Avoiding dotted letters in Arabic/Urdu script is a traditional form of devotional literary artistry."],
["I", "For which Surah did the Holy Prophet (PBUH) say 'it made me old'?", "Sura Hood|Sura Samood|Sura Aad|None of These", 0, "The Prophet (PBUH) said: 'Surah Hood and its sisters have turned my hair grey.' (Tirmidhi). The Surah's vivid description of divine accountability and the Day of Judgment is cited as the reason. The Prophet's hair greyed from contemplating its weight."],
["I", "Who is the author of the book 'Sunnat Khair-ul-Anam'?", "Qazi Salman Mansoorpuri|Peer Muhammad Karam Shah|Mufti Muhammad Shafi|None of These", 1, "'Sunnat Khair-ul-Anam' was authored by Pir Muhammad Karam Shah Al-Azhari (1918–1998), Pakistani Islamic scholar and founder of Dar-ul-Uloom Muhammadiyah Ghausiyah, Bhera. He also wrote the celebrated Urdu Tafseer 'Zia-ul-Quran.'"],
["I", "The Hadith which is traced all the way back to the Prophet (PBUH) is called:", "Maroof|Moqoof|Qudsi|None of these", 3, "A Hadith traced back continuously to the Prophet (PBUH) is called 'Marfu'' — not listed among the options. 'Mauqoof' stops at a Companion; 'Maqtu'' stops at a Tabi'i; 'Qudsi' = divine words narrated by the Prophet in his own words. Correct answer is (D) None of these — it is Marfu'."],
["I", "Who is called more honorable than the Ka'bah by the Holy Prophet (PBUH)?", "Safa Marwa|Jable Noor|Momin (Believer)|Shaheed", 2, "The Prophet (PBUH) said while looking at the Ka'bah: 'How great you are — but a believer's sanctity before Allah is even greater!' (Ibn Majah, 3932). This highlights the supreme dignity of a true believer in Islamic theology."],
["I", "Which was the last Ghazwa (battle personally led) of the Holy Prophet (PBUH)?", "Khyber|Tabook|Hunain|None of these", 1, "Ghazwa Tabook (9 AH / 630 CE) was the last military expedition personally led by the Prophet (PBUH). He led ~30,000 Muslims to confront the Byzantine threat at Tabook in northern Arabia; no battle occurred as Byzantine forces withdrew."],
["I", "What was the real name of the Holy Prophet's (RA) uncle 'Abu Talib'?", "Abdullah|Abd Munaf|Abd Kaaba|None of these", 1, "The real name of Abu Talib was 'Abd Munaf' according to classical Seerat literature (some scholars say 'Imran'). His Kunya (honorific) was Abu Talib — by which he is universally known. He was the paternal uncle and guardian of the Prophet (PBUH)."],
["I", "The Ghazwa of Hunain was fought against which tribe?", "Oass|Khazraj|Hawazin|Knana", 2, "Ghazwa Hunain (8 AH/630 CE), fought shortly after the conquest of Makkah, was against the Hawazin and Thaqeef tribes. Referenced in Surah At-Tawbah (9:25-26). Muslims initially faced difficulty due to an ambush but ultimately triumphed with Allah's help."],
["I", "Who was the Muslim scientist who first described blood circulation / presented the concept of blood pressure?", "Ibn un-Nafees|Ibn al-Haytham|Ibn Baitar|None of These", 0, "Ibn al-Nafees (1213–1288 CE), Syrian physician, first described pulmonary circulation in 'Sharh Tashrih al-Qanun.' His discovery predated William Harvey's European description by over 300 years. He is considered father of circulatory physiology."],
["I", "Battlefield 'Badar' is situated near the city of:", "Makkah|Jeddah|Taif|None of these", 3, "Badr is ~130 km southwest of Madinah in the Hejaz region of Saudi Arabia — not near Makkah, Jeddah, or Taif. The Battle of Badr (2 AH/624 CE) was the first major battle between Muslims and Quraysh. Answer: (D) None of these — it is near Madinah."],
["I", "Where was the election of Caliph Abu Bakar (RA) held?", "House of Abu Bakar (RA)|Masjid-e-Nabwi|Masjid-e-Haram|None of these", 3, "Hazrat Abu Bakar (RA) was selected at Saqeefa Bani Saida — a roofed gathering place of the Bani Sa'idah tribe in Madinah — immediately after the Prophet's (RA) death. Answer: (D) None of these. The correct venue is Saqeefa Bani Saida."],
["I", "Which commander was appointed by the Holy Prophet (PBUH) and was NOT removed by Hazrat Abu Bakar (RA)?", "Usama b. Zaid (RA)|Khalid b. Waleed (RA)|Tariq b. Ziyad|Maaz b. Jabal (RA)", 0, "The Prophet (PBUH) appointed Usama bin Zaid (RA) to lead the Syria expedition. Abu Bakar (RA) famously refused to replace him despite pressure, saying: 'I will not untie a knot that the Prophet (PBUH) tied.' The expedition proceeded under Usama's command."],
["I", "In Islamic Jurisprudence books, the Law of Inheritance is called?", "Ilm-ul-Fiqh|Ilm-ul-Asool|Ilm-ul-Faraiz|None of These", 2, "Ilm-ul-Faraiz deals with the law of inheritance (Miras). The Prophet (PBUH) called it 'half of all knowledge.' It derives from 'Fard' (fixed shares) and is governed primarily by Surah An-Nisa (4:11-12, 176)."],
["I", "When someone declares his wife equivalent to the back of his mother (a prohibited relation), that act is called:", "Khula|Fela|Zihar|None of These", 2, "Zihar: a man says to his wife 'You are to me like my mother's back' — a pre-Islamic form of oath. Islam deemed it neither divorce nor permissible; the man must pay Kaffarah (expiation). Addressed in Surah Al-Mujadila (58:2-4)."],
["I", "What is the name of the consensus where scholars of one community silently adopt the ruling of another community without explicitly stating so?", "Ijma Sukuti|Ijma Qolbi|Ijma Faili|Ijma Taqriri", 0, "Ijma Sukuti: one scholar issues a ruling and other scholars of the era remain silent — their silence = tacit approval. Weaker form compared to Ijma Sarih (explicit verbal consensus). Widely discussed in Usool al-Fiqh."],
["I", "Which Sahabi (RA) is declared 'Imam-ul-Fuqaha' (Leader of Jurists)?", "Hazrat Ali (RA)|Abdullah Bin Abbas (RA)|Maaz Bin Jabal (RA)|None of These", 1, "Hazrat Abdullah ibn Abbas (RA) (d. 68 AH) — known as 'Hibr-ul-Ummah' and 'Imam-ul-Fuqaha.' The Prophet (PBUH) prayed: 'O Allah! Teach him religion and grant him understanding of the Quran.' He is the foundational authority for Quranic Tafseer."],
["E", "SYNONYM for: Scraggly", "Gaunt|Underweight|Slender|Spindly", 0, "Scraggly = thin, irregular, unkempt/jagged. Gaunt (thin and bony from hardship) is the closest synonym. Slender implies attractive thinness; underweight is clinical; spindly means long-thin but not unkempt."],
["E", "SYNONYM for: Catacomb", "Oasis|Haven|Crypt|Shrine", 2, "A catacomb is an underground tunnel-cemetery. A crypt (underground room under a church for burials) is the closest synonym. Oasis = fertile area; haven = safe place; shrine = sacred site of worship."],
["E", "SYNONYM for: Sobriquet", "Nickname|Formal name|Byname|Pseudonym", 0, "Sobriquet (French origin) = a nickname or informal name. 'Nickname' is the most direct synonym. A pseudonym is a deliberately assumed false name; byname is a secondary name — sobriquet specifically implies an informal/playful nickname."],
["E", "SYNONYM for: Metanoia", "Repentance|Conversion|Prostrate|Submission", 0, "Metanoia = transformative change of heart, repentance. In theology it means deep inward turning from wrong. 'Repentance' is the most precise synonym capturing the internal moral turning that metanoia denotes."],
["E", "SYNONYM for: Verisimilitude", "Realism|Artifice|Conceit|Actuality", 0, "Verisimilitude = the appearance of being true or real; lifelike quality. 'Realism' is the closest synonym. 'Actuality' means real existence (verisimilitude is the appearance of reality, not reality itself). Artifice = deception — opposite."],
["E", "ANTONYM for: Bastion", "Defenseless|Deformed|Destroyed|Demolished", 0, "Bastion = a stronghold or well-defended fortification. Its antonym is 'Defenseless' (without protection). Demolished/destroyed relate to physical destruction, not the concept of defense. Deformed is unrelated."],
["E", "ANTONYM for: Egregious", "Flagrant|Inconspicuous|Audacious|Blunt", 1, "Egregious = outstandingly bad, shockingly conspicuous. Antonym: 'Inconspicuous' (not readily noticeable). Flagrant is a synonym of egregious; audacious = bold; blunt = direct."],
["E", "ANTONYM for: Melange", "Harmonious|Homogeneous|Amorphous|Anomalous", 1, "Melange = a varied mixture/medley of different things. Antonym: 'Homogeneous' (uniform, of the same kind throughout). A melange is diverse/heterogeneous; homogeneous is the direct opposite. Amorphous = shapeless."],
["E", "ANTONYM for: Solipsist", "Self-Centered|Self-Absorbed|Selfless|Self-Stylist", 2, "A solipsist believes only in their own mind's existence — entirely self-centered. Antonym: 'Selfless' (concerned more with others than oneself). Self-centered and self-absorbed are synonyms of solipsist."],
["E", "ANTONYM for: Lionize", "Mistreat|Vilify|Lampoon|Ridicule", 1, "To lionize = to treat someone as a celebrity and give great admiration. Antonym: 'Vilify' (speak or write about someone in an abusively disparaging manner). Lampoon/ridicule involve mockery but don't directly oppose the glorification that lionize entails."],
["E", "Choose the grammatically CORRECT sentence about a new policy:", "The new policy has been implemented, nor has it been communicated to the staff.|The new policy has been implemented, but it has not been communicated to the staff.|The new policy has been implemented, yet it has not been communicated to the staff.|The new policy has been implemented, so it has not been communicated to the staff.", 1, "(A) Wrong — 'nor' requires a prior negative clause. (D) 'so' implies consequence — the opposite meaning. (B) correctly uses 'but' to show contrast between two positive facts. (C) 'yet' is possible but less natural; (B) is the standard correct form."],
["E", "Choose the correct sentence (dangling modifier — walking down the street):", "Walking down the street, the trees seemed to sway in the wind.|Walking down the street, I noticed the trees swaying in the wind.|Walking down the street, the wind caused the trees to sway.|Walking down the street, the swaying trees were noticed.", 1, "Dangling modifier rule: 'Walking down the street' must attach to the subject that is actually walking. In (A)(C)(D), the subject is trees/wind — none can walk. Only (B) places 'I' as the subject, correcting the dangling modifier."],
["E", "Choose the correct sentence (parallel structure — company values):", "The company values innovation, teamwork, and to take risks.|The company values innovation, teamwork, and taking risks.|The company values innovation, teamwork, and risk-taking.|The company values innovation, teamwork, and risks.", 1, "Parallel structure rule: all items in a list must be the same grammatical form. Innovation (noun), teamwork (noun), taking risks (gerund phrase) — (B) maintains parallel form. (A) breaks it with the infinitive 'to take.' (B) is the most naturally parallel answer."],
["E", "Choose the correct sentence (demonstrative pronouns — restaurants):", "These are the best restaurants in town, but those are too expensive.|This are the best restaurants in town, but those are too expensive.|These is the best restaurant in town, but those are too expensive.|This is the best restaurant in town, but those are too expensive.", 0, "'These' (plural demonstrative) pairs correctly with 'restaurants' (plural) and 'are' (plural verb). (B) uses 'This' (singular) with plural 'are' — error. (C) uses 'These' with singular 'is' — error. (A) has consistent plural agreement throughout."],
["E", "Choose the most grammatically and logically correct sentence (wish/hope about life):", "I wish I could find a way to make amends and secure a better afterlife.|I hope that my life will become more exciting in the time I have left.|I fear that my lack of excitement will lead to a dull eternity.|I wonder if there's still time to make a positive impact and change my fate.", 0, "(A) correctly uses the subjunctive 'wish I could' (expressing a desire about an uncertain situation). It is grammatically precise. The subjunctive mood after 'wish' requires 'could/would/were' — not 'will' or 'may' as in (B)."],
["E", "Choose the correct sentence (Baudrillard's concern — simulation):", "Simulation is Baudrillard's main concern, as even democracy needs exhibitionism and media twisting, authoritarianism is part of it.|Simulation is Baudrillard's main concern, even democracy needs exhibitionism and media twisting, so authoritarianism is part of it.|Simulation is Baudrillard's main concern, as democracy needs exhibitionism and media twisting, so authoritarianism is part of it.|Simulation is Baudrillard's main concern, as even democracy needs exhibitionism and media twisting, because authoritarianism is part of it.", 0, "(A) correctly uses 'as' for a causal clause and 'even' to emphasize that democracy too requires simulation. (B) lacks a conjunction before 'even democracy.' (C) drops 'even,' weakening the argument. (D) 'because' distorts logical causality."],
["E", "Fill in blanks: 'The emperor advocated the expostulation __ calamities and reanimate officeholders...Yuan Dynasty.'", "on, in|about, in|at, at|over, inside", 0, "'Expostulation on calamities' is the correct colocation — 'on' is the formal scholarly preposition for written discourse/commentary on a subject. 'In the Yuan Dynasty' correctly uses 'in' for a historical period. 'About' is informal; 'on' is the precise formal choice."],
["E", "Fill in blanks: 'The museum is situated both __ the square and __ the library.'", "on, beneath|on, under|at, underneath|around, above", 1, "'On the square' is standard idiom for being located at/on a public plaza. 'Under the library' implies physical position below or adjacent. 'Beneath/underneath' are more emphatic/literary; 'at' is less idiomatic for buildings on a named public square."],
["E", "Fill in blanks: 'The politician's lack of courage reeked __ opportunism...causing supporters __ lose faith...'", "off, of|of, to|in, in|away, to", 1, "Fixed collocation: 'reek OF' (one reeks of something — e.g., 'it reeked of corruption'). 'Causing someone TO [verb]' requires 'to' as the infinitive marker. 'Reeked off' is incorrect. Answer: (B) of, to."],
["E", "'Emit smoke from seven orifices' means:", "To be very happy|To be extremely angry|To be very sad|To be very tired", 1, "This is a Chinese idiom meaning to be so furious that smoke pours from all seven facial orifices. It describes extreme rage — equivalent to the English idiom 'fuming' or 'seeing red.'"],
["E", "'To sell wolf tickets' means:", "To be honest and authentic|To talk tough but not back it up|To be weak and timid|To be intelligent and wise", 1, "'Selling wolf tickets' is African-American slang meaning to bluff, brag, or make empty threats — talking tough without ability or intention to follow through. It originated in US prison slang — equivalent to 'all bark and no bite.'"],
["E", "'The carrots are cooked' means:", "The situation is under control|The situation is hopeless|The situation is changing|The situation is improving", 1, "'Les carottes sont cuites' (French) literally means the carrots are cooked — used to mean 'it's all over' / 'the situation is hopeless and cannot change.' Equivalent to 'it's done' in a fatalistic sense; similar to 'the die is cast.'"],
["E", "'Forty winks' means:", "A long, deep sleep|A short nap or brief period of sleep|A period of wakefulness|A dream or vision", 1, "'Forty winks' is a British idiom meaning a short nap or brief daytime sleep. The phrase dates to the 19th century. 'Winks' refers to the closing/opening of eyes. Equivalent to 'catnap' or 'power nap.'"],
["E", "'As clear as a dumpling broth' means:", "Something very clear and easy to understand|Something completely unclear or confusing|Something moderately clear|Something partially clear", 1, "Dumpling broth is typically cloudy and murky — this idiom (like 'clear as mud') means the opposite of clear: completely confusing or opaque. It is a sarcastic/ironic expression — 'as clear as a dumpling broth' = not clear at all."],
["M", "Evaluate: 4^(1/2) × 4² − 4⁰", "24|28|31|None of these", 2, "4^(1/2) = 2; 4² = 16; 4⁰ = 1. Using exponent law: 4^(1/2) × 4² = 4^(1/2+2) = 4^(5/2) = 32. Then 32 − 1 = 31. Answer is (C) 31."],
["M", "What is k, given that 27ᵏ = 9?", "1/3|2/3|4/3|None of these", 1, "27ᵏ = 9 → (3³)ᵏ = 3² → 3^(3k) = 3² → 3k = 2 → k = 2/3. Both 27 and 9 are powers of 3 — converting to the same base and equating exponents gives the solution directly."],
["M", "Cows consume food in 150 days. Remove 10 cows → food lasts 160 days. Original number of cows?", "150|160|100|None of these", 1, "Let n = original cows. Total food = 150n. With (n−10) cows for 160 days: 160(n−10) = 150n → 160n − 1600 = 150n → 10n = 1600 → n = 160. Answer: (B) 160."],
["M", "Train 99m long takes 11 sec to pass a station 231m long. Speed in km/h?", "108|75.6|30|None of these", 0, "Total distance = 99+231 = 330m in 11 sec → Speed = 330/11 = 30 m/s. Convert: 30 × 3600/1000 = 108 km/h."],
["M", "A, B, C share $112. B gets $12 less than A; C gets twice B. How much does C get?", "$34|$44|$50|None of these", 2, "Let A=x; B=x−12; C=2(x−12). Sum: x+(x−12)+2(x−12)=112 → 4x−36=112 → x=37. B=25; C=50. Verify: 37+25+50=112 ✓. C gets $50."],
["M", "Find integer: four times the number subtracted from two times its square = 15.", "3|-3|-5/3|None of these", 3, "2x²−4x=15 → 2x²−4x−15=0. Discriminant=16+120=136. No integer solution from quadratic formula. Checking given options: x=3 → 18−12=6≠15; x=−3 → 18+12=30≠15. Answer: (D) None of these. No integer solution exists."],
["M", "Zaid is 6× as old as Zoya now. In 7 years, sum of ages = 49. How old was Zaid when Zoya was born?", "25|35|42|None of these", 0, "Let Zoya=z; Zaid=6z. In 7 yrs: (6z+7)+(z+7)=49 → 7z=35 → z=5. Zoya=5 now; Zaid=30 now. When Zoya was born (5 yrs ago): Zaid was 30−5=25."],
["M", "Two consecutive positive numbers: sum of squares = 7 less than 120. Find them.", "7, 8|8, 9|7, 9|None of these", 0, "Sum of squares = 120−7 = 113. Check 7,8: 49+64=113 ✓. Check 8,9: 64+81=145 ✗. Answer: 7 and 8."],
["M", "Shop sold 25% of lights; 1,500 remain. How many originally?", "2500|2250|2000|None of these", 2, "If 25% sold, 75% remain. 75% of total = 1500 → Total = 1500/0.75 = 2000. Answer: (C) 2000."],
["M", "Given x² − 11x + 10 = 0, then x is:", "−1, −10|−1, +10|+1, −10|None of these (+1, +10)", 3, "Factor: (x−1)(x−10)=0 → x=1 or x=10. Verify: 1−11+10=0 ✓; 100−110+10=0 ✓. Roots are +1 and +10. Answer: (D) None of these — correct roots are +1 and +10."],
["M", "5 markers + 1 pencil = Rs.245; 3 markers + 3 pencils = Rs.327. Cost of one marker?", "Rs. 32|Rs. 34|Rs. 74|None of these", 1, "5m+p=245 → p=245−5m. m+p=109 (dividing eq2 by 3). m+(245−5m)=109 → 245−4m=109 → 4m=136 → m=Rs.34. Verify: p=75; 5(34)+75=245 ✓; 3(34)+3(75)=327 ✓."],
["M", "Sequence: T1=1, T2=5. From T3, each term = arithmetic mean of all preceding. What is the 27th term?", "2.5|3|5.5|None of these", 1, "T3=(1+5)/2=3. T4=(1+5+3)/3=3. From T3 onwards, each new term equals 3 (the running average stabilizes). So the 27th term = 3."],
["M", "Small cake=$x; large cake=$(2x+3). 3 small + 2 large = $16.36. Cost of one small?", "$1.91|$1.48|$2.34|None of these", 1, "3x+2(2x+3)=16.36 → 7x+6=16.36 → 7x=10.36 → x=$1.48. Verify: 3(1.48)+2(2.96+3)=4.44+11.92=16.36 ✓. Answer: (B) $1.48."],
["M", "If one angle of an isosceles triangle is 68°, possible values of the second angle are:", "Any value between 68° and 180°|Any value between 68° and 112°|Any value between 1° and 112°|None of these", 3, "If 68° is base angle: other base=68°, apex=44°. If 68° is apex: each base=(180−68)/2=56°. So second angle is specifically 68° or 44° or 56° — not any range. Answer: (D) None of these — specific values apply."],
["M", "Total perimeter of a semicircle is 20.6 cm. Approximate radius?", "4 cm|5 cm|6.6 cm|None of these", 0, "Perimeter = r(π+2). 20.6=r(5.1416) → r=20.6/5.1416≈4.005≈4 cm. Answer: (A) 4 cm."],
["M", "Water tank (cuboid): length 1.5m, width 1.0m, depth 60cm. How many litres?", "900 litres|90 litres|90 litres|None of these", 0, "Volume=1.5×1.0×0.6=0.9 m³. 1 m³=1000 litres. 0.9×1000=900 litres. Answer: (A) 900 litres."],
["M", "Inner circumference of circular race track = 440m. Width = 14m. Radius of outer circle?", "70m|77m|84m|None of these", 2, "Inner radius: 2πr=440 → r=440/(2×22/7)=70m. Outer radius=70+14=84m. Answer: (C) 84m."],
["M", "200 people: 90 like tennis, 108 like cricket, 46 like both. How many like neither?", "44|48|62|None of these", 1, "Union=90+108−46=152. Neither=200−152=48. Answer: (B) 48."],
["M", "450 visitors on Mondays, 120 on other 6 days. 30-day month starting Monday. Daily average?", "164|160|175|None of these", 2, "30-day month starting Monday has 5 Mondays (days 1,8,15,22,29) and 25 other days. Total=5×450+25×120=2250+3000=5250. Average=5250/30=175. Answer: (C) 175."],
["M", "A is B's daughter; C is B's mother; D is B's sister; E is D's son. How is A related to E?", "Uncle|Grand daughter|Cousin|None of these", 2, "B's daughter=A. B's sister=D. D's son=E. A's parent (B) and E's parent (D) are siblings → A and E are first cousins. Answer: (C) Cousin."],
["M", "'I have no brother, and that girl's father is my father's son.' Whose photograph was it?", "His father|His own|His daughter|None of these", 2, "No brother → 'my father's son' = the man himself. 'That girl's father is [the man]' → the girl is his daughter. Photograph is of his daughter."],
["M", "Bus every 52 min. Last bus 16 min ago; next at 08:15pm. What time did the officer speak?", "07:23 pm|07:39 pm|07:49 pm|None of these", 1, "Next bus 08:15pm. Previous bus: 08:15−52min=07:23pm. Officer says bus left 16 min ago → current time=07:23+16=07:39pm. Verify: 07:39+36min=08:15 ✓ (52−16=36 min remaining)."],
["M", "Peter East of Tom. Tom North of John. Mike South of John. Mike is in which direction of Peter?", "South-East|South-West|South|None of these", 1, "Peter=East of Tom; Tom=North of John; Mike=South of John (even further south). Peter is East+North relative to Mike. Therefore Mike is South-West of Peter."],
["M", "Schedule (G after H, K before G, M before L, M adj. J): If Literature before Kinetics, History is in position:", "First|Third|Fifth|None of these", 2, "Constraints: H-G consecutive; K before G; M before L; M adj J. If L before K: valid order = L,M,J,K,H,G. History (H) is in position 5. All constraints satisfied with Literature (1st) earlier than Kinetics (4th)."],
["M", "Six girls in circle: R between N&S; P next left of V; R 4th right of P. Position of T?", "Immediate right of V|Second to left of P|Second to right of R|None of these", 0, "Placing: P,V,_,_,R,_ in circle (R is 4th right of P). R between N and S: order P,V,N,S,R,T or P,V,S,N,R,T. T fills the 6th spot. T is immediately to the right of V in the circular arrangement. Answer: (A)."],
["M", "Roni: 100m in 45 sec; Willy: 100m in 36 sec. Willy beats Roni by how much distance?", "20m|22.5m|25m|None of these", 0, "When Willy finishes (36 sec), Roni has run=(100/45)×36=80m. Willy at 100m, Roni at 80m. Willy beats by 20m. Answer: (A) 20m."],
["M", "Sequence: a, 13, 9, 3, −5, −15, b. Find a and b.", "15, −25|15, −27|16, −28|None of these", 1, "Differences: −4,−6,−8,−10 (decreasing by 2 each time). First difference=13−a=−2 → a=15. Next difference after −10 = −12: b=−15+(−12)=−27. Answer: (B) 15, −27."],
["M", "Sum of prime numbers less than 21?", "58|64|77|None of these", 2, "Primes <21: 2,3,5,7,11,13,17,19. Sum=2+3+5+7+11+13+17+19=77. Answer: (C) 77."],
["M", "Old generation (born 1965–1981) can do tasks independently; called Entrepreneurial generation. Logical conclusion?", "They have a natural tendency of being self-employed|They work harder than any recent generation|They require some assistance to do tasks|None of these", 0, "'Entrepreneurial generation' + 'do most tasks independently' directly implies self-employment tendency. (B) is a comparison not stated in the premise. (C) contradicts 'independently.' The label 'Entrepreneurial' logically supports (A)."],
["M", "Evaluate: 3(−4 × 5 − 6)", "12|−78|−15|None of these", 1, "Inside bracket: −4×5=−20; −20−6=−26. Then: 3×(−26)=−78. Answer: (B) −78."],
["M", "Arrange smallest to largest: (i)(0.5)² (ii)0.5 (iii)(0.5)³ (iv)√0.5", "iv, ii, i, iii|iii, i, ii, iv|ii, i, iii, iv|None of these", 1, "Values: (i)0.25; (ii)0.5; (iii)0.125; (iv)√0.5≈0.794. Ascending: 0.125<0.25<0.5<0.794 → iii, i, ii, iv. Answer: (B)."],
["M", "200 trees in 30 days (group 1). After removing 20 workers, 200 trees in 40 days. Original group size?", "60|70|80|None of these", 2, "Work=workers×days. 30n=40(n−20) → 30n=40n−800 → 10n=800 → n=80. Answer: (C) 80 workers."],
["M", "Noon temperature in Murree: 16.6°C. Midnight is 20.4°C lower. Midnight temperature?", "−4.8°C|−4.2°C|−3.8°C|None of these", 2, "16.6−20.4=−3.8°C. Answer: (C) −3.8°C."],
["M", "Roni has 25 sweets; Tony has 55. How many should Roni give Tony so Tony has 4× Roni?", "5|7|9|None of these", 2, "Let Roni give x sweets. Tony:55+x; Roni:25−x. Condition: 55+x=4(25−x) → 55+x=100−4x → 5x=45 → x=9. Verify: Tony=64; Roni=16; 64=4×16 ✓. Answer: (C) 9."],
["M", "Divide 45 into two parts such that 4× one part is 9 less than 5× the other.", "20, 25|21, 24|19, 26|None of these", 1, "Let parts=x and 45−x. 4x=5(45−x)−9 → 4x=225−5x−9 → 9x=216 → x=24. Parts: 24 and 21. Verify: 4×24=96; 5×21−9=96 ✓. Answer: (B) 21, 24."],
["M", "Man is 5× as old as son now. 4 years ago, product of ages = 52. Present ages?", "8 and 40|7 and 35|6 and 30|None of these", 2, "Son=s; Father=5s. 4 yrs ago: (5s−4)(s−4)=52 → 5s²−24s+16=52 → 5s²−24s−36=0. Discriminant=576+720=1296. s=(24+36)/10=6. Son=6, Father=30. Verify: (30−4)(6−4)=26×2=52 ✓. Answer: (C) 6 and 30."],
["M", "John is 4 yrs older than David; Joe is 2 yrs younger than David. Sum=44. How old will John be in 8 years?", "24|25|17|None of these", 3, "David=d; John=d+4; Joe=d−2. Sum: (d+4)+d+(d−2)=44 → 3d+2=44 → d=14. John now=18. In 8 yrs=26. Answer: (D) None of these — John will be 26."],
["M", "Integer values of n given −7 < 4n ≤ 8?", "−1, 0, 1, 2|−2, −1, 0, 1, 2|−6 to 8|None of these", 0, "Divide by 4: −7/4 < n ≤ 2 → −1.75 < n ≤ 2. Integer values: −1, 0, 1, 2. Answer: (A)."],
["M", "Student spends 15% on food, 45% on tuition. Then 50% of remaining on hostel. Left: Rs.8000. Scholarship?", "32,000|40,000|45,000|None of these", 1, "After food+tuition (60%): remaining=40%. After hostel (50% of 40%=20%): left=20%. 20% of total=8000 → Total=Rs.40,000. Answer: (B)."],
["M", "Find a²+b², when a+b=5 and ab=6.", "37|25|13|None of these", 2, "(a+b)²=a²+2ab+b². So a²+b²=(a+b)²−2ab=25−12=13. Answer: (C) 13."],
["M", "y=x²+8x−5 written as (x+a)²+b. Find a.", "8|5|4|None of these", 2, "Complete the square: x²+8x−5=(x+4)²−16−5=(x+4)²−21. So a=4, b=−21. Answer: (C) 4."],
["M", "Find x when A=(2π+y)x², where A=36 and y=2.77.", "3|4|2|None of these", 2, "36=(2π+2.77)x²=(6.2832+2.77)x²=9.0532x² → x²=36/9.0532≈3.977 → x≈1.99≈2. Answer: (C) 2."],
["M", "Child ticket=adult−Rs.240. 18,500 adults+2,500 children. Total=Rs.41,440,000. Adult ticket price?", "Rs. 2460|Rs. 1940|Rs. 2000|None of these", 2, "18500a+2500(a−240)=41,440,000 → 21000a=41,440,000+600,000=42,040,000 → a≈Rs.2002≈Rs.2000. Answer: (C) Rs. 2000."],
["M", "Name the regular polygon with exterior angle 36°.", "Pentagon|Hexagon|Decagon|None of these", 2, "Number of sides=360/36=10. A 10-sided polygon is a Decagon. Answer: (C) Decagon."],
["M", "Perimeter of semicircle lake with radius 700m?", "127.4 km|3.6 km|2.9 km|None of these", 1, "Perimeter=r(π+2)=700×(3.1416+2)=700×5.1416=3599m≈3.6 km. Answer: (B) 3.6 km."],
["M", "Total surface area of cylinder with radius 3.5cm and height 5.5cm?", "211.5 cm²|198 cm²|121 cm²|None of these", 1, "TSA=2πr(h+r)=2×(22/7)×3.5×(5.5+3.5)=2×22×0.5×9=198 cm². Answer: (B) 198 cm²."],
["M", "30 bicycles: 27 passed lights, 21 passed brakes, 1 failed both. How many passed both?", "19|21|20|None of these", 0, "Let x=passed both. (27−x)+(21−x)+x+1=30 → 49−x=30 → x=19. Answer: (A) 19."],
["M", "Box: 8 red, 6 green, 7 blue toys. Probability of picking neither red nor green?", "7/21|14/21|7/14|None of these", 0, "Total=21. Neither red nor green=blue=7. P=7/21=1/3. Answer: (A) 7/21."],
["M", "P is brother of Q and R. S is mother of R. T is father of P. Which statement is NOT exactly true?", "T is Q's father|P is S's son|S is P's mother|Q is T's son", 3, "T is father of P→also Q's and R's father (A ✓). S is mother of R→also P's and Q's mother (B ✓; C ✓). (D) 'Q is T's son' — Q's gender not specified. Q could be a daughter. 'Son' is not exactly true as stated. Answer: (D)."],
["M", "Salma>Mehak only; Adil>Badar>Dawood. Who has the highest amount?", "Badar|Dawood|Adil|None of these", 2, "Adil>Badar>Dawood. Salma has more than only Mehak → 4th in overall ranking. Order: Adil>Badar>Dawood>Salma>Mehak. Adil has the highest amount."],
["M", "Given: PQS, QRT, RSU, STV... What follows?", "TUV|SUV|STU|None of these", 0, "Pattern in each triplet: 1st letters P,Q,R,S→T; 2nd letters Q,R,S,T→U; 3rd letters S,T,U,V→V. Next triplet: T,U,V. Answer: (A) TUV."],
["M", "Clock at 6:00pm: hour hand points NE. Where does minute hand point at 9:15pm?", "South-East|North-West|South-West|None of these", 2, "At 6:00pm, hour hand (at 6 o'clock position) points NE → clock's 6=NE. At 9:15pm, minute hand points at 3 (15 min). Clock's 3 is directly opposite to 9. Clock's 9=SW (opposite of NE). So minute hand points SW. Answer: (C)."],
["M", "Boxes: 20kg, 30kg, 50kg, 70kg. Which combination weight is impossible?", "170 kg|160 kg|150 kg|None of these", 1, "All possible combinations: singles(20,30,50,70), pairs(50,60,70,80,90,100,120), triples(100,120,140,150), all four(170). 160 kg cannot be made from any combination. Answer: (B) 160 kg."],
["M", "Number 5109238674: positions 1↔6, 2↔7, 3↔8, 4↔9, 5↔10 interchanged. 3rd digit from right?", "9|0|6|None of these", 1, "Original: 5(1)1(2)0(3)9(4)2(5)3(6)8(7)6(8)7(9)4(10). After swap: pos1←3, pos2←8, pos3←6, pos4←7, pos5←4, pos6←5, pos7←1, pos8←0, pos9←9, pos10←2. New number: 3867451092. Right to left: 2(1st), 9(2nd), 0(3rd). 3rd from right=0. Answer: (B) 0."],
["M", "16 men+12 women complete work in 20 days. 18 women complete same work in 40 days. Days for 12 men+27 women?", "16|18|21|None of these", 0, "1 woman's work/day=1/(18×40)=1/720. From eq1: 16M+12W=1/20. 12W=12/720=1/60. 16M=1/20−1/60=2/60=1/30 → 1M=1/480. 12M+27W=12/480+27/720=1/40+3/80=5/80=1/16. Days=16. Answer: (A) 16."],
["M", "Capsule Vitamin C doesn't have same effect as fresh fruit Vitamin C. What logically follows?", "Only (i): Sale of capsule Vitamin C should be banned.|Only (ii): People should eat fresh fruits and vegetables for Vitamin C.|Neither (i) nor (ii) follows.|Both (i) and (ii) follow.", 1, "(i) Banning capsule Vitamin C is extreme — the statement says it's less beneficial, not harmful. Banning is not a logical conclusion. (ii) Encouraging fresh fruits is a direct, moderate, and logical conclusion from the research finding. Only (ii) follows."],
["M", "Next term in the series: 11, 20, 38, 56, 83?", "108|116|127|None of these", 3, "Differences: 9, 18, 18, 27. Pattern: differences increase by 9 every alternate step (+9,+18,+18,+27,+27...). Next difference=27 → 83+27=110. Answer: (D) None of these — the next term is 110."],
["S", "If output voltage > input voltage, the transformer is:", "Step up|Step down|Faulty|None of these", 0, "A step-up transformer increases voltage from primary (input) to secondary (output) coil by having more turns in the secondary. Vout/Vin=Nsecondary/Nprimary. Higher output voltage = step-up transformer."],
["S", "The voltage signal generated by a microphone is called:", "Digital|Analogue|Hybrid|None of these", 1, "A microphone converts sound waves into continuous electrical signals — these are analogue signals varying continuously in amplitude and frequency, mirroring the original sound. Digital signals are discrete (0s and 1s), produced only after ADC conversion."],
["S", "Third most common gas in air we breathe is:", "Hydrogen|Neon|Argon|None of these", 2, "Atmospheric composition: Nitrogen (78%), Oxygen (21%), Argon (0.93%), CO₂ (0.04%). Argon, a noble gas, is the third most abundant gas in Earth's atmosphere."],
["S", "Electromagnetic radiation with maximum wavelength is:", "Ultraviolet|Radio waves|Infrared|None of these", 1, "In the electromagnetic spectrum, radio waves have the longest wavelength (up to thousands of meters) and the lowest frequency. Order (shortest to longest wavelength): Gamma→X-ray→UV→Visible→Infrared→Microwave→Radio."],
["S", "The most dangerous type of radiation is:", "Alpha radiation|Beta radiation|Gamma radiation|None of these", 2, "Gamma radiation is the most penetrating ionizing radiation — it can pass through the human body and requires lead or thick concrete to block. Alpha is stopped by skin; beta by thin aluminum. Gamma causes DNA damage and cancer from external exposure."],
["S", "Solar energy is radiated in the form of:", "Electromagnetic waves|Transverse waves|Infrared waves|None of these", 0, "Solar energy is radiated as electromagnetic waves — covering the entire electromagnetic spectrum (visible light, UV, infrared, X-rays, etc.). While EM waves are also transverse, (A) is the more comprehensive and scientifically precise answer."],
["S", "The study of human body cells is called:", "Physiology|Cytology|Mycology|None of these", 1, "Cytology (from Greek 'kytos'=cell) is the branch of biology dealing with cell structure and function. Physiology studies organism functions; Mycology studies fungi; Histology studies tissues. Cytology is correct."],
["S", "Excessive bleeding during injury is due to deficiency of:", "Vitamin B|Vitamin K|Vitamin E|None of these", 1, "Vitamin K is essential for blood clotting. It activates coagulation factors II, VII, IX, and X. Deficiency leads to impaired clotting and excessive bleeding. 'K' comes from German 'Koagulation.' Warfarin (blood thinner) works by inhibiting Vitamin K."],
["S", "Which fuel is used in gas welding?", "Acetylene|Methane|Ethylene|None of these", 0, "Oxy-acetylene welding uses acetylene (C₂H₂) combined with oxygen, producing a flame of ~3500°C — hot enough to melt steel. Acetylene stored dissolved in acetone produces the hottest and most concentrated flame of any fuel gas."],
["S", "Drum printers belong to which category?", "Ink jet printer|Laser printer|Line printer|None of these", 2, "Drum printers are a type of line printer — they print an entire line at once using a rotating drum with characters embossed on its surface. They are impact printers, fast for their era. Line printers include drum, chain, and band types."],
["S", "Machine learning is a sub-area of:", "Hardware Engineering|Artificial Intelligence|Cyber Forensics|None of these", 1, "Machine Learning (ML) is a subset of Artificial Intelligence (AI) that enables systems to learn from data without being explicitly programmed. Hierarchy: AI ⊃ Machine Learning ⊃ Deep Learning."],
["S", "Which can be classified as a renewable energy source?", "Geothermal energy|Tidal energy|Biomass energy|All of these", 3, "All three are renewable: Geothermal uses Earth's continuously replenished internal heat. Tidal uses gravitational forces of Moon/Sun (inexhaustible). Biomass is organic material that can be continuously grown. All qualify under international energy classifications."],
["S", "How do scientists know Earth's core is made of metal?", "Density of surface layer is much less than Earth's average density.|Earth's rotation speed indicates core structure.|Density of surface layer is greater than total density.|None of these", 0, "Earth's surface rocks average ~2.7–3 g/cm³, but Earth's average density is ~5.5 g/cm³. This discrepancy means the interior must contain much denser material — consistent with an iron-nickel metallic core (~10–13 g/cm³). Seismic waves confirm the structure."],
["S", "Maintenance of soil fertility without extra nutrition is due to:", "Floods|Crop residue|Microbial activity|None of these", 2, "Soil microorganisms (bacteria, fungi, actinomycetes) break down organic matter, fix atmospheric nitrogen, and cycle nutrients — naturally maintaining fertility. Nitrogen-fixing bacteria (Rhizobium, Azotobacter) convert N (RA) to plant-available forms without fertilizers."],
["S", "Nanocomposite materials prevent packaged food damage due to:", "Oxygen|Carbon dioxide|Moisture|All of these", 3, "Nanocomposite packaging (e.g., clay nanocomposites) provides barrier properties against oxygen, moisture, and gases including CO₂. They improve shelf life by blocking gas permeation via tortuous path mechanisms. Used in beer bottles, food wraps, and meat packaging."],
["S", "Which statement about vitamins is TRUE?", "Water-soluble vitamins cannot be stored in the body|Fat-soluble vitamins can be stored in the body|Body can absorb more of fat-soluble vitamins than required|All of these", 3, "All three are true. (A) Water-soluble (C, B-complex) vitamins are excreted in urine and not stored. (B) Fat-soluble (A,D,E,K) vitamins are stored in liver and fatty tissues. (C) Excess fat-soluble vitamins accumulate, potentially causing toxicity (hypervitaminosis A or D)."],
["C", "Global agreement signed in 2015 to limit warming to well below 2°C above pre-industrial levels?", "Kyoto Protocol|Paris Agreement|Copenhagen Accord|None of these", 1, "The Paris Agreement was adopted at COP21 in December 2015 (entered into force November 2016). Goal: limit temperature rise to well below 2°C (pursuing 1.5°C). 196 parties signed it. The Kyoto Protocol (1997) was its predecessor."],
["C", "Which organization is responsible for the B3W (Build Back Better World) Initiative?", "United Nations (UN)|Group of Seven (G7)|NATO|None of these", 1, "B3W was launched by the G7 at the Cornwall Summit (June 2021) as a high-standard infrastructure partnership for developing nations. It was later rebranded as the 'Partnership for Global Infrastructure and Investment' (PGII) in 2022."],
["C", "How many points were in China's 2023 Peace Plan for Ukraine?", "6|10|12|None of these", 2, "China's 12-point peace plan for Ukraine was released on February 24, 2023 (exactly one year after Russia's invasion). It called for ceasefire, peace talks, opposition to nuclear threats, and rejection of unilateral sanctions."],
["C", "What describes the use of information warfare and disinformation to undermine other countries?", "Soft power|Sharp power|Smart power|None of these", 1, "'Sharp power' was coined by the National Endowment for Democracy (2017) to describe authoritarian states' use of manipulation and disinformation — as opposed to 'soft power' (attraction) or 'hard power' (coercion). China and Russia are frequently cited examples."],
["C", "RCEP is a free trade agreement among nations of:", "North America|Europe|Asia-Pacific|None of these", 2, "RCEP (signed November 2020, effective January 2022) is the world's largest FTA comprising 15 Asia-Pacific nations: 10 ASEAN members + China, Japan, South Korea, Australia, and New Zealand. Covers ~30% of global GDP. India withdrew in 2019."],
["C", "The AIIB was established by:", "Asian Development Bank|ASEAN|Group of Seven (G7) countries|China and some other Asian countries", 3, "AIIB was proposed by China in 2013, established in 2015, with headquarters in Beijing. Began operations January 2016. China is the largest shareholder. Conceived as a China-led alternative to the World Bank and ADB, now with 109 approved members."],
["C", "What does the 'I2-U2' alliance stand for?", "India-Israel-Ukraine-US|India-Israel-US-UAE|Italy-Israel-Ukraine-UK|None of these", 1, "I2U2 (West Asia Quad) comprises India, Israel, UAE, and the United States. Formally launched July 2022. Focuses on joint investments in water, energy, transportation, space, health, and food security across the Middle East and South Asia."],
["C", "'G-2 or Group of Two' is an informal diplomacy between:", "Germany and Greece|US and China|Germany and Ghana|None of these", 1, "The G-2 concept refers to bilateral diplomacy between the United States and China — the world's two largest economies. Proposed by economist Fred Bergsten in 2008, suggesting US-China cooperation is essential for managing global challenges."],
["C", "Which country hosted the SCO Foreign Ministers Council meeting in 2023?", "China|India|Uzbekistan|None of these", 1, "India held the SCO Chairmanship 2022–2023. The SCO Council of Foreign Ministers meeting was held in Goa, India, in May 2023. The SCO Summit was held virtually in July 2023, also chaired by India."],
["C", "BRI consists of the Silk Road Economic Belt and:", "The Desert Oasis Corridor|The Himalayan Trade Route|The 21st Century Maritime Silk Road|None of these", 2, "China's BRI (announced 2013) has two pillars: (1) The Silk Road Economic Belt — overland routes via Central Asia; (2) The 21st Century Maritime Silk Road — sea routes through Southeast Asia, South Asia, Africa, and Europe. CPEC is one of BRI's six economic corridors."],
["C", "When was 'Made in China 2025' initiated?", "2010|2015|2020|None of these", 1, "'Made in China 2025' was announced by Premier Li Keqiang in May 2015. It aims to upgrade manufacturing in 10 high-tech sectors (robotics, AI, semiconductors, aerospace) by 2025. Modeled on Germany's 'Industrie 4.0.'"],
["C", "Djibouti is strategically located at the mouth of which sea?", "Mediterranean Sea|South China Sea|Red Sea|None of these", 2, "Djibouti is at the southern entrance of the Red Sea at the Bab-el-Mandeb strait — one of the world's most strategic chokepoints. Multiple nations (US, France, China, Japan) maintain military bases there."],
["C", "The Horn of Africa (HoA) is located in which part of Africa?", "Eastern Africa|Western Africa|Northern Africa|None of these", 0, "The Horn of Africa is a peninsula in Northeast/Eastern Africa jutting into the Arabian Sea. It includes Djibouti, Eritrea, Ethiopia, and Somalia — the easternmost point of the African continent. Vital for Red Sea and Indian Ocean trade routes."],
["C", "SEATO formally came to an end in:", "1977|1968|1991|None of These", 0, "SEATO was established in 1954 (Manila Treaty) and officially dissolved on June 30, 1977. Weakened by the Vietnam War's outcome and US disengagement from the region. Pakistan was a member until 1972."],
["C", "What does 'CARICOM' stand for?", "Canada, Austria, Romania, Indie-Community|Caribbean Community|Canada, Argentina, Russia, Italy-Community|None of these", 1, "CARICOM (Caribbean Community) is a political and economic union of 15 Caribbean nations, established by the Treaty of Chaguaramas in 1973. Members include Jamaica, Trinidad and Tobago, Barbados, Guyana, and others."],
["C", "What does BECA stand for?", "Basic Exchange and Cooperation Agreement|Bilateral Exchange and Cooperation Accord|Basic Economic and Cultural Agreement|None of these", 0, "BECA (Basic Exchange and Cooperation Agreement for Geo-Spatial Cooperation) is a US-India defense agreement signed in October 2020. It allows sharing of advanced geospatial intelligence, maps, and satellite data. One of four US foundational defense agreements with India."],
["C", "Which nation is the top investor in Africa by 2023?", "United States|China|Russia|None of these", 1, "China has been Africa's largest trading partner since 2009 and its top foreign investor. BRI projects have pumped hundreds of billions into 50+ African nations. China-Africa trade exceeded $282 billion in 2023."],
["C", "Which shipping lane connecting Arabian Sea to Persian Gulf passes through Pakistani waters?", "Strait of Hormuz|Gulf of Aden|The Bab-el-Mandeb|None of these", 0, "The Strait of Hormuz connects the Persian Gulf to the Gulf of Oman and Arabian Sea. About 20% of world's oil passes through it. Shipping from Pakistan's ports (including Gwadar) uses this route for access to/from the Persian Gulf."],

const $=id=>document.getElementById(id);
let mode="ALL",list=[],i=0,sc=0,log=[];
const modes=[["ALL","Full mixed (200)"],["M","Maths & Reasoning"],["E","English"],["G","GK"],["S","Science"],["C","Current Affairs"],["P","Pakistan Affairs"],["I","Islamic Studies"]];
$("chips").innerHTML=modes.map(m=>`<button class="chip${m[0]=="ALL"?" on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;mode=b.dataset.m;[...$("chips").children].forEach(c=>c.classList.toggle("on",c===b))};
function show(id){["home","play","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function start(){
  list=Q.filter(q=>mode=="ALL"||q[0]==mode);
  if($("shuf").checked)list=list.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  i=0;sc=0;log=[];show("play");render();
}
function render(){
  const q=list[i],o=q[2].split("|").filter(Boolean);
  $("cnt").textContent=`Question ${i+1} / ${list.length}`;$("scr").textContent=`Score: ${sc}`;
  $("pb").style.width=(i/list.length*100)+"%";
  $("tg").textContent=N[q[0]];$("qt").textContent=q[1];
  $("ex").classList.add("hide");$("nx").classList.add("hide");
  $("opts").innerHTML="";
  o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.textContent=String.fromCharCode(65+k)+") "+t;b.onclick=()=>pick(k,b);$("opts").appendChild(b)});
}
function pick(k,btn){
  const q=list[i],bs=[...$("opts").children];
  bs.forEach(b=>b.disabled=true);
  const good=k===q[3];
  if(good){sc++;btn.classList.add("ok")}else{btn.classList.add("no");bs[q[3]].classList.add("ok")}
  log.push([q,k,good]);
  $("scr").textContent=`Score: ${sc}`;
  $("ex").innerHTML=`<b>${good?"Correct.":"Incorrect."}</b> ${q[4]}`;$("ex").classList.remove("hide");
  $("nx").textContent=i+1<list.length?"Next":"See result";$("nx").classList.remove("hide");
}
$("nx").onclick=()=>{i++;if(i<list.length)render();else finish()};
function finish(){
  show("end");const p=Math.round(sc/list.length*100);
  $("fs").textContent=`${sc} / ${list.length} (${p}%)`;
  $("fm").textContent=p>=80?"Excellent — exam ready.":p>=60?"Good — revise the missed topics.":"Keep practising — review the explanations.";
  $("rev").classList.add("hide");
  $("rev").innerHTML=log.map((l,n)=>{const o=l[0][2].split("|");return `<div class="rv"><b class="${l[2]?"ok":"no"}">${n+1}. ${l[2]?"✓":"✗"}</b> ${l[0][1]}<br><span class="sub">Answer: ${o[l[0][3]]} — ${l[0][4]}</span></div>`}).join("");
}
$("revb").onclick=()=>$("rev").classList.toggle("hide");
$("start").onclick=start;$("again").onclick=()=>show("home");
</script></body></html>
