<!DOCTYPE html>
<html lang="en">
<head>

<title>CSS/FPSC MPT Quiz — Set 8</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

<script>
const QUESTIONS = [{"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan came into existence on:", "opts": ["14 August 1947", "15 August 1947", "23 March 1947", "11 September 1947"], "ans": 0, "exp": "Pakistan gained independence on 14 August 1947."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Lahore Resolution was passed on:", "opts": ["23 March 1940", "14 August 1947", "23 March 1956", "29 July 1945"], "ans": 0, "exp": "The Lahore Resolution (also called the Pakistan Resolution) was passed on 23 March 1940."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's first Constitution was enforced in:", "opts": ["1947", "1956", "1962", "1973"], "ans": 1, "exp": "Pakistan's first Constitution was enforced on 23 March 1956, making it an Islamic Republic."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The current Constitution of Pakistan was enforced in:", "opts": ["1956", "1962", "1973", "1985"], "ans": 2, "exp": "The 1973 Constitution, still in force today (with amendments), was enforced on 14 August 1973."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan conducted its first nuclear tests (Chagai-I) in:", "opts": ["1971", "1988", "1998", "2001"], "ans": 2, "exp": "Pakistan conducted its first nuclear tests at Chagai, Balochistan, on 28 May 1998."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The separation of East Pakistan (Bangladesh) occurred in:", "opts": ["1965", "1969", "1971", "1973"], "ans": 2, "exp": "East Pakistan separated to become Bangladesh on 16 December 1971, following the 1971 war."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Suez Crisis, which influenced Pakistan's early foreign policy debates, occurred in:", "opts": ["1952", "1956", "1960", "1962"], "ans": 1, "exp": "The Suez Crisis occurred in 1956 when Egypt nationalised the Suez Canal, prompting international intervention."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "General Zia-ul-Haq imposed Martial Law in:", "opts": ["1971", "1977", "1985", "1988"], "ans": 1, "exp": "General Zia-ul-Haq imposed Martial Law on 5 July 1977, overthrowing Zulfikar Ali Bhutto's government."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The 18th Amendment to the Constitution, a landmark in provincial autonomy, was passed in:", "opts": ["2008", "2010", "2013", "2015"], "ans": 1, "exp": "The 18th Amendment was passed in April 2010, significantly devolving powers to the provinces."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "CPEC (China-Pakistan Economic Corridor) was formally launched in:", "opts": ["2013", "2015", "2017", "2019"], "ans": 1, "exp": "CPEC was formally launched in April 2015 during President Xi Jinping's visit to Pakistan."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Objectives Resolution was passed by the Constituent Assembly in:", "opts": ["1947", "1949", "1956", "1962"], "ans": 1, "exp": "The Objectives Resolution was passed on 12 March 1949, laying the ideological foundation for future constitutions."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan became a member of the United Nations in:", "opts": ["1945", "1947", "1948", "1950"], "ans": 1, "exp": "Pakistan was admitted to the United Nations on 30 September 1947."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Tashkent Declaration between Pakistan and India was signed in:", "opts": ["1965", "1966", "1971", "1972"], "ans": 1, "exp": "The Tashkent Declaration was signed on 10 January 1966, ending the 1965 war."}, {"section": "International Relations", "q": "The headquarters of UNICEF (United Nations Children's Fund) is located in:", "opts": ["Geneva", "New York", "Paris", "Rome"], "ans": 1, "exp": "UNICEF is headquartered in New York City, USA."}, {"section": "International Relations", "q": "The International Court of Justice (ICJ) is headquartered in:", "opts": ["Geneva", "Brussels", "The Hague", "Vienna"], "ans": 2, "exp": "The ICJ is headquartered in The Hague, Netherlands."}, {"section": "International Relations", "q": "ECO (Economic Cooperation Organisation), of which Pakistan is a founding member, primarily includes countries from:", "opts": ["Western Europe", "South Asia, Central Asia, and the Middle East", "Sub-Saharan Africa", "South America"], "ans": 1, "exp": "ECO, founded in 1985 by Pakistan, Iran, and Turkey, has since expanded to include Central Asian and other regional states."}, {"section": "International Relations", "q": "The headquarters of OIC (Organisation of Islamic Cooperation) is located in:", "opts": ["Makkah", "Jeddah", "Cairo", "Istanbul"], "ans": 1, "exp": "The OIC's headquarters is in Jeddah, Saudi Arabia."}, {"section": "International Relations", "q": "The Warsaw Pact, formed as a counterbalance to NATO during the Cold War, was established in:", "opts": ["1949", "1955", "1961", "1970"], "ans": 1, "exp": "The Warsaw Pact was established in 1955 by the Soviet Union and its Eastern European allies in response to NATO."}, {"section": "International Relations", "q": "The World Trade Organization (WTO) is headquartered in:", "opts": ["Geneva", "Brussels", "Vienna", "Paris"], "ans": 0, "exp": "The WTO is headquartered in Geneva, Switzerland."}, {"section": "International Relations", "q": "The G7 group consists of how many major economies?", "opts": ["Five", "Six", "Seven", "Eight"], "ans": 2, "exp": "The G7 (Group of Seven) consists of seven major advanced economies."}, {"section": "International Relations", "q": "The term 'Veto Power' in the UN Security Council belongs to how many permanent members?", "opts": ["Three", "Four", "Five", "Ten"], "ans": 2, "exp": "The UN Security Council has five permanent members (USA, UK, France, Russia, China) each holding veto power."}, {"section": "International Relations", "q": "The Kyoto Protocol is primarily associated with:", "opts": ["Nuclear disarmament", "Climate change and greenhouse gas reduction", "Trade tariffs", "Refugee rights"], "ans": 1, "exp": "The Kyoto Protocol (1997) committed nations to reducing greenhouse gas emissions."}, {"section": "International Relations", "q": "The term 'Bilateral Relations' refers to relations between:", "opts": ["Many countries", "Two countries", "A country and an organisation", "Regional blocs only"], "ans": 1, "exp": "Bilateral relations refer specifically to relations between two countries."}, {"section": "Islamic Studies", "q": "The Quran was revealed over a period of approximately:", "opts": ["10 years", "15 years", "23 years", "30 years"], "ans": 2, "exp": "The Quran was revealed over approximately 23 years, starting in 610 CE."}, {"section": "Islamic Studies", "q": "The first revelation to Prophet Muhammad (PBUH) took place in the cave of:", "opts": ["Thawr", "Hira", "Uhud", "Badr"], "ans": 1, "exp": "The first revelation occurred in the Cave of Hira, near Makkah, in 610 CE."}, {"section": "Islamic Studies", "q": "The migration (Hijrah) of the Prophet (PBUH) from Makkah to Madinah took place in:", "opts": ["610 CE", "620 CE", "622 CE", "632 CE"], "ans": 2, "exp": "The Hijrah took place in 622 CE, marking the start of the Islamic calendar."}, {"section": "Islamic Studies", "q": "The Battle of Badr took place in which year (Hijri)?", "opts": ["1 A.H.", "2 A.H.", "3 A.H.", "5 A.H."], "ans": 1, "exp": "The Battle of Badr took place in 2 A.H. (624 CE)."}, {"section": "Islamic Studies", "q": "The conquest of Makkah (Fath Makkah) took place in which year?", "opts": ["6 A.H.", "8 A.H.", "9 A.H.", "10 A.H."], "ans": 1, "exp": "The Conquest of Makkah took place in 8 A.H. (630 CE)."}, {"section": "Islamic Studies", "q": "The Farewell Pilgrimage (Hajjat-ul-Wida) of the Prophet (PBUH) took place in:", "opts": ["8 A.H.", "9 A.H.", "10 A.H.", "11 A.H."], "ans": 2, "exp": "The Farewell Pilgrimage took place in 10 A.H. (632 CE), shortly before the Prophet's death."}, {"section": "Islamic Studies", "q": "Zakat is obligatory on wealth that has been held for at least:", "opts": ["Six months", "One lunar year", "Two lunar years", "One solar year"], "ans": 1, "exp": "Zakat becomes obligatory on wealth held for one complete lunar year (Hawl), above the Nisab threshold."}, {"section": "Islamic Studies", "q": "The number of verses (Ayat) in the Quran is approximately:", "opts": ["6,236", "5,000", "7,000", "6,000"], "ans": 0, "exp": "The Quran contains approximately 6,236 verses, according to standard counting."}, {"section": "Islamic Studies", "q": "Which Surah is known as the 'Heart of the Quran'?", "opts": ["Surah Al-Fatiha", "Surah Yaseen", "Surah Al-Baqarah", "Surah Ar-Rahman"], "ans": 1, "exp": "Surah Yaseen is traditionally referred to as the 'Heart of the Quran'."}, {"section": "Islamic Studies", "q": "The event of Mubahila (mutual imprecation) involved the Prophet (PBUH) and representatives of:", "opts": ["The Jews of Madinah", "The Christians of Najran", "The Quraysh of Makkah", "The Persians"], "ans": 1, "exp": "The Mubahila event involved the Prophet (PBUH) and a Christian delegation from Najran."}, {"section": "English", "q": "Choose the correct passive voice: 'They are building a new bridge.'", "opts": ["A new bridge is being built by them.", "A new bridge was being built by them.", "A new bridge has being built by them.", "A new bridge being built by them."], "ans": 0, "exp": "Present Continuous passive: 'is/are being + past participle' → 'A new bridge is being built by them.'"}, {"section": "English", "q": "Choose the correct indirect speech: He said, 'I am tired.'", "opts": ["He said that he is tired.", "He said that he was tired.", "He says that he was tired.", "He said that he were tired."], "ans": 1, "exp": "In reported speech, present tense shifts to past: 'am' → 'was'."}, {"section": "English", "q": "Identify the correctly punctuated sentence:", "opts": ["Although it was raining, we went out.", "Although it was raining we went out.", "Although, it was raining, we went out.", "Although it was raining; we went out."], "ans": 0, "exp": "A comma is required after an introductory subordinate clause: 'Although it was raining, we went out.'"}, {"section": "English", "q": "Choose the word opposite in meaning to 'Diligent':", "opts": ["Hardworking", "Lazy", "Careful", "Thorough"], "ans": 1, "exp": "'Diligent' means careful and hardworking; 'Lazy' is its antonym."}, {"section": "English", "q": "Choose the word opposite in meaning to 'Transparent':", "opts": ["Clear", "Obvious", "Opaque", "Visible"], "ans": 2, "exp": "'Opaque' (not able to be seen through) is the antonym of 'Transparent'."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Occassion", "Occasion", "Ocassion", "Occation"], "ans": 1, "exp": "The correct spelling is 'Occasion'."}, {"section": "English", "q": "'To cut corners' means:", "opts": ["To finish a task perfectly", "To do something in the easiest/cheapest way, often sacrificing quality", "To travel a long distance", "To avoid a task entirely"], "ans": 1, "exp": "This idiom means to do something in the easiest, quickest, or cheapest way, often at the cost of quality or thoroughness."}, {"section": "English", "q": "'To be on cloud nine' means:", "opts": ["To be confused", "To be extremely happy", "To be in danger", "To be very tired"], "ans": 1, "exp": "This idiom describes a state of extreme happiness or elation."}, {"section": "English", "q": "Choose the correct sentence:", "opts": ["Neither of the boys were present.", "Neither of the boys was present.", "Neither of the boy was present.", "Neither of boys was present."], "ans": 1, "exp": "'Neither' takes a singular verb: 'Neither of the boys was present.'"}, {"section": "English", "q": "Choose the correct preposition: 'He is good ___ mathematics.'", "opts": ["in", "at", "on", "with"], "ans": 1, "exp": "'Good at' is the correct idiomatic preposition usage for skills/subjects."}, {"section": "Maths / General Science & Ability", "q": "If 3x − 7 = 11, find x:", "opts": ["4", "5", "6", "7"], "ans": 2, "exp": "3x=18 → x=6."}, {"section": "Maths / General Science & Ability", "q": "The average of 10, 20, 30, 40, and 50 is:", "opts": ["25", "30", "35", "40"], "ans": 1, "exp": "Sum=150; Average=150/5=30."}, {"section": "Maths / General Science & Ability", "q": "If a:b = 3:4 and b:c = 4:5, find a:b:c:", "opts": ["3:4:5", "3:4:6", "4:5:6", "3:5:6"], "ans": 0, "exp": "Since b is common (4 in both ratios), a:b:c = 3:4:5 directly."}, {"section": "Maths / General Science & Ability", "q": "The HCF of 36 and 48 is:", "opts": ["6", "8", "12", "16"], "ans": 2, "exp": "36=2²×3²; 48=2⁴×3. HCF=2²×3=12."}, {"section": "Maths / General Science & Ability", "q": "A shopkeeper sells an item for Rs. 440, gaining 10%. Find the cost price.", "opts": ["Rs. 380", "Rs. 400", "Rs. 410", "Rs. 420"], "ans": 1, "exp": "CP = SP/(1+gain%) = 440/1.10 = Rs. 400."}, {"section": "Maths / General Science & Ability", "q": "If the area of a circle is 154 cm² (using π=22/7), find its radius.", "opts": ["5 cm", "6 cm", "7 cm", "8 cm"], "ans": 2, "exp": "Area=πr² → 154=(22/7)r² → r²=49 → r=7 cm."}, {"section": "Maths / General Science & Ability", "q": "Find the value of 15% of 200:", "opts": ["25", "30", "35", "40"], "ans": 1, "exp": "15% of 200 = 0.15×200=30."}, {"section": "Maths / General Science & Ability", "q": "If 5 men can complete a task in 12 days, how many days will 6 men take?", "opts": ["8", "9", "10", "11"], "ans": 2, "exp": "Using inverse proportion: 5×12=6×x → x=60/6=10 days."}, {"section": "Maths / General Science & Ability", "q": "The next number in the series 2, 5, 10, 17, 26, ? is:", "opts": ["35", "36", "37", "38"], "ans": 2, "exp": "Differences are 3,5,7,9,11 (odd numbers): 26+11=37."}, {"section": "Maths / General Science & Ability", "q": "If the perimeter of an equilateral triangle is 36 cm, find the length of each side.", "opts": ["10 cm", "11 cm", "12 cm", "13 cm"], "ans": 2, "exp": "Perimeter/3 = 36/3 = 12 cm."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Delhi Resolution/Muslim League's Allahabad Address by Allama Iqbal, proposing a separate Muslim state, was delivered in:", "opts": ["1928", "1930", "1935", "1940"], "ans": 1, "exp": "Allama Iqbal delivered his famous Allahabad Address in December 1930."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Radcliffe Line, demarcating the border between India and Pakistan, was announced in:", "opts": ["August 1947", "July 1947", "September 1947", "June 1947"], "ans": 0, "exp": "The Radcliffe Line was publicly announced on 17 August 1947, two days after independence."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Pakistan's first Prime Minister, Liaquat Ali Khan, was assassinated in:", "opts": ["1948", "1951", "1953", "1958"], "ans": 1, "exp": "Liaquat Ali Khan was assassinated on 16 October 1951 in Rawalpindi."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The second Indo-Pak war took place in:", "opts": ["1948", "1965", "1971", "1999"], "ans": 1, "exp": "The second Indo-Pak war occurred in September 1965."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The Kargil conflict between Pakistan and India took place in:", "opts": ["1989", "1999", "2001", "2008"], "ans": 1, "exp": "The Kargil conflict took place in 1999, in the Kargil district of Kashmir."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "Benazir Bhutto became the first woman Prime Minister of Pakistan (and the Muslim world) in:", "opts": ["1985", "1988", "1990", "1993"], "ans": 1, "exp": "Benazir Bhutto first became Prime Minister in December 1988."}, {"section": "Pakistan Affairs (Dates & Years)", "q": "The 25th Constitutional Amendment, merging FATA with Khyber Pakhtunkhwa, was passed in:", "opts": ["2016", "2018", "2020", "2021"], "ans": 1, "exp": "The 25th Amendment, merging FATA into KP, was passed in May 2018."}, {"section": "International Relations", "q": "The Treaty of Westphalia (1648), foundational to the modern state system, ended which major European conflict?", "opts": ["The Hundred Years' War", "The Thirty Years' War", "The Napoleonic Wars", "World War I"], "ans": 1, "exp": "The Treaty of Westphalia (1648) ended the Thirty Years' War and established the modern concept of state sovereignty."}, {"section": "International Relations", "q": "ASEAN stands for:", "opts": ["Association of Southeast Asian Nations", "Alliance of South East Asian Nations", "Association of South European and African Nations", "Assembly of Southeast Asian Nations"], "ans": 0, "exp": "ASEAN stands for Association of Southeast Asian Nations, founded in 1967."}, {"section": "International Relations", "q": "The headquarters of the International Monetary Fund (IMF) is located in:", "opts": ["New York", "Washington D.C.", "Geneva", "Paris"], "ans": 1, "exp": "The IMF is headquartered in Washington D.C., USA."}, {"section": "International Relations", "q": "The term 'Détente' refers to:", "opts": ["A declaration of war", "An easing of strained relations between states", "A trade embargo", "A military alliance"], "ans": 1, "exp": "Détente refers to the easing of tension or strained relations, notably used for US-Soviet relations during the Cold War."}, {"section": "International Relations", "q": "The Treaty of Versailles, which ended World War I, was signed in:", "opts": ["1917", "1918", "1919", "1920"], "ans": 2, "exp": "The Treaty of Versailles was signed on 28 June 1919."}, {"section": "International Relations", "q": "The United Nations was formally established in:", "opts": ["1943", "1945", "1947", "1950"], "ans": 1, "exp": "The United Nations was established on 24 October 1945."}, {"section": "International Relations", "q": "The Non-Aligned Movement (NAM) was founded primarily to:", "opts": ["Join either the US or Soviet bloc", "Avoid formal alignment with any major power bloc during the Cold War", "Promote European unity", "Oppose the United Nations"], "ans": 1, "exp": "NAM, founded in 1961, aimed to keep member states independent of the US and Soviet blocs during the Cold War."}, {"section": "International Relations", "q": "The term 'Suzerainty' refers to:", "opts": ["Complete independence", "A relationship where one state controls the foreign affairs of another while it retains internal autonomy", "A military occupation", "A trade partnership"], "ans": 1, "exp": "Suzerainty describes a relationship where a dominant state controls another state's foreign relations while the latter retains internal self-governance."}, {"section": "International Relations", "q": "The Bretton Woods Conference (1944) led to the creation of which two institutions?", "opts": ["UN and WHO", "IMF and World Bank", "NATO and WTO", "ICJ and ICC"], "ans": 1, "exp": "The Bretton Woods Conference led to the creation of the IMF and the World Bank."}, {"section": "International Relations", "q": "The term 'Most Favoured Nation (MFN)' status in trade means:", "opts": ["A nation receives the worst trade terms", "A nation receives trade advantages equal to the best given to any other nation", "Complete trade embargo", "A military alliance status"], "ans": 1, "exp": "MFN status ensures a country receives trade terms at least as favourable as those given to any other trading partner."}, {"section": "Islamic Studies", "q": "The Charter/Constitution of Madinah, drafted by the Prophet (PBUH), established relations between Muslims and:", "opts": ["Only the Ansar", "Muslims, Jews, and other tribes of Madinah", "Only the Quraysh", "Only the Christians of Najran"], "ans": 1, "exp": "The Constitution of Madinah (622 CE) established mutual rights and obligations between Muslims, Jews, and other tribes of Madinah."}, {"section": "Islamic Studies", "q": "The Treaty of Hudaybiyyah was signed in which year (Hijri)?", "opts": ["5 A.H.", "6 A.H.", "7 A.H.", "8 A.H."], "ans": 1, "exp": "The Treaty of Hudaybiyyah was signed in 6 A.H. (628 CE)."}, {"section": "Islamic Studies", "q": "Which Surah does not begin with 'Bismillah'?", "opts": ["Surah Al-Fatiha", "Surah At-Tawbah", "Surah Al-Ikhlas", "Surah An-Nas"], "ans": 1, "exp": "Surah At-Tawbah (Chapter 9) is the only Surah that does not begin with 'Bismillah'."}, {"section": "Islamic Studies", "q": "The compilation of the Quran into a single official text (Mus'haf) was completed during the caliphate of:", "opts": ["Hazrat Abu Bakr (RA)", "Hazrat Umar (RA)", "Hazrat Usman (RA)", "Hazrat Ali (RA)"], "ans": 2, "exp": "The standardised compilation of the Quran into one official text was completed during Hazrat Usman's caliphate."}, {"section": "Islamic Studies", "q": "The initial collection of the Quran into one manuscript (after the Prophet's death) was undertaken during the caliphate of:", "opts": ["Hazrat Abu Bakr (RA)", "Hazrat Umar (RA)", "Hazrat Usman (RA)", "Hazrat Ali (RA)"], "ans": 0, "exp": "Hazrat Abu Bakr (RA) ordered the first compilation of the Quran into a single manuscript after the Battle of Yamama."}, {"section": "Islamic Studies", "q": "The number of Surahs in the Quran is:", "opts": ["100", "104", "114", "120"], "ans": 2, "exp": "The Quran contains 114 Surahs (chapters)."}, {"section": "Islamic Studies", "q": "The longest Surah in the Quran is:", "opts": ["Surah Yaseen", "Surah Al-Baqarah", "Surah Al-Imran", "Surah An-Nisa"], "ans": 1, "exp": "Surah Al-Baqarah is the longest Surah in the Quran."}, {"section": "Islamic Studies", "q": "The shortest Surah in the Quran is:", "opts": ["Surah Al-Kawthar", "Surah Al-Ikhlas", "Surah An-Nas", "Surah Al-Asr"], "ans": 0, "exp": "Surah Al-Kawthar, with only three verses, is the shortest Surah in the Quran."}, {"section": "Islamic Studies", "q": "The Prophet's (PBUH) journey of Isra and Mi'raj is believed to have occurred approximately:", "opts": ["One year before Hijrah", "Five years before Hijrah", "Ten years before Hijrah", "After Hijrah"], "ans": 0, "exp": "The Isra and Mi'raj is commonly dated to around one year before the Hijrah (migration to Madinah)."}, {"section": "Islamic Studies", "q": "The term 'Sunnah' refers to:", "opts": ["Only the sayings of the Prophet (PBUH)", "The practices, sayings, and approvals of the Prophet (PBUH)", "Only the Quranic verses", "Islamic jurisprudence rulings only"], "ans": 1, "exp": "'Sunnah' encompasses the sayings, actions, and tacit approvals of the Prophet Muhammad (PBUH)."}, {"section": "English", "q": "Choose the correctly used conditional: 'If I ___ rich, I would travel the world.'", "opts": ["am", "was", "were", "will be"], "ans": 2, "exp": "In the Second Conditional (hypothetical present), 'were' is used for all subjects: 'If I were rich...'"}, {"section": "English", "q": "Choose the correct sentence using 'who' or 'whom':", "opts": ["Who did you give the book to?", "Whom did you give the book to?", "Who you gave the book to?", "Whom you gave the book to?"], "ans": 1, "exp": "'Whom' is correct as the object of the preposition 'to': 'Whom did you give the book to?'"}, {"section": "English", "q": "'To hit the nail on the head' means:", "opts": ["To cause damage", "To say or do something exactly right", "To waste time", "To make a mistake"], "ans": 1, "exp": "This idiom means to describe or identify something precisely and accurately."}, {"section": "English", "q": "Choose the word closest in meaning to 'Ubiquitous':", "opts": ["Rare", "Omnipresent", "Hidden", "Temporary"], "ans": 1, "exp": "'Ubiquitous' means present everywhere, synonymous with 'omnipresent'."}, {"section": "English", "q": "Choose the word closest in meaning to 'Candid':", "opts": ["Deceptive", "Frank and honest", "Shy", "Formal"], "ans": 1, "exp": "'Candid' means being open, frank, and honest."}, {"section": "English", "q": "Identify the correct sentence:", "opts": ["Each of the students have submitted their assignment.", "Each of the students has submitted their assignment.", "Each of the student has submitted his assignment.", "Each of students has submitted assignment."], "ans": 1, "exp": "'Each' takes a singular verb: 'Each of the students has submitted...'"}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Accomodate", "Accommodate", "Acommodate", "Accommadate"], "ans": 1, "exp": "The correct spelling is 'Accommodate' (double 'c', double 'm')."}, {"section": "English", "q": "'A storm in a teacup' means:", "opts": ["A severe natural disaster", "A small event blown out of proportion", "A pleasant surprise", "A long-lasting argument"], "ans": 1, "exp": "This idiom refers to a small, unimportant matter being treated as a major crisis."}, {"section": "English", "q": "Choose the correct form: 'By next year, she ___ her degree.'", "opts": ["will complete", "will have completed", "completes", "is completing"], "ans": 1, "exp": "Future Perfect Tense is used for an action that will be completed before a specific future time: 'will have completed'."}, {"section": "Maths / General Science & Ability", "q": "If a wheel of radius 14 cm makes 100 revolutions, find the distance covered (use π=22/7).", "opts": ["66 m", "77 m", "88 m", "99 m"], "ans": 2, "exp": "Circumference = 2πr = 2×(22/7)×14 = 88 cm; distance = 88×100 = 8800 cm = 88 m."}, {"section": "Maths / General Science & Ability", "q": "If the simple interest on Rs. 8,000 for 3 years is Rs. 1,440, find the rate of interest.", "opts": ["5%", "6%", "7%", "8%"], "ans": 1, "exp": "Rate = (SI×100)/(P×T) = (1440×100)/(8000×3) = 144000/24000 = 6%."}, {"section": "Maths / General Science & Ability", "q": "Find the value of (2³ × 3²):", "opts": ["48", "56", "62", "72"], "ans": 3, "exp": "2³=8, 3²=9; 8×9=72."}, {"section": "Maths / General Science & Ability", "q": "A train 150 m long passes a pole in 10 seconds. Find its speed in km/h.", "opts": ["45 km/h", "54 km/h", "60 km/h", "72 km/h"], "ans": 1, "exp": "Speed = 150m/10s = 15 m/s = 15×18/5 = 54 km/h."}, {"section": "Maths / General Science & Ability", "q": "If 40% of a number is 80, find the number.", "opts": ["160", "180", "200", "220"], "ans": 2, "exp": "40%×x=80 → x=80/0.4=200."}, {"section": "Maths / General Science & Ability", "q": "The next term in the series 3, 6, 11, 18, 27, ? is:", "opts": ["36", "37", "38", "40"], "ans": 2, "exp": "Differences are 3,5,7,9,11 (odd numbers): 27+11=38."}, {"section": "Maths / General Science & Ability", "q": "Two numbers are in the ratio 5:7. If their sum is 144, find the larger number.", "opts": ["60", "70", "80", "84"], "ans": 3, "exp": "Total parts=12; 1 part=144/12=12; larger=7×12=84."}, {"section": "Maths / General Science & Ability", "q": "Find the compound interest on Rs. 10,000 for 2 years at 10% per annum.", "opts": ["Rs. 2,000", "Rs. 2,100", "Rs. 2,200", "Rs. 2,500"], "ans": 1, "exp": "CI = P[(1+R/100)^T − 1] = 10000[(1.1)²−1] = 10000×0.21 = Rs. 2,100."}, {"section": "Maths / General Science & Ability", "q": "If the length of a rectangle is increased by 20% and width decreased by 20%, the area:", "opts": ["Increases by 4%", "Decreases by 4%", "Remains unchanged", "Increases by 20%"], "ans": 1, "exp": "New area = 1.2×0.8 = 0.96 of original, i.e., a 4% decrease."}, {"section": "Maths / General Science & Ability", "q": "A man covers a distance of 300 km in 5 hours partly by car at 60 km/h and partly by bus at 50 km/h. If he covered 180 km by car, how long did the journey by bus take?", "opts": ["2 hours", "2.4 hours", "3 hours", "3.5 hours"], "ans": 1, "exp": "Distance by bus = 300−180=120 km; time=120/50=2.4 hours."}, {"section": "Maths / General Science & Ability", "q": "Find the missing number: 4, 9, 16, 25, 36, ?", "opts": ["42", "45", "49", "54"], "ans": 2, "exp": "This is the sequence of perfect squares (2²,3²,4²,5²,6²); next is 7²=49."}];

const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
