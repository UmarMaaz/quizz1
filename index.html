<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS/FPSC MPT Quiz</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>
<body>

const QUESTIONS = [{"section": "English", "q": "Which sentence uses correct subject-verb agreement?", "opts": ["The list of items are on the desk.", "The list of items is on the desk.", "The list of items were on the desk.", "The list of item is on the desk."], "ans": 1, "exp": "'List' (singular) is the true subject, not 'items'; singular subjects take singular verbs — 'is'."}, {"section": "English", "q": "'Neither the teacher nor the students ___ late.'", "opts": ["was", "is", "were", "be"], "ans": 2, "exp": "With 'neither...nor', the verb agrees with the NEARER subject — 'students' (plural) → 'were'."}, {"section": "English", "q": "Choose the correctly punctuated sentence about time frames: 'She has lived here ___ 2015.'", "opts": ["for", "since", "during", "from"], "ans": 1, "exp": "'Since' pairs with a point in time (2015) and Present Perfect; 'for' pairs with a duration."}, {"section": "English", "q": "Pick the correct article: '___ university offers ___ one-year diploma.'", "opts": ["An, a", "A, an", "A, a", "An, an"], "ans": 2, "exp": "'University' starts with a consonant SOUND (yoo-) → 'a'; 'one-year' starts with a 'w' sound → 'a'."}, {"section": "English", "q": "'Success depends ___ hard work.'", "opts": ["of", "on", "in", "with"], "ans": 1, "exp": "The fixed preposition pattern is 'depend ON'."}, {"section": "English", "q": "Convert to passive: 'He wrote a letter.'", "opts": ["A letter is written by him.", "A letter was written by him.", "A letter has written by him.", "A letter was writing by him."], "ans": 1, "exp": "Past Simple active → 'was/were + V3' in passive: 'was written'."}, {"section": "English", "q": "Indirect speech: He said, 'I am tired.' → He said that ___.", "opts": ["he is tired", "he was tired", "he has been tired", "he will be tired"], "ans": 1, "exp": "In reported speech, tense shifts one step back: Present Simple → Past Simple."}, {"section": "English", "q": "Superlative form of 'good' is:", "opts": ["goodest", "best", "better", "most good"], "ans": 1, "exp": "'Good' is an irregular adjective: good → better → best."}, {"section": "English", "q": "Which is correct? 'There is ___ water left in the bottle.'", "opts": ["few", "a few", "little", "a little"], "ans": 3, "exp": "'Water' is uncountable, and 'a little' means 'some' (positive); 'little' alone would mean 'hardly any'."}, {"section": "English", "q": "A word meaning 'short-lived, transient' is:", "opts": ["Ephemeral", "Perennial", "Permanent", "Static"], "ans": 0, "exp": "'Ephemeral' means lasting for a very short time; its antonym is 'permanent'."}, {"section": "English", "q": "'To let the cat out of the bag' means:", "opts": ["To adopt a pet", "To reveal a secret unintentionally", "To cause chaos", "To escape danger"], "ans": 1, "exp": "This idiom means to accidentally reveal a secret."}, {"section": "English", "q": "One word for 'a person who loves and collects books' is:", "opts": ["Bibliophile", "Bibliophobe", "Philanthropist", "Bibliographer"], "ans": 0, "exp": "A 'bibliophile' is a lover/collector of books."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Accomodate", "Acommodate", "Accommodate", "Acomodate"], "ans": 2, "exp": "The correct spelling is 'Accommodate' — with double 'c' and double 'm'."}, {"section": "English", "q": "Identify the correct sentence (parallel structure):", "opts": ["She likes reading, writing, and to paint.", "She likes reading, writing, and painting.", "She likes to read, writing, and paint.", "She likes read, write, and paint."], "ans": 1, "exp": "Parallel structure requires the same grammatical form throughout a list — all gerunds: reading, writing, painting."}, {"section": "English", "q": "'Fewer' is used with:", "opts": ["Uncountable nouns", "Countable nouns", "Both equally", "Neither"], "ans": 1, "exp": "'Fewer' modifies countable nouns (fewer books); 'less' modifies uncountable nouns (less water)."}, {"section": "English", "q": "First Conditional structure is:", "opts": ["If + past, would + V1", "If + present, will + V1", "If + past perfect, would have + V3", "If + present, present"], "ans": 1, "exp": "First Conditional expresses real/likely future situations: If + present simple, ... will + base verb."}, {"section": "English", "q": "'If I ___ you, I would apologise.'", "opts": ["was", "am", "were", "be"], "ans": 2, "exp": "The subjunctive mood requires 'were' for all persons in unreal/hypothetical present conditionals: 'If I were you'."}, {"section": "English", "q": "Tag question: 'They play cricket, ___?'", "opts": ["do they", "don't they", "isn't it", "aren't they"], "ans": 1, "exp": "A positive statement takes a negative tag using the auxiliary 'do': 'don't they?'"}, {"section": "English", "q": "Which sentence shows correct inversion after a negative opener?", "opts": ["Never I have seen such a sunset.", "Never have I seen such a sunset.", "I never have seen such a sunset.", "Never did I have seen such a sunset."], "ans": 1, "exp": "Sentence-initial negative adverbials like 'Never' require the auxiliary before the subject: 'Never have I seen...'"}, {"section": "General Science & Ability", "q": "If A can complete a job in 12 days and B in 18 days, working together they will finish in:", "opts": ["6 days", "7.2 days", "8 days", "9 days"], "ans": 1, "exp": "Combined rate = 1/12 + 1/18 = 5/36 per day → time = 36/5 = 7.2 days."}, {"section": "General Science & Ability", "q": "Simple Interest on Rs. 1000 at 10% per annum for 2 years is:", "opts": ["Rs. 100", "Rs. 200", "Rs. 1100", "Rs. 210"], "ans": 1, "exp": "SI = (P×R×T)/100 = (1000×10×2)/100 = Rs. 200."}, {"section": "General Science & Ability", "q": "The value of sin(30°) is:", "opts": ["1/2", "√3/2", "1", "1/√2"], "ans": 0, "exp": "sin(30°) = 1/2, a standard trigonometric value."}, {"section": "General Science & Ability", "q": "In an Arithmetic Progression 3, 7, 11, 15..., the 10th term is:", "opts": ["35", "39", "43", "41"], "ans": 1, "exp": "nth term = a + (n-1)d = 3 + 9×4 = 39."}, {"section": "General Science & Ability", "q": "A number of students ___ absent today.", "opts": ["is", "are", "was", "has"], "ans": 1, "exp": "'A number of' (meaning several) takes a plural verb — this is also a grammar-adjacent reasoning/agreement point tested with quantities."}, {"section": "General Science & Ability", "q": "Which identity is always true for any angle θ?", "opts": ["sinθ + cosθ = 1", "sin²θ + cos²θ = 1", "sinθ × cosθ = 1", "sin²θ - cos²θ = 1"], "ans": 1, "exp": "The Pythagorean trigonometric identity sin²θ + cos²θ = 1 holds for all angles."}, {"section": "General Science & Ability", "q": "If the cost price is Rs. 500 and selling price is Rs. 600, the profit percentage is:", "opts": ["15%", "20%", "25%", "10%"], "ans": 1, "exp": "Profit% = (Profit/CP)×100 = (100/500)×100 = 20%."}, {"section": "General Science & Ability", "q": "A geometric progression 2, 6, 18, 54... has a common ratio of:", "opts": ["2", "3", "4", "6"], "ans": 1, "exp": "Each term is obtained by multiplying the previous term by 3 (the common ratio r)."}, {"section": "General Science & Ability", "q": "The unit of electrical resistance is:", "opts": ["Volt", "Ampere", "Ohm", "Watt"], "ans": 2, "exp": "Resistance is measured in Ohms, named after Georg Ohm."}, {"section": "General Science & Ability", "q": "The process by which plants make their food using sunlight is called:", "opts": ["Respiration", "Transpiration", "Photosynthesis", "Osmosis"], "ans": 2, "exp": "Photosynthesis converts light energy into chemical energy (glucose) in green plants."}, {"section": "General Science & Ability", "q": "Water boils at what temperature at sea level (in Celsius)?", "opts": ["90°C", "100°C", "110°C", "80°C"], "ans": 1, "exp": "At standard atmospheric pressure (sea level), water boils at 100°C."}, {"section": "General Science & Ability", "q": "The powerhouse of the cell is the:", "opts": ["Nucleus", "Ribosome", "Mitochondria", "Golgi body"], "ans": 2, "exp": "Mitochondria generate ATP (energy) for the cell, earning the nickname 'powerhouse of the cell'."}, {"section": "General Science & Ability", "q": "Which gas is most abundant in Earth's atmosphere?", "opts": ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], "ans": 1, "exp": "Nitrogen makes up about 78% of Earth's atmosphere, more than oxygen's ~21%."}, {"section": "General Science & Ability", "q": "If 60% of a number is 90, the number is:", "opts": ["120", "150", "135", "180"], "ans": 1, "exp": "60% × x = 90 → x = 90/0.6 = 150."}, {"section": "General Science & Ability", "q": "pH value of a neutral solution (like pure water) is:", "opts": ["0", "7", "14", "1"], "ans": 1, "exp": "A pH of 7 is neutral; below 7 is acidic, above 7 is basic (alkaline)."}, {"section": "General Science & Ability", "q": "Average of 10, 20, 30, and 40 is:", "opts": ["20", "25", "30", "35"], "ans": 1, "exp": "Average = Sum/Count = 100/4 = 25."}, {"section": "General Science & Ability", "q": "The speed of light in a vacuum is approximately:", "opts": ["3×10^5 km/s", "3×10^8 m/s", "3×10^6 m/s", "3×10^3 m/s"], "ans": 1, "exp": "Light travels at approximately 3×10^8 metres per second in a vacuum."}, {"section": "General Science & Ability", "q": "If a train travels 60 km in 1.5 hours, its speed is:", "opts": ["30 km/h", "40 km/h", "45 km/h", "50 km/h"], "ans": 1, "exp": "Speed = Distance/Time = 60/1.5 = 40 km/h."}, {"section": "General Science & Ability", "q": "The chemical formula for common table salt is:", "opts": ["NaCl", "KCl", "CaCO3", "NaHCO3"], "ans": 0, "exp": "Table salt is Sodium Chloride, chemical formula NaCl."}, {"section": "Pakistan Affairs", "q": "The All-India Muslim League was founded in which year and city?", "opts": ["1906, Dhaka", "1906, Lahore", "1913, Aligarh", "1916, Lucknow"], "ans": 0, "exp": "The Muslim League was founded in 1906 in Dhaka (then Dacca)."}, {"section": "Pakistan Affairs", "q": "The Lahore Resolution, demanding independent Muslim states, was passed on:", "opts": ["14 August 1947", "23 March 1940", "16 August 1946", "3 June 1947"], "ans": 1, "exp": "The Lahore Resolution (later called the Pakistan Resolution) was passed on 23 March 1940."}, {"section": "Pakistan Affairs", "q": "Allama Iqbal's famous address proposing a separate Muslim state was delivered at:", "opts": ["Lucknow, 1916", "Allahabad, 1930", "Lahore, 1940", "Aligarh, 1875"], "ans": 1, "exp": "Iqbal's Allahabad Address in 1930 first articulated the idea of a separate Muslim state in the subcontinent."}, {"section": "Pakistan Affairs", "q": "Who founded the Muhammadan Anglo-Oriental College at Aligarh?", "opts": ["Quaid-e-Azam", "Allama Iqbal", "Sir Syed Ahmad Khan", "Liaquat Ali Khan"], "ans": 2, "exp": "Sir Syed Ahmad Khan founded the college in 1875, which later became Aligarh Muslim University."}, {"section": "Pakistan Affairs", "q": "The Lucknow Pact (1916) was an agreement between:", "opts": ["Muslim League and the British", "Congress and the Muslim League", "Congress and the British", "Muslim League and the Sikhs"], "ans": 1, "exp": "The Lucknow Pact was a joint agreement between the Indian National Congress and the All-India Muslim League."}, {"section": "Pakistan Affairs", "q": "'Direct Action Day' called by the Muslim League occurred on:", "opts": ["16 August 1946", "23 March 1940", "14 August 1947", "3 June 1947"], "ans": 0, "exp": "Direct Action Day was observed on 16 August 1946, following the Cabinet Mission Plan negotiations."}, {"section": "Pakistan Affairs", "q": "Pakistan's first Prime Minister was:", "opts": ["Muhammad Ali Jinnah", "Liaquat Ali Khan", "Chaudhry Muhammad Ali", "Khawaja Nazimuddin"], "ans": 1, "exp": "Liaquat Ali Khan served as Pakistan's first Prime Minister from 1947 until his assassination in 1951."}, {"section": "Pakistan Affairs", "q": "Which river flows through the Punjab province and gives Pakistan its name element 'P'?", "opts": ["Indus", "Punjab (Five Rivers)", "Chenab", "Jhelum"], "ans": 1, "exp": "'Punjab' means 'land of five rivers' and lends the 'P' to the acronym often cited for 'Pakistan'."}, {"section": "Pakistan Affairs", "q": "The capital of Pakistan is:", "opts": ["Karachi", "Lahore", "Islamabad", "Rawalpindi"], "ans": 2, "exp": "Islamabad has been Pakistan's capital since the 1960s, replacing Karachi."}, {"section": "Pakistan Affairs", "q": "Pakistan's national language is:", "opts": ["English", "Punjabi", "Urdu", "Sindhi"], "ans": 2, "exp": "Urdu is designated as Pakistan's national language, per the Constitution."}, {"section": "Pakistan Affairs", "q": "The highest mountain peak in Pakistan is:", "opts": ["Nanga Parbat", "K2", "Tirich Mir", "Rakaposhi"], "ans": 1, "exp": "K2, located in the Karakoram Range, is the world's second-highest peak and Pakistan's highest."}, {"section": "Pakistan Affairs", "q": "Which province of Pakistan is the largest by area?", "opts": ["Punjab", "Sindh", "Balochistan", "Khyber Pakhtunkhwa"], "ans": 2, "exp": "Balochistan is Pakistan's largest province by land area, though sparsely populated."}, {"section": "Pakistan Affairs", "q": "Pakistan gained independence on:", "opts": ["14 August 1947", "15 August 1947", "23 March 1940", "27 October 1947"], "ans": 0, "exp": "Pakistan became independent on 14 August 1947."}, {"section": "Pakistan Affairs", "q": "The 1973 Constitution of Pakistan established which form of government?", "opts": ["Presidential", "Parliamentary federal", "Monarchy", "Unitary"], "ans": 1, "exp": "The 1973 Constitution established a parliamentary federal system with a bicameral legislature."}, {"section": "Islamic Studies / Civics & Ethics", "q": "How many Articles of Faith (Iman-e-Mufassal) are there in Islam?", "opts": ["Five", "Six", "Seven", "Four"], "ans": 1, "exp": "The six articles include belief in Allah, Angels, Books, Prophets, the Day of Judgment, and Divine Destiny (Taqdeer)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which of the following is NOT one of the Five Pillars of Islam?", "opts": ["Shahadah", "Zakat", "Jihad", "Hajj"], "ans": 2, "exp": "The Five Pillars are Shahadah, Salah, Zakat, Sawm, and Hajj — Jihad is not one of the five formal pillars."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Zakat is obligatory at what rate on qualifying wealth held for a lunar year?", "opts": ["1%", "2.5%", "5%", "10%"], "ans": 1, "exp": "Zakat is calculated at 2.5% of qualifying wealth (nisab) held for one lunar year."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Holy Quran was revealed over a period of approximately:", "opts": ["10 years", "13 years", "23 years", "33 years"], "ans": 2, "exp": "Revelation of the Quran to Prophet Muhammad (PBUH) took place over approximately 23 years."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Quran was revealed to Prophet Muhammad (PBUH) through which angel?", "opts": ["Mikail", "Israfil", "Jibreel", "Azrael"], "ans": 2, "exp": "The Angel Jibreel (Gabriel) conveyed the revelations of the Quran."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which of these is one of the revealed books mentioned in Islamic belief?", "opts": ["Vedas", "Torah", "Bhagavad Gita", "Talmud"], "ans": 1, "exp": "The revealed books recognised in Islam are the Torah, Zaboor (Psalms), Injeel (Gospel), and the Quran."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Fasting (Sawm) is observed during the Islamic month of:", "opts": ["Shawwal", "Ramadan", "Muharram", "Rajab"], "ans": 1, "exp": "Sawm is the obligatory fasting observed throughout the month of Ramadan, from dawn to sunset."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Hajj is obligatory upon a Muslim:", "opts": ["Every year", "Once in a lifetime, if able", "Twice in a lifetime", "Only for scholars"], "ans": 1, "exp": "Hajj is obligatory once in a lifetime for Muslims who are physically and financially able."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Khatam-un-Nabiyyeen' refers to the belief that Prophet Muhammad (PBUH) is:", "opts": ["The first Prophet", "The last Prophet", "A minor Prophet", "An angel"], "ans": 1, "exp": "'Khatam-un-Nabiyyeen' means the 'Seal of the Prophets', affirming Muhammad (PBUH) as the final prophet."}, {"section": "Islamic Studies / Civics & Ethics", "q": "How many daily obligatory prayers (Salah) does a Muslim perform?", "opts": ["Three", "Four", "Five", "Six"], "ans": 2, "exp": "The five daily prayers are Fajr, Zuhr, Asr, Maghrib, and Isha."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Shahadah is the declaration of:", "opts": ["Fasting intention", "Faith in the Oneness of Allah and Prophethood of Muhammad (PBUH)", "Charity", "Pilgrimage intent"], "ans": 1, "exp": "Shahadah is the testimony that there is no god but Allah and Muhammad (PBUH) is His Messenger."}, {"section": "Islamic Studies / Civics & Ethics", "q": "In Islamic belief, 'Taqdeer' refers to:", "opts": ["Angels", "Divine Destiny/predestination", "Revealed Books", "The Day of Judgment"], "ans": 1, "exp": "Taqdeer is the belief that both good and bad occur by the will and decree of Allah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Civics, as a subject for non-Muslim CSS candidates, primarily studies:", "opts": ["Religious rituals", "Rights, duties, and functioning of the state/citizens", "Foreign languages", "Military strategy"], "ans": 1, "exp": "Civics covers citizenship, rights and duties, and the structure/functioning of government."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which pillar of Islam involves obligatory almsgiving to the eligible poor?", "opts": ["Salah", "Sawm", "Zakat", "Hajj"], "ans": 2, "exp": "Zakat is the pillar concerned with obligatory almsgiving."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The final and unaltered revealed book, according to Islamic belief, is the:", "opts": ["Torah", "Zaboor", "Injeel", "Quran"], "ans": 3, "exp": "Muslims believe the Quran is the final revelation and, unlike earlier scriptures, remains unaltered."}, {"section": "Current Affairs", "q": "FPSC current affairs questions typically draw on events from roughly the preceding:", "opts": ["1-2 months", "12-18 months", "5 years", "10 years"], "ans": 1, "exp": "FPSC generally sources Current Affairs MCQs from developments in the past 12-18 months before the exam."}, {"section": "Current Affairs", "q": "'Static facts' in current affairs preparation refer to information that:", "opts": ["Changes frequently", "Rarely changes (e.g., HQ locations, founding years)", "Is always current affairs only", "Cannot be memorised"], "ans": 1, "exp": "Static facts (organisation headquarters, founding years, treaties) are stable and can be memorised well in advance."}, {"section": "Current Affairs", "q": "'Dynamic facts' such as heads of state/government should be verified:", "opts": ["A year in advance", "In the final days before the exam", "Never — they don't matter", "Only after the exam"], "ans": 1, "exp": "Dynamic facts change often, so they should be re-verified close to the exam date rather than memorised early."}, {"section": "Current Affairs", "q": "The United Nations' primary organ responsible for international peace and security is the:", "opts": ["General Assembly", "Security Council", "Secretariat", "ECOSOC"], "ans": 1, "exp": "The UN Security Council holds primary responsibility for maintaining international peace and security."}, {"section": "Current Affairs", "q": "SAARC stands for:", "opts": ["South Asian Association for Regional Cooperation", "South Asian Alliance for Regional Cooperation", "South Asian Assembly for Regional Coordination", "South Asian Agreement for Regional Commerce"], "ans": 0, "exp": "SAARC is the South Asian Association for Regional Cooperation."}, {"section": "Current Affairs", "q": "The headquarters of the United Nations is located in:", "opts": ["Geneva", "New York", "Vienna", "The Hague"], "ans": 1, "exp": "The UN's main headquarters is in New York City, USA."}, {"section": "Current Affairs", "q": "CPEC is a flagship project connecting Pakistan with:", "opts": ["India", "China", "Afghanistan", "Iran"], "ans": 1, "exp": "The China-Pakistan Economic Corridor (CPEC) links Gwadar Port in Pakistan to China's Xinjiang region."}, {"section": "Current Affairs", "q": "The IMF (International Monetary Fund) is primarily concerned with:", "opts": ["Global health", "International monetary cooperation and financial stability", "Trade tariffs only", "Environmental policy"], "ans": 1, "exp": "The IMF works to foster global monetary cooperation, financial stability, and facilitate international trade."}, {"section": "Current Affairs", "q": "World Environment Day is observed annually on:", "opts": ["5 June", "22 April", "1 March", "10 December"], "ans": 0, "exp": "World Environment Day is observed on 5 June each year."}, {"section": "Current Affairs", "q": "The headquarters of SAARC is located in:", "opts": ["Islamabad", "Kathmandu", "New Delhi", "Dhaka"], "ans": 1, "exp": "The SAARC Secretariat is headquartered in Kathmandu, Nepal."}, {"section": "Urdu Grammar", "q": "اردو میں 'اسم' کسے کہتے ہیں؟", "opts": ["فعل کو", "کسی شخص، جگہ یا چیز کے نام کو", "صفت کو", "حرفِ ربط کو"], "ans": 1, "exp": "اسم وہ لفظ ہے جو کسی شخص، جگہ، یا چیز کا نام ظاہر کرے، جیسے کتاب، الہور۔"}, {"section": "Urdu Grammar", "q": "'محبت' کس قسم کا اسم ہے؟", "opts": ["اسمِ ذات", "اسمِ معنی (کیفیت)", "اسمِ صفت", "اسمِ ضمیر"], "ans": 1, "exp": "'محبت' ایک کیفیت یا جذبے کا نام ہے، اس لیے یہ اسمِ معنی (اسمِ کیفیت) کہلاتا ہے۔"}, {"section": "Urdu Grammar", "q": "فعل کسے کہتے ہیں؟", "opts": ["کسی کام کے کرنے یا ہونے کو ظاہر کرنے والا لفظ", "کسی چیز کا نام", "جوڑنے والا حرف", "تعجب ظاہر کرنے والا لفظ"], "ans": 0, "exp": "فعل وہ لفظ ہے جو کسی کام کے کرنے یا ہونے کی خبر دے۔"}, {"section": "Urdu Grammar", "q": "'محاورہ' کی تعریف ہے:", "opts": ["ایک مروجہ فقرہ جس کا مطلب لفظی معنی سے مختلف ہو", "صرف ایک لفظ", "شعر کی ایک قسم", "گرامر کا اصول"], "ans": 0, "exp": "محاورہ ایسا فقرہ ہے جس کا حقیقی مفہوم اس کے الفاظ کے لغوی معنی سے مختلف ہوتا ہے۔"}, {"section": "Urdu Grammar", "q": "مترادف الفاظ سے کیا مراد ہے؟", "opts": ["ایک جیسے معنی رکھنے والے الفاظ", "مخالف معنی رکھنے والے الفاظ", "نئے الفاظ", "غیر ملکی الفاظ"], "ans": 0, "exp": "مترادف الفاظ وہ ہوتے ہیں جن کے معنی ایک جیسے یا ملتے جلتے ہوں۔"}, {"section": "Urdu Grammar", "q": "متضاد الفاظ سے کیا مراد ہے؟", "opts": ["ایک جیسے معنی رکھنے والے الفاظ", "ایک دوسرے کے مخالف معنی رکھنے والے الفاظ", "صرف اسماء", "محاورات"], "ans": 1, "exp": "متضاد الفاظ وہ ہیں جن کے معنی ایک دوسرے کے برعکس ہوں، جیسے دن اور رات۔"}, {"section": "Urdu Grammar", "q": "ترجمہ (انگریزی سے اردو) کرتے وقت سب سے اہم بات کیا ہے؟", "opts": ["لفظ بہ لفظ ترجمہ کرنا", "معنی اور روانی کو برقرار رکھنا", "صرف مشکل الفاظ استعمال کرنا", "جملے کو مختصر کرنا"], "ans": 1, "exp": "اچھے ترجمے میں اصل معنی اور فطری روانی دونوں کا خیال رکھا جاتا ہے، لفظی ترجمہ اکثر مفہوم بگاڑ دیتا ہے۔"}, {"section": "Urdu Grammar", "q": "'حرفِ ربط' کس کے لیے استعمال ہوتا ہے؟", "opts": ["الفاظ یا جملوں کو جوڑنے کے لیے", "نام ظاہر کرنے کے لیے", "کام ظاہر کرنے کے لیے", "تعجب ظاہر کرنے کے لیے"], "ans": 0, "exp": "حرفِ ربط جیسے 'اور'، 'لیکن' الفاظ یا جملوں کو آپس میں جوڑنے کا کام کرتا ہے۔"}, {"section": "General Knowledge", "q": "The largest country in the world by area is:", "opts": ["China", "Canada", "Russia", "USA"], "ans": 2, "exp": "Russia is the largest country in the world by total land area."}, {"section": "General Knowledge", "q": "The smallest country in the world by area is:", "opts": ["Monaco", "Vatican City", "San Marino", "Liechtenstein"], "ans": 1, "exp": "Vatican City is the world's smallest sovereign state by both area and population."}, {"section": "General Knowledge", "q": "The longest river in the world is generally considered to be:", "opts": ["Amazon", "Nile", "Yangtze", "Mississippi"], "ans": 1, "exp": "The Nile in Africa is traditionally regarded as the world's longest river."}, {"section": "General Knowledge", "q": "The highest mountain in the world is:", "opts": ["K2", "Mount Everest", "Kangchenjunga", "Nanga Parbat"], "ans": 1, "exp": "Mount Everest, on the Nepal-China border, stands at 8,849 metres, the world's highest peak."}, {"section": "General Knowledge", "q": "The largest ocean on Earth is the:", "opts": ["Atlantic Ocean", "Indian Ocean", "Pacific Ocean", "Arctic Ocean"], "ans": 2, "exp": "The Pacific Ocean is the largest and deepest of the world's oceans."}, {"section": "General Knowledge", "q": "The largest continent by area is:", "opts": ["Africa", "Asia", "North America", "Europe"], "ans": 1, "exp": "Asia is the largest continent both by area and population."}, {"section": "General Knowledge", "q": "The Sahara Desert, the world's largest hot desert, is located in:", "opts": ["Asia", "Africa", "Australia", "South America"], "ans": 1, "exp": "The Sahara Desert spans much of North Africa."}, {"section": "General Knowledge", "q": "The deepest oceanic trench in the world is the:", "opts": ["Puerto Rico Trench", "Mariana Trench", "Java Trench", "Tonga Trench"], "ans": 1, "exp": "The Mariana Trench, in the western Pacific Ocean, is the deepest known point in Earth's oceans."}, {"section": "General Knowledge", "q": "The world's most populous country (as of recent years) is:", "opts": ["China", "India", "USA", "Indonesia"], "ans": 1, "exp": "India overtook China to become the world's most populous country in 2023."}, {"section": "General Knowledge", "q": "The largest island in the world is:", "opts": ["Madagascar", "Borneo", "Greenland", "New Guinea"], "ans": 2, "exp": "Greenland is the world's largest island by area."}, {"section": "General Knowledge", "q": "World War II ended in the year:", "opts": ["1943", "1944", "1945", "1946"], "ans": 2, "exp": "World War II ended in 1945, with Japan's surrender in September of that year."}, {"section": "General Knowledge", "q": "The United Nations was established in the year:", "opts": ["1919", "1945", "1950", "1939"], "ans": 1, "exp": "The UN was founded in 1945, following the end of World War II, replacing the League of Nations."}, {"section": "General Knowledge", "q": "The currency of Japan is the:", "opts": ["Yuan", "Won", "Yen", "Ringgit"], "ans": 2, "exp": "Japan's official currency is the Yen."}, {"section": "General Knowledge", "q": "The Great Wall is located in which country?", "opts": ["India", "China", "Mongolia", "Japan"], "ans": 1, "exp": "The Great Wall of China was built across historic northern Chinese borders."}, {"section": "General Knowledge", "q": "The smallest continent by area is:", "opts": ["Europe", "Australia", "Antarctica", "South America"], "ans": 1, "exp": "Australia is the smallest of the seven continents by land area."}, {"section": "English", "q": "Correct the error: 'Each of the students have submitted their assignment.'", "opts": ["Each of the students has submitted his/her assignment.", "Each of the student have submitted their assignment.", "Each of the students had submit their assignment.", "No error"], "ans": 0, "exp": "'Each' is singular, so it takes a singular verb ('has') and singular possessive ('his/her')."}, {"section": "English", "q": "'He is senior ___ me.'", "opts": ["than", "to", "from", "of"], "ans": 1, "exp": "'Senior' and 'junior' are followed by 'to', not 'than' — a classic exception to comparative structure."}, {"section": "English", "q": "'Despite ___ the rain, they went out.'", "opts": ["of the", "off the", "the", "for the"], "ans": 2, "exp": "'Despite' is never followed by 'of'; it directly precedes the noun: 'Despite the rain'."}, {"section": "English", "q": "A word for 'a place where birds are kept' is:", "opts": ["Apiary", "Aviary", "Aquarium", "Vivarium"], "ans": 1, "exp": "An 'aviary' is a large enclosure for keeping birds; an 'apiary' is for bees."}, {"section": "English", "q": "'One who studies elections' is called a:", "opts": ["Psephologist", "Etymologist", "Numismatist", "Ornithologist"], "ans": 0, "exp": "A psephologist studies elections and voting trends."}, {"section": "English", "q": "Government by one ruler with absolute power is called:", "opts": ["Democracy", "Autocracy", "Aristocracy", "Theocracy"], "ans": 1, "exp": "'Autocracy' is government by a single ruler holding absolute power."}, {"section": "English", "q": "Words written on a tomb are called an:", "opts": ["Epigraph", "Epitaph", "Epilogue", "Elegy"], "ans": 1, "exp": "An 'epitaph' is an inscription on a tombstone; an 'epilogue' is the closing section of a book."}, {"section": "English", "q": "'Regicide' means:", "opts": ["Killing of a king", "Killing of oneself", "Killing of an insect", "Killing of a brother"], "ans": 0, "exp": "'Regicide' specifically refers to the killing of a king or monarch."}, {"section": "English", "q": "'To add insult to injury' means:", "opts": ["To apologise sincerely", "To make a bad situation worse", "To injure someone physically", "To praise excessively"], "ans": 1, "exp": "This idiom describes making an already bad situation even worse."}, {"section": "English", "q": "'To get cold feet' means:", "opts": ["To feel physically cold", "To become nervous before something important", "To lose interest permanently", "To recover quickly"], "ans": 1, "exp": "This idiom describes sudden nervousness or hesitation before an important event."}, {"section": "English", "q": "'To cut corners' means:", "opts": ["To take a shortcut, often sacrificing quality", "To travel a short distance", "To argue unfairly", "To finish early"], "ans": 0, "exp": "It means doing something in the cheapest or easiest way, often at the cost of quality."}, {"section": "English", "q": "The prefix 'omni-' means:", "opts": ["Against", "All", "Bad", "Wrongly"], "ans": 1, "exp": "'Omni-' means 'all', as in 'omnipresent' (present everywhere) and 'omniscient' (all-knowing)."}, {"section": "English", "q": "The suffix '-phobia' refers to:", "opts": ["Study of", "Fear of", "Killing of", "Without"], "ans": 1, "exp": "'-phobia' denotes fear of something, e.g., 'claustrophobia' (fear of confined spaces)."}, {"section": "English", "q": "'Ambivalent' means:", "opts": ["Having mixed or contradictory feelings", "Extremely certain", "Very aggressive", "Completely indifferent"], "ans": 0, "exp": "'Ambivalent' describes having mixed feelings or contradictory attitudes about something."}, {"section": "English", "q": "'Harbinger' most nearly means:", "opts": ["A messenger of doom only", "A sign that something is about to happen", "A type of ship", "A legal document"], "ans": 1, "exp": "A 'harbinger' is a sign or omen of something about to happen, positive or negative."}, {"section": "English", "q": "'Fastidious' describes a person who is:", "opts": ["Careless about details", "Extremely attentive to detail, hard to please", "Very generous", "Easily deceived"], "ans": 1, "exp": "'Fastidious' means very attentive to accuracy and detail, often excessively so."}, {"section": "English", "q": "An independent clause is one that:", "opts": ["Cannot stand alone", "Contains subject and verb and expresses a complete thought", "Only modifies a noun", "Has no verb"], "ans": 1, "exp": "An independent clause has a subject and verb and can stand alone as a complete sentence."}, {"section": "English", "q": "An adjective clause typically begins with:", "opts": ["because/since", "who/which/that", "if/unless", "and/but/or"], "ans": 1, "exp": "Adjective (relative) clauses modify nouns and usually begin with relative pronouns like who, which, or that."}, {"section": "English", "q": "Correct the error: 'The news are good today.'", "opts": ["The news is good today.", "The news were good today.", "The news be good today.", "No error"], "ans": 0, "exp": "'News' is grammatically singular (uncountable), so it takes a singular verb: 'is'."}, {"section": "English", "q": "Correct the error: 'He suggested me to see a doctor.'", "opts": ["He suggested that I see a doctor.", "He suggested I to see a doctor.", "He suggest me seeing a doctor.", "No error"], "ans": 0, "exp": "'Suggest' is not followed by object + infinitive; correct forms use 'that + subject + base verb' or 'advise + object + infinitive'."}, {"section": "General Science & Ability", "q": "A car covers 240 km using 20 litres of fuel. Its fuel efficiency is:", "opts": ["10 km/l", "12 km/l", "14 km/l", "16 km/l"], "ans": 1, "exp": "Efficiency = Distance/Fuel = 240/20 = 12 km per litre."}, {"section": "General Science & Ability", "q": "If x + 5 = 12, then 3x equals:", "opts": ["15", "18", "21", "24"], "ans": 2, "exp": "x = 12 - 5 = 7, so 3x = 21."}, {"section": "General Science & Ability", "q": "The next number in the series 2, 6, 12, 20, 30, ___ is:", "opts": ["36", "40", "42", "44"], "ans": 2, "exp": "Differences increase by 2 each time (4,6,8,10,12): 30 + 12 = 42."}, {"section": "General Science & Ability", "q": "A sum of Rs. 5000 becomes Rs. 5750 in 2 years at simple interest. The rate is:", "opts": ["5%", "6%", "7.5%", "10%"], "ans": 2, "exp": "SI = 750; R = (SI×100)/(P×T) = (750×100)/(5000×2) = 7.5%."}, {"section": "General Science & Ability", "q": "If two dice are rolled, the probability of getting a sum of 7 is:", "opts": ["1/6", "1/12", "1/36", "5/36"], "ans": 0, "exp": "There are 6 favourable outcomes (1-6,2-5,3-4,4-3,5-2,6-1) out of 36 total, giving 6/36 = 1/6."}, {"section": "General Science & Ability", "q": "The area of a circle with radius 7 cm (using π = 22/7) is:", "opts": ["144 cm²", "154 cm²", "164 cm²", "174 cm²"], "ans": 1, "exp": "Area = πr² = (22/7)×7×7 = 154 cm²."}, {"section": "General Science & Ability", "q": "The chemical symbol for gold is:", "opts": ["Ag", "Au", "Gd", "Go"], "ans": 1, "exp": "Gold's chemical symbol 'Au' comes from its Latin name 'aurum'."}, {"section": "General Science & Ability", "q": "Which blood group is known as the 'universal donor'?", "opts": ["A", "B", "AB", "O negative"], "ans": 3, "exp": "O negative blood lacks A, B, and Rh antigens, making it compatible with most recipients — the universal donor."}, {"section": "General Science & Ability", "q": "The human body has how many pairs of chromosomes (normally)?", "opts": ["21", "22", "23", "24"], "ans": 2, "exp": "Humans normally have 23 pairs (46 total) of chromosomes."}, {"section": "General Science & Ability", "q": "Newton's First Law of Motion is also known as the law of:", "opts": ["Acceleration", "Inertia", "Action-Reaction", "Gravitation"], "ans": 1, "exp": "Newton's First Law states that an object remains at rest or in uniform motion unless acted upon by a force — the law of inertia."}, {"section": "General Science & Ability", "q": "The SI unit of force is the:", "opts": ["Joule", "Newton", "Watt", "Pascal"], "ans": 1, "exp": "Force is measured in Newtons (N), named after Sir Isaac Newton."}, {"section": "General Science & Ability", "q": "Which planet is known as the 'Red Planet'?", "opts": ["Venus", "Mars", "Jupiter", "Saturn"], "ans": 1, "exp": "Mars appears reddish due to iron oxide (rust) on its surface, earning its nickname."}, {"section": "General Science & Ability", "q": "The hardest naturally occurring substance is:", "opts": ["Gold", "Iron", "Diamond", "Quartz"], "ans": 2, "exp": "Diamond is the hardest known natural material, rated 10 on the Mohs scale."}, {"section": "General Science & Ability", "q": "DNA stands for:", "opts": ["Deoxyribonucleic Acid", "Diribonucleic Acid", "Deoxyribose Nuclear Acid", "Dinitrogen Acid"], "ans": 0, "exp": "DNA (Deoxyribonucleic Acid) carries genetic instructions in living organisms."}, {"section": "General Science & Ability", "q": "If a shopkeeper marks up an item by 25% and then gives a 20% discount, the net effect on the original price is:", "opts": ["No change", "5% profit", "5% loss", "10% profit"], "ans": 0, "exp": "New price = Original × 1.25 × 0.80 = Original × 1.00 — the markup and discount exactly cancel, so there is no net change."}, {"section": "General Science & Ability", "q": "A train 100m long crosses a pole in 10 seconds. Its speed is:", "opts": ["10 m/s", "20 m/s", "36 km/h", "Both A and C"], "ans": 3, "exp": "Speed = Distance/Time = 100/10 = 10 m/s = 36 km/h (multiplying by 18/5), so both A and C are correct."}, {"section": "General Science & Ability", "q": "The average of first five prime numbers (2,3,5,7,11) is:", "opts": ["5.6", "5", "6", "6.5"], "ans": 0, "exp": "Sum = 2+3+5+7+11 = 28; Average = 28/5 = 5.6."}, {"section": "General Science & Ability", "q": "Which of the following is an example of a renewable energy source?", "opts": ["Coal", "Natural Gas", "Solar Power", "Petroleum"], "ans": 2, "exp": "Solar power is renewable because sunlight is naturally replenished; fossil fuels are non-renewable."}, {"section": "General Science & Ability", "q": "The freezing point of water in Fahrenheit is:", "opts": ["0°F", "32°F", "100°F", "212°F"], "ans": 1, "exp": "Water freezes at 32°F (equivalent to 0°C) at standard atmospheric pressure."}, {"section": "General Science & Ability", "q": "A alone can do a work in 10 days, B alone in 15 days. If they work on alternate days starting with A, in how many days will the work finish (approx.)?", "opts": ["11 days", "12 days", "13 days", "10 days"], "ans": 1, "exp": "A's 1-day rate=1/10, B's=1/15; in 2 days (A then B) they do 1/10+1/15=5/30=1/6 of work; after 12 days (6 cycles) work is complete (6×1/6=1), so approx 12 days."}, {"section": "Pakistan Affairs", "q": "The Objectives Resolution was moved in 1949 by:", "opts": ["Muhammad Ali Jinnah", "Liaquat Ali Khan", "Ayub Khan", "Iskander Mirza"], "ans": 1, "exp": "Liaquat Ali Khan, Pakistan's first Prime Minister, moved the Objectives Resolution in the Constituent Assembly in 1949."}, {"section": "Pakistan Affairs", "q": "The current Constitution of Pakistan was enforced on:", "opts": ["23 March 1956", "10 April 1973", "14 August 1973", "1 March 1962"], "ans": 2, "exp": "The 1973 Constitution was passed on 10 April 1973 but formally enforced on 14 August 1973."}, {"section": "Pakistan Affairs", "q": "The 18th Amendment (2010) is most notable for:", "opts": ["Introducing a presidential system", "Major devolution of power to the provinces", "Merging FATA into KP", "Adding Article 58(2)(b)"], "ans": 1, "exp": "The 18th Amendment significantly increased provincial autonomy and abolished the concurrent legislative list."}, {"section": "Pakistan Affairs", "q": "Which amendment added Article 58(2)(b), later repealed, giving the President power to dissolve the National Assembly?", "opts": ["8th Amendment", "13th Amendment", "18th Amendment", "25th Amendment"], "ans": 0, "exp": "The 8th Amendment (1985) introduced Article 58(2)(b); it was later repealed by the 18th Amendment."}, {"section": "Pakistan Affairs", "q": "Pakistan's total land area makes it approximately the world's:", "opts": ["25th largest country", "33rd largest country", "40th largest country", "50th largest country"], "ans": 1, "exp": "Pakistan, at about 796,096 sq km, ranks around the 33rd largest country in the world by area."}, {"section": "Pakistan Affairs", "q": "Tarbela Dam is built on which river?", "opts": ["Jhelum", "Chenab", "Indus", "Ravi"], "ans": 2, "exp": "Tarbela Dam, one of the world's largest earth-filled dams, is located on the Indus River in Khyber Pakhtunkhwa."}, {"section": "Pakistan Affairs", "q": "Mangla Dam is constructed on which river?", "opts": ["Indus", "Jhelum", "Chenab", "Sutlej"], "ans": 1, "exp": "Mangla Dam, a major hydroelectric and irrigation reservoir, is built on the Jhelum River in Azad Jammu & Kashmir."}, {"section": "Pakistan Affairs", "q": "Pakistan's national flower is:", "opts": ["Rose", "Jasmine", "Tulip", "Lily"], "ans": 1, "exp": "Jasmine is Pakistan's national flower, prized for its fragrance."}, {"section": "Pakistan Affairs", "q": "Pakistan's national animal is the:", "opts": ["Snow Leopard", "Markhor", "Ibex", "Deer"], "ans": 1, "exp": "The Markhor, a wild goat species, is Pakistan's national animal."}, {"section": "Pakistan Affairs", "q": "Which event is associated with 1971 in Pakistan's history?", "opts": ["Nuclear tests", "Separation of East Pakistan / creation of Bangladesh", "First martial law", "Kargil conflict"], "ans": 1, "exp": "In 1971, East Pakistan separated and became the independent nation of Bangladesh, following a civil war and Indo-Pak war."}, {"section": "Pakistan Affairs", "q": "Who was Pakistan's first President?", "opts": ["Muhammad Ali Jinnah", "Iskander Mirza", "Ayub Khan", "Liaquat Ali Khan"], "ans": 1, "exp": "Iskander Mirza became Pakistan's first President in 1956, when the country was declared an Islamic Republic under the new constitution."}, {"section": "Pakistan Affairs", "q": "The Kashmir dispute's Line of Control (LoC) was later adjusted by which agreement?", "opts": ["Tashkent Declaration", "Simla Agreement (1972)", "Lahore Declaration", "Karachi Agreement"], "ans": 1, "exp": "The 1972 Simla Agreement between Pakistan and India adjusted the ceasefire line into the current Line of Control."}, {"section": "Pakistan Affairs", "q": "India revoked Jammu & Kashmir's special status (Article 370) in:", "opts": ["2016", "2017", "2019", "2021"], "ans": 2, "exp": "India revoked Article 370, ending Jammu & Kashmir's special constitutional status, in August 2019."}, {"section": "Pakistan Affairs", "q": "Pakistan's nuclear tests (Chagai-I) were conducted in response to India's nuclear tests conducted in which month of 1998?", "opts": ["April 1998", "May 1998 (earlier in the same month)", "June 1998", "March 1998"], "ans": 1, "exp": "India tested nuclear devices in May 1998, and Pakistan responded with its own tests later that same month (28 May)."}, {"section": "Pakistan Affairs", "q": "Dr. Abdul Qadeer Khan is most associated with Pakistan's:", "opts": ["Space programme", "Uranium enrichment/nuclear programme", "Naval defence", "Agricultural reform"], "ans": 1, "exp": "Dr. A.Q. Khan is widely credited as a key figure behind Pakistan's uranium enrichment and nuclear weapons programme."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which of the following is con ": "International Literacy Day is observed annually on:", "opts": ["8 September", "5 October", "10 December", "21 February"], "ans": 0, "exp": "International Literacy Day is observed on 8 September each year."}, {"section": "Urdu Grammar", "q": "'صفت' کسے کہتے ہیں؟", "opts": ["کسی کام کا نام", "کسی اسم کی خوبی یا خصوصیت بتانے والا لفظ", "حرفِ ربط", "تعجب کا اظہار"], "ans": 1, "exp": "صفت وہ لفظ ہے جو کسی اسم کی خوبی، حالت یا خصوصیت ظاہر کرے، جیسے 'اچھا لڑکا' میں 'اچھا'۔"}, {"section": "Urdu Grammar", "q": "ضمیر کی تعریف ہے:", "opts": ["اسم کی جگہ استعمال ہونے والا لفظ", "فعل کی ایک قسم", "حرفِ جار", "صفت کی ایک قسم"], "ans": 0, "exp": "ضمیر وہ لفظ ہے جو اسم کی جگہ استعمال ہوتا ہے، جیسے میں، تم، وہ۔"}, {"section": "Urdu Grammar", "q": "'خوشی' اور 'غم' کس قسم کے الفاظ ہیں؟", "opts": ["مترادف", "متضاد", "محاورات", "ضمائر"], "ans": 1, "exp": "'خوشی' اور 'غم' ایک دوسرے کے مخالف معنی رکھتے ہیں، اس لیے یہ متضاد الفاظ ہیں۔"}, {"section": "General Knowledge", "q": "The 'Iron Curtain' historically referred to the political division between:", "opts": ["North and South America", "Western Europe and Soviet-controlled Eastern Europe", "Asia and Africa", "North and South Korea"], "ans": 1, "exp": "The term described the ideological and physical divide between Western Europe and the Soviet-aligned Eastern Bloc during the Cold War."}, {"section": "General Knowledge", "q": "The League of Nations, predecessor to the UN, was established after:", "opts": ["World War I", "World War II", "The Cold War", "The Korean War"], "ans": 0, "exp": "The League of Nations was formed in 1920 after World War I, aiming to prevent future conflicts, but was replaced by the UN after WWII."}, {"section": "General Knowledge", "q": "NATO stands for:", "opts": ["North Atlantic Treaty Organization", "New Asian Trade Organization", "North American Trade Organization", "National Atlantic Treaty Office"], "ans": 0, "exp": "NATO is the North Atlantic Treaty Organization, a military alliance of North American and European countries."}, {"section": "General Knowledge", "q": "The currency of the United Kingdom is the:", "opts": ["Euro", "Pound Sterling", "Dollar", "Franc"], "ans": 1, "exp": "The UK's official currency is the Pound Sterling (GBP)."}, {"section": "General Knowledge", "q": "The Suez Canal connects which two seas?", "opts": ["Mediterranean Sea and Red Sea", "Atlantic and Pacific Oceans", "Black Sea and Caspian Sea", "Red Sea and Arabian Sea"], "ans": 0, "exp": "The Suez Canal in Egypt links the Mediterranean Sea to the Red Sea, providing a key shortcut for international shipping."}, {"section": "General Knowledge", "q": "The Panama Canal connects which two oceans?", "opts": ["Atlantic and Pacific Oceans", "Indian and Atlantic Oceans", "Arctic and Pacific Oceans", "Indian and Pacific Oceans"], "ans": 0, "exp": "The Panama Canal connects the Atlantic and Pacific Oceans, a vital route through Central America."}, {"section": "General Knowledge", "q": "Mount Kilimanjaro, Africa's highest peak, is located in:", "opts": ["Kenya", "Tanzania", "Uganda", "Ethiopia"], "ans": 1, "exp": "Mount Kilimanjaro is located in Tanzania, East Africa."}, {"section": "General Knowledge", "q": "The 'Land of the Rising Sun' is a nickname for:", "opts": ["China", "Japan", "South Korea", "Thailand"], "ans": 1, "exp": "Japan is traditionally known as the 'Land of the Rising Sun', reflecting its eastern position and the meaning of its name (Nihon)."}, {"section": "General Knowledge", "q": "The currency of Saudi Arabia is the:", "opts": ["Dinar", "Riyal", "Dirham", "Rial"], "ans": 1, "exp": "Saudi Arabia's official currency is the Riyal."}, {"section": "General Knowledge", "q": "Which country has the largest population of Muslims in the world?", "opts": ["Saudi Arabia", "Pakistan", "Indonesia", "Egypt"], "ans": 2, "exp": "Indonesia has the world's largest Muslim population by country, ahead of Pakistan and India."}, {"section": "General Knowledge", "q": "The Berlin Wall fell in the year:", "opts": ["1985", "1989", "1991", "1993"], "ans": 1, "exp": "The Berlin Wall fell in November 1989, symbolizing the end of the Cold War division of Germany."}, {"section": "General Knowledge", "q": "The Statue of Liberty is located in which country?", "opts": ["France", "United Kingdom", "United States", "Canada"], "ans": 2, "exp": "The Statue of Liberty stands in New York Harbor, United States; it was a gift from France."}, {"section": "Urdu Grammar", "q": "'استعارہ' ادب میں کس چیز کو کہتے ہیں؟", "opts": ["ایک چیز کو دوسری چیز سے تشبیہ دیے بغیر اس کے قائم مقام ٹھہرانا", "صرف تشبیہ دینا", "شعر کی بحر", "قافیہ"], "ans": 0, "exp": "استعارہ میں ایک چیز کو دوسری چیز کے قائم مقام ٹھہرایا جاتا ہے، بغیر 'کی طرح' یا 'جیسا' استعمال کیے۔"}, {"section": "Urdu Grammar", "q": "جملہ فعلیہ میں لازمی طور پر شامل ہوتا ہے:", "opts": ["صرف اسم", "فعل", "صرف صفت", "صرف حرف ربط"], "ans": 1, "exp": "جملہ فعلیہ وہ جملہ ہے جس میں فعل شامل ہو اور وہ کسی کام کے ہونے یا کرنے کی خبر دے۔"}, {"section": "General Knowledge", "q": "The Eiffel Tower is located in which city?", "opts": ["London", "Paris", "Rome", "Berlin"], "ans": 1, "exp": "The Eiffel Tower, an iconic iron structure, stands in Paris, France."}, {"section": "General Knowledge", "q": "The 'Taj Mahal' is located in which country?", "opts": ["Pakistan", "India", "Bangladesh", "Iran"], "ans": 1, "exp": "The Taj Mahal, a mausoleum built by Mughal Emperor Shah Jahan, is located in Agra, India."}, {"section": "General Knowledge", "q": "Which country is known as the 'Land of a Thousand Lakes'?", "opts": ["Sweden", "Finland", "Norway", "Canada"], "ans": 1, "exp": "Finland, with its vast number of natural lakes, is nicknamed the 'Land of a Thousand Lakes'."}];
 
const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};
 
function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}
 
function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}
 
function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}
 
function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];
 
  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');
 
  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';
 
  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;
 
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}
 
function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}
 
renderStart();
</script>
