<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CSS/FPSC MPT Quiz — Set 5</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1c1c;--sub:#6b6b6b;--ac:#0f5132;--line:#e4e1da;--bad:#8a1f11;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c}}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}
.w{max-width:700px;margin:0 auto;padding:22px 16px 50px}
h1{font-size:1.4rem;text-align:center;margin:0 0 16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;font-family:system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;cursor:pointer;font-size:.8rem}
.chip.a{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt{display:block;width:100%;text-align:left;padding:11px 13px;margin-bottom:9px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font-size:.95rem;cursor:pointer}
.opt.ok{background:#0f513230;border-color:var(--ac)}.opt.no{background:#8a1f1130;border-color:var(--bad)}
.q{font-family:Georgia,serif;font-size:1.12rem;line-height:1.5;margin:6px 0 16px}
.t,.s{font-size:.75rem;color:var(--sub)}.t{text-transform:uppercase;letter-spacing:.08em}
.ex{margin-top:10px;padding:11px;border:1px dashed var(--line);border-radius:8px;font-size:.88rem;color:var(--sub);line-height:1.5}
.r{display:flex;gap:10px;margin-top:14px}
.b{flex:1;padding:11px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:.9rem;cursor:pointer}
.b.g{background:transparent;color:var(--ink);border:1px solid var(--line)}.b:disabled{opacity:.4}
.bar{height:6px;background:var(--line);border-radius:4px;margin:8px 0 14px}.bar div{height:100%;background:var(--ac);border-radius:4px}
.big{font-size:3rem;color:var(--ac);font-weight:700;text-align:center}
</style></head><body><div class="w"><h1>CSS / FPSC MPT Quiz — Set 5</h1><div id="app"></div></div>
<script>
const I="Islamic Studies",E="English",S="General Science & Ability",C="Current Affairs",P="Pakistan Affairs";
const Q=[

[I,"How many Surahs are in the Quran?",["110","112","114","116"],2,"The Quran has 114 Surahs."],
[I,"The longest Surah of the Quran is:",["Al-Imran","An-Nisa","Al-Baqarah","Al-Maidah"],2,"Al-Baqarah has 286 verses."],

[I,"Who sent standardized copies of the Quran to major cities?",["Hazrat Abu Bakr (RA)","Hazrat Umar (RA)","Hazrat Usman (RA)","Hazrat Ali (RA)"],2,"Usman (RA) standardized the Mushaf and distributed copies."],
[I,"The Hijri calendar was introduced under which caliph?",["Abu Bakr (RA)","Umar (RA)","Usman (RA)","Ali (RA)"],1,"Umar (RA) fixed the Hijrah as the start of the Islamic calendar."],
[I,"The Nisab of silver for Zakat is:",["40 tola","52.5 tola","60 tola","87.5 tola"],1,"Silver nisab is 52.5 tola (≈612.36 g); gold is 7.5 tola."],
[I,"The Farewell Sermon was delivered at:",["Mina","Arafat","Muzdalifah","Madinah"],1,"It was delivered at Mount Arafat in 10 AH."],
[I,"Wuqoof-e-Arafah takes place on:",["8 Dhul-Hijjah","9 Dhul-Hijjah","10 Dhul-Hijjah","12 Dhul-Hijjah"],1,"Standing at Arafat on 9 Dhul-Hijjah is the essence of Hajj."],
[I,"Imam Abu Hanifa is known by the title:",["Imam-e-Azam","Imam-ul-Muhaddithin","Imam-e-Haramain","Sheikh-ul-Islam"],0,"Abu Hanifa, founder of the Hanafi school, is called Imam-e-Azam."],
[E,"Synonym of 'Ephemeral':",["Eternal","Short-lived","Heavy","Fragile"],1,"Ephemeral means lasting a very short time."],
[E,"Antonym of 'Ostentatious':",["Showy","Modest","Rich","Loud"],1,"Ostentatious means showy; modest is the opposite."],
[E,"'Once in a blue moon' means:",["Very often","Rarely","At night","Suddenly"],1,"It means very rarely."],
[E,"'A piece of cake' means:",["A dessert","Something very easy","A reward","A small share"],1,"It idiomatically means a very easy task."],
[E,"Choose the correct sentence:",["Neither of the answers are correct.","Neither of the answers is correct.","Neither of the answer is correct.","Neither of answers were correct."],1,"'Neither' takes a singular verb."],
[E,"Correct spelling:",["Acommodation","Accomodation","Accommodation","Acomodation"],2,"Accommodation has double c and double m."],
[E,"'He is fond ___ music.'",["on","of","with","for"],1,"'Fond of' is the correct collocation."],
[E,"'She is ___ honest woman.'",["a","an","the","no article"],1,"'Honest' starts with a vowel sound, so 'an'."],
[E,"One word for 'one who knows everything':",["Omnipotent","Omniscient","Omnipresent","Omnivorous"],1,"Omniscient means all-knowing."],
[E,"Indirect speech: He said, \"I am happy.\"",["He said that he is happy.","He said that he was happy.","He said that I was happy.","He said he has been happy."],1,"Present tense shifts to past in reported speech."],
[E,"Synonym of 'Candid':",["Frank","Secretive","Sweet","Tricky"],0,"Candid means honest and straightforward."],
[E,"'Everyone ___ present at the meeting.'",["were","was","are","have been"],1,"'Everyone' is singular."],
[S,"Speed of light in vacuum is about:",["3×10⁶ m/s","3×10⁸ m/s","3×10¹⁰ m/s","3×10⁵ m/s"],1,"c ≈ 3×10⁸ m/s."],
[S,"The powerhouse of the cell is the:",["Nucleus","Ribosome","Mitochondria","Golgi body"],2,"Mitochondria produce most of the cell's ATP."],
[S,"SI unit of force is:",["Joule","Newton","Pascal","Watt"],1,"Force is measured in newtons."],
[S,"Gas commonly used in fire extinguishers:",["Oxygen","Carbon dioxide","Hydrogen","Methane"],1,"CO₂ displaces oxygen and smothers fire."],
[S,"pH of a neutral solution at 25°C:",["0","5","7","14"],2,"Pure water has pH 7."],
[S,"What is 15% of 240?",["30","36","40","42"],1,"0.15×240 = 36."],
[S,"Average of 5 numbers is 20. After removing one, average of the rest is 18. The removed number is:",["24","26","28","30"],2,"100 − 72 = 28."],
[S,"Next in series: 2, 6, 12, 20, 30, ?",["36","40","42","44"],2,"Differences increase by 2 (+12): 42."],
[S,"Time to travel 150 km at 60 km/h:",["2 h","2.5 h","3 h","3.5 h"],1,"150/60 = 2.5 hours."],
[S,"Bought at Rs. 400, sold at Rs. 500. Profit %:",["20%","25%","30%","35%"],1,"100/400 = 25%."],
[S,"Area of a triangle with base 10 cm and height 6 cm:",["16","30","60","36"],1,"½×10×6 = 30 cm²."],
[S,"RAM is a type of ___ memory.",["Volatile","Permanent","Read-only","Optical"],0,"RAM loses its data when power is off."],
[C,"The UN headquarters is in:",["Geneva","New York","Vienna","Paris"],1,"UN HQ is in New York City."],
[C,"The IMF is headquartered in:",["Geneva","Washington D.C.","London","Basel"],1,"IMF HQ is in Washington D.C."],
[C,"The WHO is headquartered in:",["New York","Rome","Geneva","Paris"],2,"WHO HQ is in Geneva."],
[C,"SAARC's secretariat is located in:",["Dhaka","Islamabad","Kathmandu","Colombo"],2,"The SAARC Secretariat is in Kathmandu."],
[C,"NATO was founded in:",["1945","1949","1955","1961"],1,"NATO was formed in 1949."],
[C,"The United Nations was founded in:",["1919","1939","1945","1948"],2,"The UN Charter came into force in 1945."],

[C,"Gwadar Port is operated by:",["DP World","China Overseas Port Holding Co.","PSA International","Hutchison"],1,"COPHC holds the Gwadar Port concession."],
[C,"The Paris Climate Agreement was adopted in:",["2009","2012","2015","2018"],2,"It was adopted at COP21 in 2015."],
[C,"How many Sustainable Development Goals (SDGs) are there?",["8","12","17","20"],2,"The 2030 Agenda has 17 SDGs."],
[C,"Central banking in Pakistan: SBP was established in:",["1947","1948","1956","1973"],1,"SBP began operations on 1 July 1948."],
[C,"Antonio Guterres is Secretary-General of:",["NATO","UN","WTO","OIC"],1,"He has led the UN since 2017."],
[P,"The Objectives Resolution was passed in:",["1947","1949","1956","1962"],1,"Passed March 1949 under Liaquat Ali Khan."],
[P,"The Lahore Resolution was moved by:",["Jinnah","A.K. Fazlul Haq","Liaquat Ali Khan","Chaudhry Khaliquzzaman"],1,"Fazlul Haq moved it on 23 March 1940."],
[P,"The Simla Deputation was in:",["1905","1906","1909","1916"],1,"It met Lord Minto in October 1906."],
[P,"The Lucknow Pact was signed in:",["1906","1909","1916","1919"],2,"The League–Congress pact was in 1916."],
[P,"Jinnah's Fourteen Points were presented in:",["1927","1929","1930","1935"],1,"They were a reply to the Nehru Report (1928)."],
[P,"The Cabinet Mission arrived in India in:",["1942","1945","1946","1947"],2,"The Cabinet Mission Plan was announced in 1946."],
[P,"The 3rd June Plan (Partition Plan) was in:",["1945","1946","1947","1948"],2,"Announced by Mountbatten on 3 June 1947."],
[P,"Pakistan's first Prime Minister was:",["Jinnah","Liaquat Ali Khan","Khawaja Nazimuddin","Iskander Mirza"],1,"Liaquat Ali Khan served 1947–1951."],
[P,"The Tashkent Declaration was signed in:",["1962","1965","1966","1972"],2,"Signed January 1966 after the 1965 war."],
[P,"The 18th Constitutional Amendment was passed in:",["2003","2008","2010","2015"],2,"It devolved powers to provinces in 2010."],
[P,"The Senate of Pakistan has how many members?",["88","96","104","100"],1,"The Senate has 96 members."],
[P,"The National Assembly of Pakistan has how many seats in total?",["272","336","342","300"],1,"266 general + 60 women + 10 minorities = 336."],
[I,"How many Juz (paras) does the Quran have?",["20","30","40","114"],1,"The Quran is divided into 30 Juz."],
[I,"Which Surah is called the 'heart of the Quran'?",["Al-Ikhlas","Ya-Sin","Ar-Rahman","Al-Kahf"],1,"Ya-Sin is traditionally called the heart of the Quran."],
[I,"The Prophet (PBUH) was born in the Year of the Elephant, around:",["540 CE","570 CE","600 CE","610 CE"],1,"He was born about 570 CE in Makkah."],
[I,"The Prophet's first wife was:",["Aisha (RA)","Hafsa (RA)","Khadijah (RA)","Zainab (RA)"],2,"Khadijah (RA) was his first wife and first believer."],
[I,"The Battle of Uhud took place in:",["2 AH","3 AH","5 AH","6 AH"],1,"Uhud was fought in Shawwal, 3 AH."],
[I,"The first Muezzin of Islam was:",["Bilal (RA)","Salman (RA)","Abu Dharr (RA)","Ammar (RA)"],0,"Bilal ibn Rabah (RA) gave the first adhan."],
[I,"The Qibla was changed from Jerusalem to the Kaaba in:",["1 AH","2 AH","4 AH","6 AH"],1,"The change came in 2 AH."],
[I,"The Battle of Khandaq (Trench) was fought in:",["3 AH","4 AH","5 AH","7 AH"],2,"Khandaq took place in 5 AH, with a trench suggested by Salman Farsi (RA)."],
[E,"Synonym of 'Obsolete':",["Modern","Outdated","Useful","Vital"],1,"Obsolete means no longer in use."],
[E,"Antonym of 'Expand':",["Grow","Contract","Spread","Stretch"],1,"Contract is the opposite of expand."],
[E,"'To spill the beans' means:",["To waste food","To reveal a secret","To cook","To make a mess"],1,"It means to disclose a secret."],
[E,"'To break the ice' means:",["To start a conversation in an awkward setting","To damage something","To feel cold","To end a friendship"],0,"It means easing initial social tension."],
[E,"Correct spelling:",["Embarass","Embarrass","Embarras","Embaress"],1,"Embarrass has double r and double s."],
[E,"'He has been living here ___ 2015.'",["for","since","from","by"],1,"'Since' goes with a point in time."],
[E,"Fear of closed spaces is called:",["Acrophobia","Claustrophobia","Agoraphobia","Hydrophobia"],1,"Claustrophobia is fear of confined spaces."],
[E,"Passive of 'They are building a bridge':",["A bridge was built by them.","A bridge is being built by them.","A bridge has been built.","A bridge is built by them."],1,"Present continuous passive: is/are being + past participle."],
[S,"Chemical symbol of gold:",["Ag","Au","Gd","Go"],1,"Au comes from Latin 'aurum'."],
[S,"Vitamin synthesized by skin in sunlight:",["A","C","D","K"],2,"Vitamin D is made in skin under UVB light."],
[S,"The largest organ of the human body is:",["Liver","Skin","Lungs","Brain"],1,"Skin is the largest organ."],
[S,"The acid found in vinegar:",["Citric","Acetic","Lactic","Formic"],1,"Vinegar contains acetic acid."],
[S,"Solve: 2x + 5 = 17",["5","6","7","8"],1,"2x = 12, so x = 6."],
[S,"Simple interest on Rs. 5,000 at 10% for 3 years:",["Rs. 1,000","Rs. 1,500","Rs. 1,650","Rs. 2,000"],1,"5000×10×3/100 = 1500."],
[S,"Binary equivalent of decimal 5:",["100","101","110","111"],1,"5 = 4 + 1 = 101."],
[S,"The planet closest to the Sun:",["Venus","Mercury","Mars","Earth"],1,"Mercury is nearest the Sun."],
[C,"OPEC is headquartered in:",["Riyadh","Vienna","Geneva","Doha"],1,"OPEC's HQ is in Vienna, Austria."],
[C,"The International Court of Justice sits in:",["Geneva","The Hague","Brussels","New York"],1,"The ICJ is in The Hague, Netherlands."],
[C,"The UN Security Council has how many non-permanent members?",["5","8","10","15"],2,"Ten elected non-permanent members serve two-year terms."],
[C,"The Asian Development Bank is headquartered in:",["Tokyo","Manila","Beijing","Singapore"],1,"ADB HQ is in Manila, Philippines."],
[C,"The Asian Infrastructure Investment Bank (AIIB) is headquartered in:",["Shanghai","Beijing","Hong Kong","Singapore"],1,"AIIB HQ is in Beijing."],
[C,"The WTO is headquartered in:",["Geneva","New York","Brussels","Washington"],0,"The WTO is based in Geneva."],
[C,"The Nobel Peace Prize is awarded in:",["Stockholm","Oslo","Copenhagen","Geneva"],1,"The Peace Prize ceremony is held in Oslo."],
[C,"Which of these is NOT a G7 member?",["Japan","Canada","China","Italy"],2,"G7: US, UK, France, Germany, Italy, Japan, Canada."],
[P,"Allama Iqbal was born in:",["Lahore","Sialkot","Delhi","Aligarh"],1,"Iqbal was born in Sialkot in 1877."],
[P,"Quaid-e-Azam died on:",["14 Aug 1947","11 Sept 1948","25 Dec 1948","23 Mar 1949"],1,"He died on 11 September 1948 in Karachi."],
[P,"Pakistan's first constitution came into force in:",["1947","1953","1956","1962"],2,"The 1956 Constitution made Pakistan an Islamic Republic."],
[P,"The first martial law in Pakistan was imposed in:",["1955","1958","1969","1977"],1,"Martial law was imposed in October 1958."],
[P,"East Pakistan became Bangladesh on:",["26 Mar 1971","16 Dec 1971","3 Dec 1971","2 Jul 1972"],1,"Dhaka fell on 16 December 1971."],
[P,"The 1973 Constitution came into force on:",["10 April 1973","14 August 1973","23 March 1973","5 July 1973"],1,"It was enforced on 14 August 1973."],
[P,"Pakistan's national language under the Constitution is:",["English","Urdu","Punjabi","Arabic"],1,"Article 251 declares Urdu the national language."],
[P,"The Indus Waters Treaty was signed in:",["1950","1960","1965","1972"],1,"It was signed in 1960 with World Bank mediation."]
];
const SEC=[...new Set(Q.map(x=>x[0]))],app=document.getElementById('app');
let pool,i,ans,sc,sec;
function start(){app.innerHTML=`<div class="c"><p class="s">Pick a section or take all. ${Q.length} fresh questions, none repeated from earlier sets.</p><div class="chips"><div class="chip a" data-s="All">All (${Q.length})</div>${SEC.map(s=>`<div class="chip" data-s="${s}">${s} (${Q.filter(x=>x[0]==s).length})</div>`).join("")}</div><div class="r"><button class="b" id="go">Start Quiz</button></div></div>`;let ch="All";document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("a"));c.classList.add("a");ch=c.dataset.s});document.getElementById("go").onclick=()=>{sec=ch;pool=ch=="All"?Q:Q.filter(x=>x[0]==ch);i=0;ans={};sc=0;show()}}
function show(){const q=pool[i],a=ans[i],n=pool.length;app.innerHTML=`<div class="s" style="display:flex;justify-content:space-between"><span>Question ${i+1} / ${n}</span><span>Score: ${sc}</span></div><div class="bar"><div style="width:${i/n*100}%"></div></div><div class="c"><div class="t">${q[0]}</div><div class="q">${q[1]}</div>${q[2].map((o,k)=>`<button class="opt${a!==undefined?(k==q[3]?" ok":k==a?" no":""):""}" data-k="${k}" ${a!==undefined?"disabled":""}>${"ABCD"[k]}. ${o}</button>`).join("")}${a!==undefined?`<div class="ex"><b>${a==q[3]?"Correct. ":"Not quite. "}</b>${q[4]}</div>`:""}<div class="r"><button class="b g" id="pv" ${i?"":"disabled"}>Previous</button><button class="b" id="nx" ${a===undefined?"disabled":""}>${i==n-1?"Finish":"Next"}</button></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;ans[i]=k;if(k==q[3])sc++;show()});
pv.onclick=()=>{i--;show()};nx.onclick=()=>{if(i<n-1){i++;show()}else done()}}
function done(){const n=pool.length;app.innerHTML=`<div class="c" style="text-align:center"><div class="t">${sec}</div><div class="big">${sc} / ${n}</div><div class="s">${Math.round(sc/n*100)}% correct</div><div class="r"><button class="b g" id="rt">Retry</button><button class="b" id="hm">Choose Section</button></div></div>`;rt.onclick=()=>{i=0;ans={};sc=0;show()};hm.onclick=start}
start();
</script></body></html>
