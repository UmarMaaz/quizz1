<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS/FPSC MPT Quiz — Set 3 (Mixed)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#5d6675;--bd:#dfe3ea;--ac:#2557d6;--ok:#15803d;--okb:#e3f6ea;--no:#b91c1c;--nob:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eceff4;--mu:#9aa5b5;--bd:#2c3440;--ac:#6b93ff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1717}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eceff4;--mu:#9aa5b5;--bd:#2c3440;--ac:#6b93ff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1717}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.3rem;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:1rem;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:6px;background:var(--bd);color:var(--mu);margin-bottom:8px}
.q{font-size:1.08rem;font-weight:600;margin:0 0 14px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin:0 0 9px;font-size:1rem;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.ex{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--ac);font-size:.94rem}
.sc{font-size:2.4rem;font-weight:700;margin:6px 0}
.hide{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:.92rem}.rv b.ok{color:var(--ok)}.rv b.no{color:var(--no)}
</style></head>
<body><div class="w">
<h1>CSS/FPSC MPT Quiz — Set 3</h1>
<p class="sub">100 mixed MCQs, weighted toward Maths, English and GK. Explanation after every answer.</p>

<div id="home" class="card">
<b>Choose a mode</b>
<div class="chips" id="chips"></div>
<label class="sub"><input type="checkbox" id="shuf" checked> Shuffle question order</label>
<div class="row"><button class="btn" id="start">Start quiz</button></div>
</div>

<div id="play" class="hide">
<div class="top"><span id="cnt"></span><span id="scr"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><span class="tag" id="tg"></span><p class="q" id="qt"></p><div id="opts"></div>
<div id="ex" class="ex hide"></div>
<div class="row"><button class="btn hide" id="nx">Next</button></div></div>
</div>

<div id="end" class="card hide">
<b>Quiz complete</b><div class="sc" id="fs"></div><div id="fm" class="sub"></div>
<div class="row"><button class="btn" id="again">Try again</button><button class="btn g" id="revb">Review answers</button></div>
<div id="rev" class="hide"></div>
</div>
</div>

<script>
const N={M:"Maths",E:"English",G:"General Knowledge",P:"Pakistan & Islamic"};
// [cat, question, "opt|opt|opt|opt", correctIndex, explanation]
const Q=[
["M","In an exam a student scores 462 out of 700. What is the percentage?","60%|66%|68%|72%",1,"(462/700) × 100 = 66%."],
["M","Simple interest on Rs. 10,000 at 5% per annum for 4 years is:","Rs. 1,500|Rs. 2,000|Rs. 2,500|Rs. 3,000",1,"SI = (P×R×T)/100 = (10000×5×4)/100 = Rs. 2,000."],
["M","Compound interest on Rs. 1,000 at 10% per annum for 2 years is:","Rs. 200|Rs. 210|Rs. 220|Rs. 250",1,"A = 1000(1.1)² = 1210, so CI = A − P = Rs. 210."],
["M","A price rises by 20% and then falls by 10%. The net change is:","+10%|+8%|+12%|+6%",1,"Net = a + b + ab/100 = 20 − 10 − 2 = +8%."],
["M","Two successive discounts of 20% and 10% equal a single discount of:","30%|28%|25%|32%",1,"Net discount = a + b − ab/100 = 30 − 2 = 28%, not 30%."],
["M","A car goes at 40 km/h and returns the same route at 60 km/h. Average speed for the round trip is:","50 km/h|48 km/h|45 km/h|52 km/h",1,"Equal distances: 2xy/(x+y) = 2×40×60/100 = 48 km/h."],
["M","A can finish a job in 12 days and B in 18 days. Together they finish it in:","6 days|7.2 days|8 days|15 days",1,"Rate = 1/12 + 1/18 = 5/36 per day, so time = 36/5 = 7.2 days."],
["M","Pipe A fills a tank in 6 h; pipe B empties it in 8 h. Both open together, the tank fills in:","14 h|18 h|24 h|48 h",2,"Net rate = 1/6 − 1/8 = 1/24, so 24 hours."],
["M","Present ages of A and B are in ratio 3:5. After 6 years the ratio is 2:3. A's present age is:","15|18|21|24",1,"(3x+6)/(5x+6) = 2/3 gives x = 6, so A = 18."],
["M","A and B invest Rs. 20,000 and Rs. 30,000. Profit is Rs. 10,000. A's share is:","Rs. 4,000|Rs. 5,000|Rs. 6,000|Rs. 3,000",0,"Profit is shared in the ratio of investment 2:3, so A gets 2/5 × 10,000 = Rs. 4,000."],
["M","A boat's still-water speed is 10 km/h and the stream is 2 km/h. Upstream speed is:","12 km/h|8 km/h|10 km/h|6 km/h",1,"Upstream = 10 − 2 = 8 km/h (downstream would be 12)."],
["M","HCF of two numbers is 6, LCM is 84 and one number is 12. The other is:","36|42|48|54",1,"HCF × LCM = product, so other = 6×84/12 = 42."],
["M","Which number is divisible by 11?","2728|2729|2730|2731",0,"Alternate digit sums: (2+2) and (7+8) = 4 and 15; difference 11 is divisible by 11."],
["M","The only even prime number is:","1|2|3|5",1,"2 is divisible only by 1 and itself, and it is even."],
["M","If a + b = 7 and ab = 12, then a² + b² equals:","25|37|19|29",0,"a² + b² = (a+b)² − 2ab = 49 − 24 = 25."],
["M","The value of 13² − 12² is:","1|25|156|169",1,"a² − b² = (a+b)(a−b) = 25 × 1 = 25."],
["M","The roots of x² − 5x + 6 = 0 are:","2 and 3|1 and 6|−2 and −3|−1 and −6",0,"Factorise: (x−2)(x−3) = 0."],
["M","2³ × 2⁴ equals:","64|128|256|32",1,"Same base: add exponents, 2⁷ = 128."],
["M","Sum of interior angles of a hexagon is:","540°|720°|900°|1080°",1,"(n−2) × 180° = 4 × 180° = 720°."],
["M","Area of a circle of radius 7 (π = 22/7) is:","44|154|49|22",1,"πr² = 22/7 × 49 = 154."],
["M","A right triangle has sides 6 and 8. The hypotenuse is:","9|10|12|14",1,"√(6² + 8²) = √100 = 10."],
["M","Volume of a cylinder with r = 7 and h = 10 (π = 22/7) is:","1540|770|154|3080",0,"πr²h = 22/7 × 49 × 10 = 1540."],
["M","Volume of a sphere of radius 3 is:","12π|36π|27π|108π",1,"(4/3)πr³ = (4/3) × 27 × π = 36π."],
["M","Area of a trapezium with parallel sides 8 and 12 and height 5 is:","100|50|40|60",1,"½(a+b)×h = ½ × 20 × 5 = 50."],
["M","10th term of the AP 3, 7, 11, 15… is:","39|43|37|35",0,"a + 9d = 3 + 36 = 39."],
["M","6th term of the GP 2, 6, 18, 54… is:","162|486|1458|324",1,"a×r⁵ = 2 × 243 = 486."],
["M","sin 30° equals:","1/2|√3/2|1|1/√3",0,"Standard value: sin 30° = 1/2."],
["M","A die is thrown once. Probability of an even number is:","1/6|1/3|1/2|2/3",2,"Favourable outcomes 2, 4, 6 out of 6 = 1/2."],
["M","The value of 5C2 is:","10|20|5|25",0,"5!/(2!×3!) = 10."],
["M","30 students like Maths, 25 like Science, 15 like both. How many like at least one?","55|40|45|70",1,"|A∪B| = 30 + 25 − 15 = 40."],
["M","In a pie chart, a 25% share corresponds to an angle of:","60°|75°|90°|100°",2,"Each 1% = 3.6°, so 25% = 90°."],
["M","Next term in the series 2, 6, 12, 20, 30, ? is:","40|42|44|36",1,"Differences 4, 6, 8, 10, 12, so 30 + 12 = 42."],
["M","A painted cube is cut into 4×4×4 small cubes. How many have exactly one face painted?","24|12|8|36",0,"6(n−2)² = 6 × 4 = 24."],
["M","Simplify 12 + 6 ÷ 2 × (3 − 1):","18|10|14|24",0,"BODMAS: bracket 2; 6÷2×2 = 6; 12 + 6 = 18."],
["M","√72 in simplest surd form is:","6√2|8√3|36√2|12√6",0,"√(36×2) = 6√2."],

["E","Neither of the boys ___ present.","is|are|were|have been",0,"'Neither' takes a singular verb."],
["E","He is good ___ mathematics.","in|at|on|with",1,"The fixed preposition is 'good at'."],
["E","She is coming, ___?","isn't she|doesn't she|won't she|is she",0,"Positive statement takes a negative tag repeating the auxiliary 'is'."],
["E","Let's go, ___?","will we|shall we|don't we|won't we",1,"After 'Let's', the tag is 'shall we?'."],
["E","I am late, ___?","am I not|aren't I|isn't I|don't I",1,"'I am' takes the irregular tag 'aren't I?'."],
["E","Never ___ such a beautiful sunset.","I have seen|have I seen|I seen|did I saw",1,"Negative opener triggers inversion: auxiliary before the subject."],
["E","No sooner had he left ___ it started raining.","when|than|then|that",1,"'No sooner… than' is the correct pair; 'hardly… when'."],
["E","Hardly had we sat down ___ the phone rang.","than|when|then|while",1,"'Hardly… when' (not 'than')."],
["E","Choose the correct adjective order:","a wooden old small table|an old small wooden table|a small old wooden table|a small wooden old table",2,"Order: size → age → material, giving 'a small old wooden table'."],
["E","If I ___ you, I would apologise.","was|were|am|be",1,"Second conditional (unreal present) uses 'were' for all subjects."],
["E","If she had studied, she ___ passed.","would|will have|would have|had",2,"Third conditional: had + past participle → would have + past participle."],
["E","Passive of 'They are building a bridge':","A bridge is built|A bridge is being built|A bridge was built|A bridge has been built",1,"Present continuous passive: is/are + being + past participle."],
["E","Indirect speech: He said, \"I am tired.\"","He said that he is tired|He said that he was tired|He said that I was tired|He said he has been tired",1,"Present tense backshifts to past: 'was tired'."],
["E","She is the ___ of the two sisters.","tall|taller|tallest|more tall",1,"Comparative is used for two persons."],
["E","Synonym of 'abundant':","scarce|plentiful|tiny|costly",1,"Abundant means existing in large quantities; plentiful."],
["E","Antonym of 'benevolent':","kind|malevolent|generous|gentle",1,"Benevolent = well-meaning; malevolent = wishing harm."],
["E","One word for 'a person who loves books':","Bibliophile|Philanthropist|Misogynist|Bibliographer",0,"Biblio (book) + phile (lover)."],
["E","'Once in a blue moon' means:","every night|very rarely|quite often|at midnight",1,"An idiom for something that happens very rarely."],
["E","'To break the ice' means:","to destroy something|to start a conversation in an awkward situation|to feel cold|to fail|",1,"It means easing initial social tension."],
["E","The new law will ___ everyone.","effect|affect|effects|affects to",1,"'Affect' is the verb (to influence); 'effect' is normally the noun."],
["E","Honesty is a guiding ___.","principal|principle|principel|principals",1,"'Principle' = rule; 'principal' = head or main."],
["E","'Slow and steady wins the race' means:","speed always wins|consistent effort beats reckless haste|racing is unfair|never hurry up",1,"Careful, consistent effort beats reckless speed."],
["E","Choose the correct spelling:","Acommodation|Accomodation|Accommodation|Acomodation",2,"Double c and double m: accommodation."],
["E","'Give up' as a phrasal verb means:","to donate|to quit or surrender|to raise|to wake",1,"Give up = stop trying or surrender."],
["E","'Peter Piper picked a peck of pickled peppers' is an example of:","Simile|Alliteration|Metaphor|Irony",1,"Repetition of the same initial consonant sound."],
["E","'I've told you a million times' is:","Hyperbole|Simile|Oxymoron|Personification",0,"Deliberate exaggeration for effect."],
["E","'Bona fide' means:","in good faith / genuine|at first sight|for the good|as a favour",0,"Latin for 'in good faith'; means genuine."],
["E","She enjoys ___ in the river.","to swim|swimming|swim|swam",1,"'Enjoy' is followed by a gerund (-ing form)."],
["E","Close the door, ___?","won't you|will you|do you|are you",1,"Imperatives usually take the tag 'will you?'."],
["E","Which sentence has no redundancy?","He returned back home.|He returned home.|Repeat it again.|Return back quickly.",1,"'Return' already means 'come back', so 'back' is redundant."],

["G","The largest planet in the solar system is:","Saturn|Jupiter|Neptune|Earth",1,"Jupiter is the largest planet."],
["G","The planet closest to the Sun is:","Venus|Mercury|Mars|Earth",1,"Mercury is both closest and smallest."],
["G","Number of bones in an adult human body:","206|212|300|180",0,"An adult has 206 bones."],
["G","Penicillin was discovered by:","Marie Curie|Alexander Fleming|Louis Pasteur|Edison",1,"Alexander Fleming discovered penicillin."],
["G","The telephone was invented by:","Edison|Bell|Marconi|Tesla",1,"Alexander Graham Bell."],
["G","The ozone layer protects Earth from:","Infrared heat|Ultraviolet radiation|Sound waves|Meteors",1,"It absorbs harmful UV radiation."],
["G","The main greenhouse gas from fossil fuels is:","Oxygen|Carbon dioxide|Nitrogen|Helium",1,"Carbon dioxide (CO₂)."],
["G","The nearest star to Earth after the Sun is:","Sirius|Proxima Centauri|Polaris|Betelgeuse",1,"Proxima Centauri."],
["G","The highest mountain in Pakistan is:","Nanga Parbat|K2|Rakaposhi|Tirich Mir",1,"K2 (8,611 m) is the highest in Pakistan and second highest in the world."],
["G","The longest river of Pakistan is:","Jhelum|Indus|Ravi|Sutlej",1,"The Indus."],
["G","Vitamin C deficiency causes:","Rickets|Scurvy|Night blindness|Beriberi",1,"Scurvy."],
["G","The powerhouse of the cell is:","Nucleus|Mitochondria|Ribosome|Golgi body",1,"Mitochondria produce ATP."],
["G","The universal blood donor group is:","AB+|O negative|A negative|B+",1,"O negative can be given to any group in emergencies."],
["G","Chemical symbol of sodium is:","So|Na|Sd|S",1,"Na, from Latin 'natrium'."],
["G","The hardest natural substance is:","Iron|Diamond|Quartz|Granite",1,"Diamond."],
["G","The SI unit of force is:","Joule|Newton|Watt|Pascal",1,"Newton (N)."],
["G","The 'Red Planet' is:","Venus|Mars|Jupiter|Mercury",1,"Mars, due to iron oxide on its surface."],
["G","An instrument that measures earthquakes is:","Barometer|Seismograph|Hygrometer|Anemometer",1,"Seismograph."],
["G","Insulin is produced by the:","Liver|Pancreas|Kidney|Stomach",1,"Pancreas."],
["G","The largest ocean is:","Atlantic|Pacific|Indian|Arctic",1,"Pacific Ocean."],
["G","Boiling point of water at sea level:","90°C|100°C|110°C|120°C",1,"100°C (212°F)."],
["G","The largest organ of the human body is:","Liver|Skin|Lungs|Brain",1,"The skin."],
["G","The most abundant gas in Earth's atmosphere is:","Oxygen|Nitrogen|Carbon dioxide|Argon",1,"Nitrogen, about 78%."],
["G","Single-celled organisms without a nucleus belong to Kingdom:","Protista|Monera|Fungi|Plantae",1,"Monera (bacteria)."],
["G","Which is the smallest planet?","Mars|Mercury|Venus|Neptune",1,"Mercury."],

["P","The Pakistan Resolution was passed in:","1930|1940|1947|1935",1,"Lahore Resolution, 23 March 1940."],
["P","Pakistan's first Prime Minister was:","Liaquat Ali Khan|Khawaja Nazimuddin|Ghulam Muhammad|Iskander Mirza",0,"Liaquat Ali Khan (1947–1951)."],
["P","The present Constitution of Pakistan was adopted in:","1956|1962|1973|1985",2,"The 1973 Constitution."],
["P","Allama Iqbal gave his Allahabad Address in:","1927|1930|1937|1940",1,"1930, presenting the idea of a separate Muslim state."],
["P","Number of Surahs in the Holy Quran:","110|114|120|124",1,"114 Surahs."],
["P","Number of Paras (Juz) in the Quran:","20|25|30|40",2,"30 Paras."],
["P","The Indus Waters Treaty was signed in:","1947|1960|1965|1972",1,"1960, mediated by the World Bank."],
["P","Pakistan became independent on:","14 August 1947|15 August 1947|23 March 1940|11 September 1948",0,"14 August 1947."],
["P","The Hijra (migration to Madinah) took place in:","610 CE|622 CE|632 CE|570 CE",1,"622 CE, marking the start of the Islamic calendar."],
["P","The national language of Pakistan is:","Punjabi|Urdu|Sindhi|Pashto",1,"Urdu is the national language; English is also official."]
];
const $=id=>document.getElementById(id);
let mode="ALL",list=[],i=0,sc=0,log=[];
const modes=[["ALL","Full mixed (100)"],["M","Maths"],["E","English"],["G","GK"],["P","Pak & Islamic"]];
$("chips").innerHTML=modes.map(m=>`<button class="chip${m[0]=="ALL"?" on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;mode=b.dataset.m;[...$("chips").children].forEach(c=>c.classList.toggle("on",c===b))};
function show(id){["home","play","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function start(){
  list=Q.filter(q=>mode=="ALL"||q[0]==mode);
  if($("shuf").checked)list=list.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  i=0;sc=0;log=[];show("play");render();
}
function render(){
  const q=list[i],o=q[2].split("|").filter(Boolean);
  $("cnt").textContent=`Question ${i+1} / ${list.length}`;$("scr").textContent=`Score: ${sc}`;
  $("pb").style.width=(i/list.length*100)+"%";
  $("tg").textContent=N[q[0]];$("qt").textContent=q[1];
  $("ex").classList.add("hide");$("nx").classList.add("hide");
  $("opts").innerHTML="";
  o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.textContent=String.fromCharCode(65+k)+") "+t;b.onclick=()=>pick(k,b);$("opts").appendChild(b)});
}
function pick(k,btn){
  const q=list[i],bs=[...$("opts").children];
  bs.forEach(b=>b.disabled=true);
  const good=k===q[3];
  if(good){sc++;btn.classList.add("ok")}else{btn.classList.add("no");bs[q[3]].classList.add("ok")}
  log.push([q,k,good]);
  $("scr").textContent=`Score: ${sc}`;
  $("ex").innerHTML=`<b>${good?"Correct.":"Incorrect."}</b> ${q[4]}`;$("ex").classList.remove("hide");
  $("nx").textContent=i+1<list.length?"Next":"See result";$("nx").classList.remove("hide");
}
$("nx").onclick=()=>{i++;if(i<list.length)render();else finish()};
function finish(){
  show("end");const p=Math.round(sc/list.length*100);
  $("fs").textContent=`${sc} / ${list.length} (${p}%)`;
  $("fm").textContent=p>=80?"Excellent — exam ready.":p>=60?"Good — revise the missed topics.":"Keep practising — review the explanations.";
  $("rev").classList.add("hide");
  $("rev").innerHTML=log.map((l,n)=>{const o=l[0][2].split("|");return `<div class="rv"><b class="${l[2]?"ok":"no"}">${n+1}. ${l[2]?"✓":"✗"}</b> ${l[0][1]}<br><span class="sub">Answer: ${o[l[0][3]]} — ${l[0][4]}</span></div>`}).join("");
}
$("revb").onclick=()=>$("rev").classList.toggle("hide");
$("start").onclick=start;$("again").onclick=()=>show("home");
</script></body></html>
