<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS/FPSC MPT Quiz — Set 4 (Mixed)</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#5d6675;--bd:#dfe3ea;--ac:#2557d6;--ok:#15803d;--okb:#e3f6ea;--no:#b91c1c;--nob:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eceff4;--mu:#9aa5b5;--bd:#2c3440;--ac:#6b93ff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1717}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eceff4;--mu:#9aa5b5;--bd:#2c3440;--ac:#6b93ff;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#3a1717}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:680px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.3rem;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 16px;font-size:.92rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;cursor:pointer;font-size:.9rem}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-size:1rem;cursor:pointer}
.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.top{display:flex;justify-content:space-between;color:var(--mu);font-size:.85rem;margin-bottom:8px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:6px;background:var(--bd);color:var(--mu);margin-bottom:8px}
.q{font-size:1.08rem;font-weight:600;margin:0 0 14px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin:0 0 9px;font-size:1rem;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--ac)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.ex{margin-top:12px;padding:12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--ac);font-size:.94rem}
.sc{font-size:2.4rem;font-weight:700;margin:6px 0}
.hide{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:.92rem}.rv b.ok{color:var(--ok)}.rv b.no{color:var(--no)}
</style></head>
<body><div class="w">
<h1>CSS/FPSC MPT Quiz — Set 4</h1>
<p class="sub">100 mixed MCQs, weighted toward Maths, English and GK. Explanation after every answer.</p>

<div id="home" class="card">
<b>Choose a mode</b>
<div class="chips" id="chips"></div>
<label class="sub"><input type="checkbox" id="shuf" checked> Shuffle question order</label>
<div class="row"><button class="btn" id="start">Start quiz</button></div>
</div>

<div id="play" class="hide">
<div class="top"><span id="cnt"></span><span id="scr"></span></div>
<div class="bar"><i id="pb"></i></div>
<div class="card"><span class="tag" id="tg"></span><p class="q" id="qt"></p><div id="opts"></div>
<div id="ex" class="ex hide"></div>
<div class="row"><button class="btn hide" id="nx">Next</button></div></div>
</div>

<div id="end" class="card hide">
<b>Quiz complete</b><div class="sc" id="fs"></div><div id="fm" class="sub"></div>
<div class="row"><button class="btn" id="again">Try again</button><button class="btn g" id="revb">Review answers</button></div>
<div id="rev" class="hide"></div>
</div>
</div>

<script>
const N={M:"Maths",E:"English",G:"General Knowledge",P:"Pakistan & Islamic"};
// [cat, question, "opt|opt|opt|opt", correctIndex, explanation]
const Q=[
["M","The angle between the clock hands at 4:00 is:","90°|120°|150°|180°",1,"|30×H − 5.5×M| = |120 − 0| = 120°."],
["M","At 3:00 the angle between the hour and minute hands is:","60°|90°|120°|180°",1,"|30×3 − 0| = 90°."],
["M","The minute hand of a clock moves how many degrees per minute?","3°|6°|12°|0.5°",1,"360° ÷ 60 minutes = 6° per minute (the hour hand moves 0.5°)."],
["M","Which of these is NOT a leap year?","2000|1900|2024|1600",1,"Century years must be divisible by 400; 1900 is not."],
["M","A normal (non-leap) year has how many odd days?","0|1|2|3",1,"365 = 52 weeks + 1 day, so 1 odd day (a leap year has 2)."],
["M","Mean of 4, 8, 12, 16, 20 is:","10|12|14|16",1,"Sum 60 ÷ 5 = 12."],
["M","Median of 3, 9, 5, 7, 1 is:","3|5|7|9",1,"Sorted: 1, 3, 5, 7, 9; the middle value is 5."],
["M","Mode of 2, 3, 3, 5, 7, 3, 8 is:","2|3|5|7",1,"3 occurs most often (three times)."],
["M","Range of the data 12, 45, 7, 30 is:","33|38|45|52",1,"Highest − lowest = 45 − 7 = 38."],
["M","Rice at Rs. 40/kg and Rs. 60/kg is mixed to sell at Rs. 50/kg mean price. The ratio is:","2:1|1:1|3:2|1:2",1,"Alligation: (60−50):(50−40) = 10:10 = 1:1."],
["M","A takes 10 days for a job; B is twice as efficient as A. B alone takes:","20 days|5 days|8 days|15 days",1,"Twice as efficient means half the time: 5 days."],
["M","A and B do work in the ratio 3:2 and share Rs. 1,000 wages. A gets:","Rs. 400|Rs. 600|Rs. 500|Rs. 700",1,"Wages follow the work ratio: 3/5 × 1000 = Rs. 600."],
["M","Volume of a cone with r = 3 and h = 7 (π = 22/7) is:","33|66|132|198",1,"(1/3)πr²h = (1/3) × 22/7 × 9 × 7 = 66."],
["M","Total surface area of a cuboid 4 × 3 × 2 is:","24|52|48|26",1,"2(lw + wh + hl) = 2(12 + 6 + 8) = 52."],
["M","Total surface area of a cube of side 5 is:","100|125|150|175",2,"6 × side² = 6 × 25 = 150."],
["M","If sin θ = 3/5 (θ acute), then cos θ is:","3/4|4/5|5/4|2/5",1,"sin²θ + cos²θ = 1, so cos²θ = 16/25 and cos θ = 4/5."],
["M","The value of tan 45° is:","0|1|√3|1/√3",1,"tan 45° = 1."],
["M","The value of cos 60° is:","√3/2|1/2|1|0",1,"cos 60° = 1/2."],
["M","Sum of the first 10 terms of the AP 3, 7, 11, … is:","190|210|230|250",1,"n/2 × (first + last) = 5 × (3 + 39) = 210."],
["M","Sum of the first 5 terms of the GP 2, 4, 8, … is:","30|62|64|32",1,"a(rⁿ − 1)/(r − 1) = 2 × 31 = 62."],
["M","The value of 6P2 is:","12|30|15|36",1,"n!/(n−r)! = 6 × 5 = 30."],
["M","The value of (3²)³ is:","81|729|243|27",1,"(aᵐ)ⁿ = aᵐⁿ, so 3⁶ = 729."],
["M","For x² − 4x + 4 = 0, the discriminant b² − 4ac is:","0|4|8|16",0,"16 − 16 = 0, so the roots are equal (x = 2)."],
["M","The value of (a + b)³ when a = 2 and b = 1 is:","9|27|18|24",1,"(2+1)³ = 27."],
["M","Which number is divisible by 9?","738|739|741|745",0,"Digit sum 7 + 3 + 8 = 18, divisible by 9."],
["M","Which of these is a prime number?","51|57|61|91",2,"51 = 3×17, 57 = 3×19, 91 = 7×13; 61 has no factor other than 1 and itself."],
["M","A man points to a photo: \"She is the daughter of my father's only son.\" The girl is his:","sister|daughter|niece|mother",1,"The man has no brother, so he is the only son; the girl is his own daughter."],
["M","If CAT is coded DBU (each letter +1), then DOG is coded:","EPH|EOH|CNF|EPG",0,"D→E, O→P, G→H."],
["M","A man facing North turns right twice (90° each time). He now faces:","East|South|West|North",1,"North → East → South."],
["M","On a standard die, the face opposite to 3 is:","2|4|5|6",1,"Opposite faces sum to 7, so 3 is opposite 4."],
["M","Next letter in the series A, C, F, J, O, ? is:","T|U|V|S",1,"Gaps +2, +3, +4, +5, +6: O + 6 = U."],
["M","All roses are flowers. Some flowers fade quickly. Conclusion: \"Some roses fade quickly.\"","Definitely follows|Does not follow|Definitely false|Follows if flowers are red",1,"The premises do not force this conclusion; it is the classic syllogism trap."],

["E","I don't have ___ money left.","some|any|a lot|many",1,"'Any' is used in negative sentences with uncountable nouns."],
["E","How ___ students are there in the class?","much|many|more|little",1,"Students are countable, so 'many' is used."],
["E","___ of the two students has a book.","Every|Each|All|Many",1,"'Each' refers to individuals in a small group and takes a singular verb."],
["E","Which phrase is redundant?","past history|ancient history|modern history|world history",0,"History is already in the past, so 'past history' repeats the meaning (tautology)."],
["E","The British spelling of 'color' is:","colur|colour|collor|coloure",1,"British English keeps the 'ou': colour."],
["E","The British word for the American 'apartment' is:","flat|hotel|villa|hostel",0,"A flat."],
["E","Indirect speech: He said, \"I might come tomorrow.\"","He said he might come tomorrow|He said that he might come the next day|He said that he may come the next day|He said he will come tomorrow",1,"'Might' stays unchanged and 'tomorrow' becomes 'the next day'."],
["E","Indirect speech: She said, \"I can swim.\"","She said she can swim|She said that she could swim|She said she could have swum|She said she will swim",1,"'Can' changes to 'could' when backshifting."],
["E","'A stitch in time saves nine' means:","sewing is useful|acting promptly prevents bigger problems|nine is lucky|time is money",1,"Fixing a problem early avoids much more work later."],
["E","'Look before you leap' means:","jump carefully|think before acting|never jump|see first, then run",1,"Consider the consequences before you act."],
["E","'Actions speak louder than words' means:","noise matters|what you do matters more than what you say|talk is powerful|be quiet",1,"Deeds are a truer measure than promises."],
["E","Choose the correct spelling:","Neccessary|Necessary|Necesary|Necessery",1,"One c and two s: necessary."],
["E","Choose the correct spelling:","Occurence|Occurrence|Ocurrence|Occurance",1,"Double c and double r: occurrence."],
["E","Choose the correct spelling:","Seperate|Separate|Separete|Seprate",1,"Separate has 'par' in the middle."],
["E","'Look after' means:","to search|to take care of|to stare|to admire",1,"Look after = take care of."],
["E","'Put off' means:","to wear|to postpone|to extinguish|to cancel forever",1,"Put off = postpone."],
["E","'Call off' means:","to phone|to cancel|to postpone|to invite",1,"Call off = cancel."],
["E","'Status quo' means:","a high position|the existing state of affairs|a legal order|a new plan",1,"Latin for the current situation."],
["E","'Ad hoc' means:","for this particular purpose|forever|by heart|before the event",0,"Formed or done for a specific purpose only."],
["E","'Carpe diem' means:","seize the day|beware of dog|time flies|peace be upon you",0,"A Latin phrase urging you to make the most of the present."],
["E","'Deafening silence' is an example of:","Simile|Oxymoron|Hyperbole|Alliteration",1,"Two contradictory words joined together."],
["E","'Time is money' is a:","Simile|Metaphor|Irony|Pun",1,"A direct comparison without 'like' or 'as'."],
["E","'What a beautiful day!' is what type of sentence?","Declarative|Interrogative|Exclamatory|Imperative",2,"It expresses strong feeling and ends with '!'."],
["E","In 'The man who lives next door is a doctor', the clause 'who lives next door' is:","noun clause|adjective (relative) clause|adverb clause|main clause",1,"It describes the noun 'man'."],
["E","You ___ smoke here; it is prohibited.","must not|need not|may|can not to",0,"'Must not' expresses prohibition; 'need not' means it is unnecessary."],
["E","The dog wagged ___ tail.","it's|its|its'|it is",1,"'Its' is the possessive; 'it's' = it is."],
["E","___ going to the market.","Their|There|They're|Thier",2,"'They're' = they are."],
["E","The prefix 'anti-' means:","before|against|under|again",1,"Anti = against (antibiotic, anti-war)."],
["E","The root 'bio' means:","death|life|earth|water",1,"Bio = life (biology, biography)."],
["E","He said that the sun ___ in the east.","rose|rises|has risen|will rise",1,"Universal truths stay in the present tense in reported speech."],

["G","Malaria is caused by:","a virus|the Plasmodium parasite|a fungus|bacteria",1,"Plasmodium, spread by the Anopheles mosquito."],
["G","The SI unit of frequency is:","Pascal|Hertz|Watt|Volt",1,"Hertz (Hz); Pascal is the unit of pressure."],
["G","The human heart has how many chambers?","2|3|4|5",2,"Two atria and two ventricles."],
["G","The 'fourth state of matter' is:","Vapour|Plasma|Gel|Foam",1,"Plasma, after solid, liquid and gas."],
["G","A light-year is a unit of:","time|distance|speed|brightness",1,"It is the distance light travels in one year."],
["G","The gas commonly used in balloons because it is light and non-flammable:","Hydrogen|Helium|Methane|Oxygen",1,"Helium."],
["G","The chemical symbol of silver is:","Si|Ag|Sv|Au",1,"Ag, from Latin 'argentum'."],
["G","The chemical symbol of lead is:","Pb|Ld|Le|Pl",0,"Pb, from Latin 'plumbum'."],
["G","The atomic number of oxygen is:","6|7|8|16",2,"Oxygen = 8 (carbon 6, nitrogen 7)."],
["G","The Periodic Table was devised by:","Dalton|Mendeleev|Bohr|Rutherford",1,"Dmitri Mendeleev, 1869."],
["G","A barometer measures:","humidity|atmospheric pressure|wind speed|temperature",1,"Atmospheric pressure."],
["G","A sphygmomanometer measures:","heart sounds|blood pressure|pulse only|body sugar",1,"Blood pressure."],
["G","A lactometer is used to check the purity of:","water|milk|oil|honey",1,"Milk."],
["G","An anemometer measures:","rainfall|wind speed|humidity|sunlight",1,"Wind speed."],
["G","Ornithology is the study of:","insects|birds|fish|fossils",1,"Birds."],
["G","Entomology is the study of:","insects|plants|rocks|fungi",0,"Insects."],
["G","Genetics is the study of:","diseases|heredity and genes|weather|earthquakes",1,"Heredity and genes."],
["G","Iodine deficiency causes:","anaemia|goitre|scurvy|rickets",1,"Goitre (thyroid enlargement); iron deficiency causes anaemia."],
["G","Calcium is important mainly for:","bones and teeth|eyesight|blood clotting only|digestion",0,"Bone and teeth health; found in dairy."],
["G","Newton's First Law is also called the law of:","inertia|gravity|momentum|action",0,"An object stays at rest or in uniform motion unless acted on by a force."],
["G","Newton's Second Law is expressed as:","F = mv|F = ma|F = m/a|F = a/m",1,"Force = mass × acceleration."],
["G","A see-saw is an example of a:","pulley|lever|wedge|screw",1,"A lever."],
["G","A ramp is an example of an:","inclined plane|wedge|axle|lever",0,"Inclined plane."],
["G","Mushrooms and yeasts belong to Kingdom:","Plantae|Fungi|Monera|Animalia",1,"Fungi."],
["G","In biological classification, the rank after Order is:","Genus|Family|Class|Species",1,"Kingdom → Phylum → Class → Order → Family → Genus → Species."],
["G","Photosynthesis produces:","glucose and oxygen|carbon dioxide and water|nitrogen and oxygen|starch only",0,"CO₂ + water + sunlight → glucose + oxygen."],
["G","The WHO headquarters is in:","New York|Geneva|Paris|London",1,"Geneva, Switzerland."],
["G","Sound cannot travel through:","water|a vacuum|steel|air",1,"It needs a medium; light can travel through a vacuum."],
["G","The system that coordinates the body's activities is the:","digestive system|nervous system|skeletal system|excretory system",1,"The nervous system (brain, spinal cord, nerves)."],

["P","The All-India Muslim League was founded in:","1885|1906|1913|1930",1,"1906 in Dhaka."],
["P","Sir Syed Ahmad Khan founded the Aligarh college in:","1857|1875|1885|1906",1,"1875 (Muhammadan Anglo-Oriental College)."],
["P","The Indian National Congress was founded in:","1857|1885|1906|1916",1,"1885."],
["P","Quaid-e-Azam joined the Muslim League in:","1906|1913|1916|1940",1,"1913."],
["P","The Lucknow Pact between Congress and Muslim League was in:","1906|1913|1916|1930",2,"1916."],
["P","The Cabinet Mission Plan came in:","1930|1940|1946|1947",2,"1946, the same year as Direct Action Day (16 August)."],
["P","The first revelation to the Prophet (PBUH) came in the cave of:","Thawr|Hira|Uhud|Safa",1,"Cave Hira."],
["P","The longest Surah of the Quran is:","Al-Fatiha|Al-Baqarah|Al-Imran|Yasin",1,"Al-Baqarah."],
["P","The number of pillars of Islam is:","4|5|6|7",1,"Five: Shahada, Salah, Zakat, Sawm and Hajj."],
["P","The Battle of Badr took place in:","1 AH|2 AH|3 AH|5 AH",1,"2 AH (624 CE)."]
];
const $=id=>document.getElementById(id);
let mode="ALL",list=[],i=0,sc=0,log=[];
const modes=[["ALL","Full mixed (100)"],["M","Maths"],["E","English"],["G","GK"],["P","Pak & Islamic"]];
$("chips").innerHTML=modes.map(m=>`<button class="chip${m[0]=="ALL"?" on":""}" data-m="${m[0]}">${m[1]}</button>`).join("");
$("chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;mode=b.dataset.m;[...$("chips").children].forEach(c=>c.classList.toggle("on",c===b))};
function show(id){["home","play","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function start(){
  list=Q.filter(q=>mode=="ALL"||q[0]==mode);
  if($("shuf").checked)list=list.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  i=0;sc=0;log=[];show("play");render();
}
function render(){
  const q=list[i],o=q[2].split("|").filter(Boolean);
  $("cnt").textContent=`Question ${i+1} / ${list.length}`;$("scr").textContent=`Score: ${sc}`;
  $("pb").style.width=(i/list.length*100)+"%";
  $("tg").textContent=N[q[0]];$("qt").textContent=q[1];
  $("ex").classList.add("hide");$("nx").classList.add("hide");
  $("opts").innerHTML="";
  o.forEach((t,k)=>{const b=document.createElement("button");b.className="o";b.textContent=String.fromCharCode(65+k)+") "+t;b.onclick=()=>pick(k,b);$("opts").appendChild(b)});
}
function pick(k,btn){
  const q=list[i],bs=[...$("opts").children];
  bs.forEach(b=>b.disabled=true);
  const good=k===q[3];
  if(good){sc++;btn.classList.add("ok")}else{btn.classList.add("no");bs[q[3]].classList.add("ok")}
  log.push([q,k,good]);
  $("scr").textContent=`Score: ${sc}`;
  $("ex").innerHTML=`<b>${good?"Correct.":"Incorrect."}</b> ${q[4]}`;$("ex").classList.remove("hide");
  $("nx").textContent=i+1<list.length?"Next":"See result";$("nx").classList.remove("hide");
}
$("nx").onclick=()=>{i++;if(i<list.length)render();else finish()};
function finish(){
  show("end");const p=Math.round(sc/list.length*100);
  $("fs").textContent=`${sc} / ${list.length} (${p}%)`;
  $("fm").textContent=p>=80?"Excellent — exam ready.":p>=60?"Good — revise the missed topics.":"Keep practising — review the explanations.";
  $("rev").classList.add("hide");
  $("rev").innerHTML=log.map((l,n)=>{const o=l[0][2].split("|");return `<div class="rv"><b class="${l[2]?"ok":"no"}">${n+1}. ${l[2]?"✓":"✗"}</b> ${l[0][1]}<br><span class="sub">Answer: ${o[l[0][3]]} — ${l[0][4]}</span></div>`}).join("");
}
$("revb").onclick=()=>$("rev").classList.toggle("hide");
$("start").onclick=start;$("again").onclick=()=>show("home");
</script></body></html>
