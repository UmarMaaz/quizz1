<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS Quiz: Pakistan Affairs, Current Affairs, Islamiat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#12302b;--mute:#5d726d;--line:#cfdcd8;--brand:#0e6b55;--brand-ink:#fff;--ok:#12794f;--okbg:#dff3e9;--bad:#b3261e;--badbg:#fbe4e1;--sun:#c98a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a17;--card:#14262l;--card:#142621;--ink:#e4f0ec;--mute:#93aaa4;--line:#27403a;--brand:#3fbf98;--brand-ink:#062019;--ok:#5fd6a0;--okbg:#12362a;--bad:#ff8a80;--badbg:#3b1d1a;--sun:#e8b43a}}
:root[data-theme="dark"]{--bg:#0d1a17;--card:#142621;--ink:#e4f0ec;--mute:#93aaa4;--line:#27403a;--brand:#3fbf98;--brand-ink:#062019;--ok:#5fd6a0;--okbg:#12362a;--bad:#ff8a80;--badbg:#3b1d1a;--sun:#e8b43a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;margin:0;line-height:1.2}
h1{font-size:2rem}
h2{font-size:1.35rem}
p{margin:.4rem 0}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;min-height:46px}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.primary:disabled{opacity:.45;cursor:not-allowed}
.chips button{flex:1 1 150px;text-align:left;padding:12px 14px}
.chips button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand);font-weight:600}
.chips small{display:block;color:var(--mute);font-weight:400}
label.opt{display:flex;align-items:center;gap:10px;padding:8px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.tag{display:inline-block;font-size:.85rem;font-weight:600;padding:2px 10px;border-radius:20px;background:var(--okbg);color:var(--ok)}
.q{font-family:"Source Serif 4",Georgia,serif;font-size:1.3rem;line-height:1.35;margin:12px 0 16px;font-weight:600}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px}
.choice b{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.choice.correct{background:var(--okbg);border-color:var(--ok)}
.choice.correct b{background:var(--ok);color:var(--card);border-color:var(--ok)}
.choice.wrong{background:var(--badbg);border-color:var(--bad)}
.choice.wrong b{background:var(--bad);color:var(--card);border-color:var(--bad)}
.choice.picked{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.expl{margin-top:14px;padding:12px 14px;border-left:4px solid var(--brand);background:var(--bg);border-radius:6px}
.big{font-family:"Source Serif 4",Georgia,serif;font-size:3.2rem;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stats div{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:1.3rem}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <h1>CSS Quiz</h1>
  <p class="mute">100 MCQs on Pakistan Affairs, International and Current Affairs, and Islamic Studies.</p>
  <div class="card">
    <h2>Choose a section</h2>
    <div class="row chips" id="secChips" style="margin-top:12px"></div>
  </div>
  <div class="card">
    <h2>Settings</h2>
    <div style="margin-top:10px">
      <label for="count">Number of questions</label><br>
      <select id="count"></select>
    </div>
    <div style="margin-top:10px">
      <label for="mode">Mode</label><br>
      <select id="mode">
        <option value="practice">Practice: show the answer after each question</option>
        <option value="exam">Exam: show all answers at the end</option>
      </select>
    </div>
    <label class="opt"><input type="checkbox" id="shuffleQ" checked> Shuffle questions</label>
    <label class="opt"><input type="checkbox" id="shuffleO" checked> Shuffle answer options</label>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="start">Start quiz</button>
      <button id="theme">Switch theme</button>
    </div>
  </div>
</section>

<section id="quiz" class="hide">
  <div class="top">
    <strong id="qCount">Question 1 of 10</strong>
    <span id="liveScore" class="tag">Score 0</span>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="card">
    <span class="mute" id="qSection"></span>
    <p class="q" id="qText"></p>
    <div class="choices" id="choices"></div>
    <div class="expl hide" id="expl"></div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="next" disabled>Next question</button>
      <button id="quit">End quiz</button>
    </div>
    <p class="mute" style="font-size:.85rem;margin-top:12px">Keyboard: press 1 to 4 to answer, Enter for next.</p>
  </div>
</section>

<section id="result" class="hide">
  <div class="card">
    <h2>Your result</h2>
    <p class="big" id="rPct">0%</p>
    <p id="rMsg" class="mute"></p>
    <div class="stats">
      <div><b id="rOk">0</b>Correct</div>
      <div><b id="rBad">0</b>Wrong</div>
      <div><b id="rSkip">0</b>Skipped</div>
    </div>
    <h2 style="margin-top:18px">By section</h2>
    <div id="rSec"></div>
    <div class="row" style="margin-top:16px">
      <button class="primary" id="retryWrong">Retry wrong answers</button>
      <button id="again">New quiz</button>
    </div>
  </div>
  <div class="card">
    <h2>Review</h2>
    <div class="row" style="margin:10px 0">
      <button id="fAll" aria-pressed="true">All</button>
      <button id="fWrong" aria-pressed="false">Wrong only</button>
    </div>
    <div id="review"></div>
  </div>
</section>

</div>

  [["ALL","All sections"],["P",SECTIONS.P],["C",SECTIONS.C],["I",SECTIONS.I]].forEach(([k,label])=>{
    const b=document.createElement("button");
    b.setAttribute("aria-pressed",String(selSec===k));
    b.innerHTML=label+"<small>"+secCount(k)+" questions</small>";
    b.onclick=()=>{selSec=k;renderChips();renderCounts()};
    box.appendChild(b);
  });
}
function renderCounts(){
  const n=secCount(selSec), sel=$("count"), prev=sel.value;
  const opts=[10,20,30,50].filter(x=>x<n);opts.push(n);
  sel.innerHTML=opts.map(x=>`<option value="${x}">${x===n?"All "+n:x}</option>`).join("");
  if(prev&&opts.includes(+prev))sel.value=prev;
}
function show(id){["home","quiz","result"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}

/* ---------- Quiz ---------- */
function begin(pool){
  mode=$("mode").value;
  const so=$("shuffleO").checked;
  items=pool.map(b=>{
    let o=b.opts.map((t,i)=>({t,ok:i===b.ans}));
    if(so)o=shuffle(o);
    return {q:b.q,sec:b.sec,opts:o,why:b.why,pick:null,id:b.id};
  });
  idx=0;show("quiz");renderQ();
}
function startFromHome(){
  let pool=BANK.filter(b=>selSec==="ALL"||b.sec===selSec);
  if($("shuffleQ").checked)pool=shuffle(pool);
  pool=pool.slice(0,+$("count").value);
  begin(pool);
}
function renderQ(){
  const it=items[idx];answered=false;
  $("qCount").textContent=`Question ${idx+1} of ${items.length}`;
  $("barFill").style.width=(idx/items.length*100)+"%";
  $("qSection").textContent=SECTIONS[it.sec];
  $("qText").textContent=it.q;
  $("expl").classList.add("hide");
  $("next").disabled=true;
  $("next").textContent=idx===items.length-1?"Finish quiz":"Next question";
  updateScore();
  const box=$("choices");box.innerHTML="";
  it.opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="choice";
    b.innerHTML=`<b>${i+1}</b><span></span>`;
    b.lastChild.textContent=o.t;
    b.onclick=()=>choose(i);
    box.appendChild(b);
  });
}
function choose(i){
  if(answered)return;
  answered=true;
  const it=items[idx];it.pick=i;
  const btns=$("choices").children;
  if(mode==="practice"){
    it.opts.forEach((o,k)=>{
      if(o.ok)btns[k].classList.add("correct");
      else if(k===i)btns[k].classList.add("wrong");
    });
    $("expl").textContent=(it.opts[i].ok?"Correct. ":"Not quite. ")+it.why;
    $("expl").classList.remove("hide");
  }else{
    btns[i].classList.add("picked");
  }
  Array.from(btns).forEach(b=>b.disabled=true);
  $("next").disabled=false;
  updateScore();
  $("next").focus({preventScroll:true});
}
function updateScore(){
  const ok=items.filter(x=>x.pick!==null&&x.opts[x.pick].ok).length;
  $("liveScore").textContent=mode==="practice"?`Score ${ok}`:`Answered ${items.filter(x=>x.pick!==null).length}`;
}
function next(){
  if(idx<items.length-1){idx++;renderQ()}else finish();
}

/* ---------- Result ---------- */
function finish(){
  const ok=items.filter(x=>x.pick!==null&&x.opts[x.pick].ok).length;
  const skip=items.filter(x=>x.pick===null).length;
  const bad=items.length-ok-skip;
  const pct=Math.round(ok/items.length*100);
  $("rPct").textContent=pct+"%";
  $("rOk").textContent=ok;$("rBad").textContent=bad;$("rSkip").textContent=skip;
  $("rMsg").textContent=`You answered ${ok} of ${items.length} correctly. `+(pct>=80?"Excellent work.":pct>=60?"Good progress. Review the wrong answers below.":"Keep practising. Retry the wrong answers to lock them in.");
  const secs={};
  items.forEach(x=>{const s=secs[x.sec]=secs[x.sec]||{ok:0,n:0};s.n++;if(x.pick!==null&&x.opts[x.pick].ok)s.ok++});
  $("rSec").innerHTML=Object.keys(secs).map(k=>{
    const s=secs[k],p=Math.round(s.ok/s.n*100);
    return `<div style="margin-top:10px"><div class="top"><span>${SECTIONS[k]}</span><strong>${s.ok}/${s.n}</strong></div><div class="bar"><i style="width:${p}%"></i></div></div>`;
  }).join("");
  $("retryWrong").disabled=(bad+skip)===0;
  filter="all";setFilter("all");
  show("result");
}
let filter="all";
function setFilter(f){
  filter=f;
  $("fAll").setAttribute("aria-pressed",String(f==="all"));
  $("fWrong").setAttribute("aria-pressed",String(f==="wrong"));
  const box=$("review");box.innerHTML="";
  let shown=0;
  items.forEach((it,n)=>{
    const good=it.pick!==null&&it.opts[it.pick].ok;
    if(f==="wrong"&&good)return;
    shown++;
    const d=document.createElement("div");d.className="rev";
    const right=it.opts.find(o=>o.ok).t;
    const mine=it.pick===null?"No answer":it.opts[it.pick].t;
    const h=document.createElement("div");
    h.innerHTML=`<strong></strong><p></p><p></p><p class="mute"></p>`;
    h.children[0].textContent=`${n+1}. ${it.q}`;
    h.children[1].innerHTML=`<span class="tag" style="background:${good?"var(--okbg)":"var(--badbg)"};color:${good?"var(--ok)":"var(--bad)"}">${good?"Correct":"Wrong"}</span> Your answer: <b></b>`;
    h.children[1].querySelector("b").textContent=mine;
    h.children[2].innerHTML="Correct answer: <b></b>";
    h.children[2].querySelector("b").textContent=right;
    h.children[3].textContent=it.why;
    d.appendChild(h);box.appendChild(d);
  });
  if(!shown)box.innerHTML='<p class="mute">Nothing to review here. Every answer was correct.</p>';
}

/* ---------- Wiring ---------- */
$("start").onclick=startFromHome;
$("next").onclick=next;
$("quit").onclick=()=>{if(confirm("End the quiz and see your result?"))finish()};
$("again").onclick=()=>show("home");
$("retryWrong").onclick=()=>{
  const ids=items.filter(x=>!(x.pick!==null&&x.opts[x.pick].ok)).map(x=>x.id);
  begin(shuffle(ids.map(i=>BANK[i])));
};
$("fAll").onclick=()=>setFilter("all");
$("fWrong").onclick=()=>setFilter("wrong");
$("theme").onclick=()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hide"))return;
  if(e.key>="1"&&e.key<="4"){const i=+e.key-1;if(items[idx]&&i<items[idx].opts.length)choose(i)}
  else if(e.key==="Enter"&&answered&&document.activeElement.id!=="quit"){e.preventDefault();next()}
});
renderChips();renderCounts();
</script>
</body>
</html>
