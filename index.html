const SEC=[...new Set(Q.map(x=>x[0]))],app=document.getElementById('app');
let pool,i,ans,sc,sec;
function start(){app.innerHTML=`<div class="c"><p class="s">Pick a section or take all. ${Q.length} fresh questions, none repeated from earlier sets.</p><div class="chips"><div class="chip a" data-s="All">All (${Q.length})</div>${SEC.map(s=>`<div class="chip" data-s="${s}">${s} (${Q.filter(x=>x[0]==s).length})</div>`).join("")}</div><div class="r"><button class="b" id="go">Start Quiz</button></div></div>`;let ch="All";document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{document.querySelectorAll(".chip").forEach(x=>x.classList.remove("a"));c.classList.add("a");ch=c.dataset.s});document.getElementById("go").onclick=()=>{sec=ch;pool=ch=="All"?Q:Q.filter(x=>x[0]==ch);i=0;ans={};sc=0;show()}}
function show(){const q=pool[i],a=ans[i],n=pool.length;app.innerHTML=`<div class="s" style="display:flex;justify-content:space-between"><span>Question ${i+1} / ${n}</span><span>Score: ${sc}</span></div><div class="bar"><div style="width:${i/n*100}%"></div></div><div class="c"><div class="t">${q[0]}</div><div class="q">${q[1]}</div>${q[2].map((o,k)=>`<button class="opt${a!==undefined?(k==q[3]?" ok":k==a?" no":""):""}" data-k="${k}" ${a!==undefined?"disabled":""}>${"ABCD"[k]}. ${o}</button>`).join("")}${a!==undefined?`<div class="ex"><b>${a==q[3]?"Correct. ":"Not quite. "}</b>${q[4]}</div>`:""}<div class="r"><button class="b g" id="pv" ${i?"":"disabled"}>Previous</button><button class="b" id="nx" ${a===undefined?"disabled":""}>${i==n-1?"Finish":"Next"}</button></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;ans[i]=k;if(k==q[3])sc++;show()});
pv.onclick=()=>{i--;show()};nx.onclick=()=>{if(i<n-1){i++;show()}else done()}}
function done(){const n=pool.length;app.innerHTML=`<div class="c" style="text-align:center"><div class="t">${sec}</div><div class="big">${sc} / ${n}</div><div class="s">${Math.round(sc/n*100)}% correct</div><div class="r"><button class="b g" id="rt">Retry</button><button class="b" id="hm">Choose Section</button></div></div>`;rt.onclick=()=>{i=0;ans={};sc=0;show()};hm.onclick=start}
start();
</script></body></html>
