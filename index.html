<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS/FPSC MPT Quiz — Set 4</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

const QUESTIONS = [{"section": "Islamic Studies / Civics & Ethics", "q": "How many Kalimas are there in Islam?", "opts": ["Four", "Five", "Six", "Seven"], "ans": 2, "exp": "There are Six Kalimas: Tayyabah, Shahadat, Tamjeed, Tauheed, Astaghfar, and Radd-e-Kufr."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which Kalima is the formal rejection of disbelief and shirk?", "opts": ["Kalima Tayyabah", "Kalima Tamjeed", "Kalima Radd-e-Kufr", "Kalima Astaghfar"], "ans": 2, "exp": "Kalima Radd-e-Kufr (the sixth Kalima) is a formal declaration rejecting disbelief and association of partners with Allah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The event of Isra and Mi'raj (Night Journey) took place from Makkah to:", "opts": ["Madinah", "Jerusalem (and beyond)", "Damascus", "Taif"], "ans": 1, "exp": "The Night Journey took the Prophet (PBUH) from Makkah to Jerusalem, followed by his ascension through the heavens."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which category of Zakat recipients (Asnaf) refers to those in debt?", "opts": ["Al-Fuqara", "Al-Gharimin", "Ar-Riqab", "Ibn as-Sabil"], "ans": 1, "exp": "'Al-Gharimin' refers to those burdened with debt, one of the eight categories of Zakat recipients specified in the Quran."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Constitution of Madinah was drafted in approximately which year?", "opts": ["610 CE", "622 CE", "630 CE", "632 CE"], "ans": 1, "exp": "The Constitution of Madinah was drafted around 622 CE, shortly after the Prophet's migration (Hijrah) to Madinah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which caliph introduced the Bait-ul-Mal (treasury) system and extensive administrative reforms?", "opts": ["Hazrat Abu Bakr (RA)", "Hazrat Umar (RA)", "Hazrat Usman (RA)", "Hazrat Ali (RA)"], "ans": 1, "exp": "Hazrat Umar (RA) is credited with introducing major administrative reforms, including the Bait-ul-Mal treasury system."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Sawm' refers to which pillar of Islam?", "opts": ["Prayer", "Charity", "Fasting", "Pilgrimage"], "ans": 2, "exp": "'Sawm' specifically means fasting, the pillar observed during the month of Ramadan."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which of these is NOT one of the four sacred months in Islam?", "opts": ["Muharram", "Rajab", "Ramadan", "Dhul-Qa'dah"], "ans": 2, "exp": "The four sacred months are Muharram, Rajab, Dhul-Qa'dah, and Dhul-Hijjah; Ramadan is not among them, though it is the month of fasting."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Every human act in Islamic jurisprudence (Fiqh) is categorized under how many Ahkam (rulings)?", "opts": ["Three", "Four", "Five", "Six"], "ans": 2, "exp": "The Five Ahkam (Al-Ahkam al-Khamsa) are: Fard/Wajib, Sunnah/Mustahab, Mubah, Makruh, and Haram."}, {"section": "Islamic Studies / Civics & Ethics", "q": "An act that is 'Makruh' in Islamic law is best described as:", "opts": ["Obligatory", "Disliked, but not sinful", "Strictly forbidden", "Completely neutral"], "ans": 1, "exp": "'Makruh' describes an act that is disliked and better avoided, though not sinful if performed."}, {"section": "Islamic Studies / Civics & Ethics", "q": "How many names/attributes does Islamic tradition attribute to Allah (Asma-ul-Husna)?", "opts": ["77", "88", "99", "100"], "ans": 2, "exp": "Islamic tradition holds that Allah has 99 Beautiful Names (Asma-ul-Husna)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Ar-Razzaq', one of Allah's names, means:", "opts": ["The Most Merciful", "The Provider", "The All-Wise", "The Light"], "ans": 1, "exp": "'Ar-Razzaq' means 'The Provider', referring to Allah as the source of sustenance for all creation."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which angel is responsible for blowing the Trumpet (Sur) to signal the Day of Judgment?", "opts": ["Jibreel", "Mikael", "Israfil", "Izrael"], "ans": 2, "exp": "Israfil is the angel tasked with blowing the Trumpet to signal the onset of the Day of Judgment."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which angel is responsible for rain and sustenance in Islamic tradition?", "opts": ["Jibreel", "Mikael", "Israfil", "Izrael"], "ans": 1, "exp": "Mikael (Michael) is traditionally associated with rain, vegetation, and the distribution of sustenance."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The tragedy of Karbala occurred on which date?", "opts": ["10th Ramadan, 61 A.H.", "10th Muharram, 61 A.H.", "1st Shawwal, 61 A.H.", "12th Rabi-ul-Awwal, 61 A.H."], "ans": 1, "exp": "The Battle/Tragedy of Karbala took place on 10th Muharram, 61 A.H. (680 CE), commemorated annually as Ashura."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Imam Hussain (RA), martyred at Karbala, was the grandson of the Prophet (PBUH) and son of:", "opts": ["Hazrat Abu Bakr (RA)", "Hazrat Umar (RA)", "Hazrat Ali (RA)", "Hazrat Usman (RA)"], "ans": 2, "exp": "Imam Hussain (RA) was the son of Hazrat Ali (RA) and Hazrat Fatimah (RA), the Prophet's daughter."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which Islamic economic principle refers to the prohibition of interest/usury?", "opts": ["Zakat", "Riba (prohibited)", "Sadaqah", "Mudarabah"], "ans": 1, "exp": "'Riba' (interest/usury) is prohibited in Islamic economics; its avoidance is a core distinguishing feature of Islamic finance."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Mudarabah' in Islamic finance refers to:", "opts": ["A joint-venture partnership with shared capital", "A profit-sharing partnership where one party provides capital and the other expertise", "A form of gambling", "A fixed-interest loan"], "ans": 1, "exp": "'Mudarabah' is a profit-sharing partnership: one party supplies capital, the other provides labour/expertise, and profits are shared per agreement."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which school of Fiqh was founded by Imam Ahmad ibn Hanbal?", "opts": ["Hanafi", "Maliki", "Shafi'i", "Hanbali"], "ans": 3, "exp": "The Hanbali school of Islamic jurisprudence was founded by Imam Ahmad ibn Hanbal."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which of the six canonical Hadith collections (Kutub al-Sittah) is considered the most authentic?", "opts": ["Sahih Muslim", "Sahih al-Bukhari", "Sunan Abu Dawood", "Jami' at-Tirmidhi"], "ans": 1, "exp": "Sahih al-Bukhari, compiled by Imam Muhammad al-Bukhari, is widely regarded as the most authentic hadith collection."}, {"section": "English", "q": "Which sentence correctly uses a semicolon?", "opts": ["I have a test tomorrow; so I can't go out tonight.", "I have a test tomorrow; I can't go out tonight.", "I have a test tomorrow, I can't go out tonight;", "I have; a test tomorrow I can't go out tonight."], "ans": 1, "exp": "A semicolon correctly joins two closely related independent clauses without a conjunction: 'I have a test tomorrow; I can't go out tonight.'"}, {"section": "English", "q": "Choose the correct word: 'The effect of the policy was immediate, and it began to ___ change.'", "opts": ["effect", "affect", "affected", "effecting"], "ans": 1, "exp": "'Affect' (verb) means to influence; 'effect' (usually a noun) means a result. Here, a verb is needed: 'to affect change' is a common idiom meaning to bring about change."}, {"section": "English", "q": "'Stationary' and 'Stationery' are:", "opts": ["Synonyms", "Homophones with different meanings", "Antonyms", "The same word"], "ans": 1, "exp": "'Stationary' means not moving; 'stationery' refers to writing materials — they sound alike (homophones) but differ in meaning and spelling."}, {"section": "English", "q": "'Principal' and 'Principle' differ in that:", "opts": ["Principal = a main person/thing or money sum; Principle = a fundamental rule", "Both mean the same", "Principal = a rule; Principle = the head of a school", "Neither is correct"], "ans": 0, "exp": "'Principal' can mean the head of an institution or the main sum of money; 'principle' refers to a fundamental truth or rule."}, {"section": "English", "q": "Complete the idiom: 'To ___ the bull by the horns' means to confront a difficult situation directly.", "opts": ["catch", "take", "grab", "hold"], "ans": 1, "exp": "The idiom is 'to take the bull by the horns', meaning to confront a difficult situation head-on."}, {"section": "English", "q": "'He is the kind of person who ___ never give up.'", "opts": ["will", "would", "does", "did"], "ans": 0, "exp": "A general characteristic/habitual truth about a person is typically expressed using 'will' in this context: 'who will never give up'."}, {"section": "English", "q": "Choose the sentence with correct subject-verb agreement:", "opts": ["Mathematics are a difficult subject for many.", "Mathematics is a difficult subject for many.", "Mathematics were difficult subjects.", "Mathematics have been difficult."], "ans": 1, "exp": "'Mathematics', though ending in -s, is treated as a singular subject when referring to the field of study, taking 'is'."}, {"section": "English", "q": "'Scarcely had he arrived ___ the phone rang.'", "opts": ["than", "when", "that", "then"], "ans": 1, "exp": "The correct correlative pairing is 'scarcely...when', not 'scarcely...than'."}, {"section": "English", "q": "'No sooner had she left ___ it started to rain.'", "opts": ["when", "than", "that", "then"], "ans": 1, "exp": "The correct correlative pairing is 'no sooner...than'."}, {"section": "English", "q": "'Hardly had the match started ___ it began to pour.'", "opts": ["than", "when", "that", "so"], "ans": 1, "exp": "The correlative pair is 'hardly...when'."}, {"section": "English", "q": "Choose the correctly structured sentence using 'so...that':", "opts": ["He was so tired that he fell asleep immediately.", "He was too tired that he fell asleep.", "He was so tired so he fell asleep.", "He was that tired he fell asleep."], "ans": 0, "exp": "'So...that' correctly expresses cause and effect/result: 'so tired that he fell asleep'."}, {"section": "English", "q": "Choose the correctly structured sentence using 'too...to':", "opts": ["The tea was too hot that I couldn't drink it.", "The tea was too hot to drink.", "The tea was so hot to drink.", "The tea was too hot so I drank it."], "ans": 1, "exp": "'Too...to' expresses that something exceeds a limit preventing an action: 'too hot to drink'."}, {"section": "English", "q": "'By the time we arrived, the movie ___ already.'", "opts": ["started", "has started", "had started", "was starting"], "ans": 2, "exp": "An action completed before another past action requires the Past Perfect tense: 'had started'."}, {"section": "English", "q": "'By this time next year, I ___ my degree.'", "opts": ["will complete", "will have completed", "complete", "am completing"], "ans": 1, "exp": "An action that will be completed before a specific point in the future uses Future Perfect: 'will have completed'."}, {"section": "English", "q": "Which sentence correctly uses the Present Perfect Continuous?", "opts": ["I have been working here since 2020.", "I have working here since 2020.", "I am working here since 2020.", "I work here since 2020."], "ans": 0, "exp": "Present Perfect Continuous (have/has been + V-ing) correctly expresses an action that began in the past and continues: 'have been working'."}, {"section": "English", "q": "'A blessing in disguise' means:", "opts": ["An obvious benefit", "Something that seems bad at first but turns out good", "A hidden danger", "A costume for a celebration"], "ans": 1, "exp": "This idiom describes something that initially appears unfortunate but ultimately results in a positive outcome."}, {"section": "English", "q": "'To bite the bullet' means:", "opts": ["To eat quickly", "To face a difficult situation with courage", "To avoid responsibility", "To speak harshly"], "ans": 1, "exp": "'To bite the bullet' means to brace yourself and endure something unpleasant or difficult with courage."}, {"section": "English", "q": "'To burn the midnight oil' means:", "opts": ["To waste resources", "To work or study late into the night", "To celebrate all night", "To light many candles"], "ans": 1, "exp": "This idiom means to work or study late into the night, historically referring to burning oil lamps for light."}, {"section": "English", "q": "Choose the word opposite in meaning to 'Benevolent':", "opts": ["Generous", "Malevolent", "Kind", "Charitable"], "ans": 1, "exp": "'Benevolent' means kind and generous; its antonym is 'malevolent' (having or showing ill will)."}, {"section": "English", "q": "Choose the word opposite in meaning to 'Meticulous':", "opts": ["Careful", "Careless", "Precise", "Thorough"], "ans": 1, "exp": "'Meticulous' means showing great attention to detail; its antonym is 'careless'."}, {"section": "General Science & Ability", "q": "Evaluate: 4^(1/2) × 4² − 4⁰", "opts": ["24", "28", "31", "32"], "ans": 2, "exp": "4^(1/2)=2, 4²=16, 4⁰=1. Using exponent law: 4^(1/2)×4²=4^(2.5)=32. Then 32−1=31."}, {"section": "General Science & Ability", "q": "What is k, given that 27ᵏ = 9?", "opts": ["1/3", "2/3", "4/3", "3/2"], "ans": 1, "exp": "27ᵏ=9 → (3³)ᵏ=3² → 3^(3k)=3² → 3k=2 → k=2/3."}, {"section": "General Science & Ability", "q": "Cows consume a fixed stock of food in 150 days. Removing 10 cows makes the food last 160 days. How many cows were there originally?", "opts": ["150", "160", "100", "120"], "ans": 1, "exp": "Let n=original cows. 150n=160(n−10) → 150n=160n−1600 → 10n=1600 → n=160."}, {"section": "General Science & Ability", "q": "A train 99m long takes 11 seconds to pass a station 231m long. What is its speed in km/h?", "opts": ["30", "75.6", "108", "120"], "ans": 2, "exp": "Total distance=99+231=330m in 11s → speed=30 m/s = 30×3.6 = 108 km/h."}, {"section": "General Science & Ability", "q": "A, B, C share $112. B gets $12 less than A; C gets twice as much as B. How much does C get?", "opts": ["$34", "$44", "$50", "$56"], "ans": 2, "exp": "Let A=x, B=x−12, C=2(x−12). Sum: x+(x−12)+2(x−12)=112 → 4x−36=112 → x=37; B=25; C=50."}, {"section": "General Science & Ability", "q": "Zaid is 6 times as old as Zoya now. In 7 years, the sum of their ages will be 49. How old was Zaid when Zoya was born?", "opts": ["20", "25", "30", "35"], "ans": 1, "exp": "Let Zoya=z, Zaid=6z. (6z+7)+(z+7)=49 → 7z=35 → z=5. Zaid now=30. When Zoya was born (5 years ago), Zaid was 30−5=25."}, {"section": "General Science & Ability", "q": "Two consecutive positive integers have squares summing to 113. What are they?", "opts": ["6, 7", "7, 8", "8, 9", "9, 10"], "ans": 1, "exp": "7²+8²=49+64=113, matching the condition exactly."}, {"section": "General Science & Ability", "q": "A shop sold 25% of its stock of lights, leaving 1,500 unsold. How many lights were there originally?", "opts": ["1800", "2000", "2250", "2500"], "ans": 1, "exp": "If 25% sold, 75% remain. 75% of total=1500 → Total=1500/0.75=2000."}, {"section": "General Science & Ability", "q": "Solve x² − 11x + 10 = 0.", "opts": ["x=−1,−10", "x=−1,+10", "x=+1,+10", "x=+1,−10"], "ans": 2, "exp": "Factoring: (x−1)(x−10)=0 → x=1 or x=10, both positive roots."}, {"section": "General Science & Ability", "q": "5 markers + 1 pencil = Rs. 245; 3 markers + 3 pencils = Rs. 327. What is the cost of one marker?", "opts": ["Rs. 32", "Rs. 34", "Rs. 37", "Rs. 40"], "ans": 1, "exp": "From eq2 (÷3): marker+pencil=109 → pencil=245−5marker; substitute: marker+(245−5marker)=109 → 245−4marker=109 → marker=34."}, {"section": "General Science & Ability", "q": "If one angle of an isosceles triangle is 68°, what are the possible values of the remaining angles?", "opts": ["Any value between 68° and 112°", "Specifically 68°/44° or 56°/56°, depending on which angle is 68°", "Any value from 1° to 112°", "Always 56° and 56°"], "ans": 1, "exp": "If 68° is a base angle: other angles are 68° and 44°. If 68° is the apex: both base angles are 56° each — specific values, not a range."}, {"section": "General Science & Ability", "q": "The perimeter of a semicircle is 20.6 cm. What is its approximate radius?", "opts": ["4 cm", "5 cm", "6.6 cm", "8 cm"], "ans": 0, "exp": "Perimeter of a semicircle = r(π+2). 20.6 = r×5.1416 → r ≈ 4.0 cm."}, {"section": "General Science & Ability", "q": "A rectangular water tank is 1.5m long, 1.0m wide, and 60cm deep. How many litres does it hold?", "opts": ["600 litres", "750 litres", "900 litres", "1000 litres"], "ans": 2, "exp": "Volume = 1.5×1.0×0.6 = 0.9 m³; since 1 m³ = 1000 litres, this equals 900 litres."}, {"section": "General Science & Ability", "q": "The inner circumference of a circular race track is 440m, and the track's width is 14m. What is the outer radius?", "opts": ["70 m", "77 m", "84 m", "91 m"], "ans": 2, "exp": "Inner radius: 2πr=440 → r=70m (using π≈22/7). Outer radius = 70+14 = 84m."}, {"section": "General Science & Ability", "q": "In a survey of 200 people, 90 like tennis, 108 like cricket, and 46 like both. How many like neither sport?", "opts": ["38", "44", "48", "52"], "ans": 2, "exp": "Union (liking at least one) = 90+108−46 = 152. Neither = 200−152 = 48."}, {"section": "General Science & Ability", "q": "A is B's daughter, C is B's mother, D is B's sister, and E is D's son. How is A related to E?", "opts": ["Aunt", "Granddaughter", "Cousin", "Niece"], "ans": 2, "exp": "A (B's daughter) and E (D's son) are children of siblings (B and D), making them first cousins."}, {"section": "General Science & Ability", "q": "'I have no brother, and that girl's father is my father's son.' Whose photograph is being described?", "opts": ["His father's", "His own", "His daughter's", "His sister's"], "ans": 2, "exp": "With no brother, 'my father's son' refers to the speaker himself. So 'that girl's father' is the speaker, meaning the girl is his daughter."}, {"section": "General Science & Ability", "q": "A bus arrives every 52 minutes. The last bus left 16 minutes ago, and the next one arrives at 8:15 PM. What time is it now?", "opts": ["7:23 PM", "7:39 PM", "7:49 PM", "7:59 PM"], "ans": 1, "exp": "Previous bus arrival: 8:15 PM − 52 min = 7:23 PM. Since it left 16 minutes ago, current time = 7:23 + 16 = 7:39 PM."}, {"section": "General Science & Ability", "q": "Peter is East of Tom. Tom is North of John. Mike is South of John. In which direction is Mike from Peter?", "opts": ["South-East", "South-West", "North-West", "South"], "ans": 1, "exp": "Peter is east and north relative to Mike's position, so Mike lies South-West of Peter."}, {"section": "General Science & Ability", "q": "Find the sum of all prime numbers less than 21.", "opts": ["58", "64", "77", "81"], "ans": 2, "exp": "Primes under 21: 2,3,5,7,11,13,17,19. Sum = 77."}, {"section": "General Science & Ability", "q": "Roni runs 100m in 45 seconds; Willy runs 100m in 36 seconds. By what distance does Willy beat Roni?", "opts": ["15 m", "20 m", "25 m", "30 m"], "ans": 1, "exp": "When Willy finishes at 36 sec, Roni has covered (100/45)×36 = 80m. Willy beats Roni by 100−80 = 20 metres."}, {"section": "General Science & Ability", "q": "Given A = (2π+y)x², where A=36 and y=2.77, find x.", "opts": ["1", "2", "3", "4"], "ans": 1, "exp": "36 = (6.2832+2.77)x² = 9.0532x² → x² ≈ 3.977 → x ≈ 2."}, {"section": "General Science & Ability", "q": "A regular polygon has an exterior angle of 36°. How many sides does it have?", "opts": ["Eight (Octagon)", "Nine (Nonagon)", "Ten (Decagon)", "Twelve (Dodecagon)"], "ans": 2, "exp": "Number of sides = 360°/exterior angle = 360/36 = 10, making it a decagon."}, {"section": "General Science & Ability", "q": "The total surface area of a cylinder with radius 3.5cm and height 5.5cm (π=22/7) is:", "opts": ["176 cm²", "198 cm²", "220 cm²", "242 cm²"], "ans": 1, "exp": "TSA = 2πr(h+r) = 2×(22/7)×3.5×(5.5+3.5) = 198 cm²."}, {"section": "General Science & Ability", "q": "Of 30 bicycles tested, 27 passed the lights check, 21 passed the brakes check, and 1 failed both. How many passed both checks?", "opts": ["17", "19", "21", "23"], "ans": 1, "exp": "Let x=passed both: (27−x)+(21−x)+x+1=30 → 49−x=30 → x=19."}, {"section": "General Science & Ability", "q": "A box has 8 red, 6 green, and 7 blue toys. What is the probability of picking a toy that is neither red nor green?", "opts": ["1/3", "1/4", "1/2", "2/3"], "ans": 0, "exp": "Total=21 toys; neither red nor green means blue=7. Probability = 7/21 = 1/3."}, {"section": "General Science & Ability", "q": "In an office with 16 men and 12 women completing a job in 20 days, while 18 women alone complete the same job in 40 days — how many days would 12 men and 27 women take?", "opts": ["14", "16", "18", "20"], "ans": 1, "exp": "One woman's daily rate=1/(18×40)=1/720. From the first scenario, solving gives one man's rate=1/480. Combining 12 men+27 women gives a rate of 1/16, i.e., 16 days."}, {"section": "General Science & Ability", "q": "If the output voltage of a transformer is greater than the input voltage, the transformer is a:", "opts": ["Step-down transformer", "Step-up transformer", "Isolation transformer", "Autotransformer only"], "ans": 1, "exp": "A step-up transformer increases voltage from the primary (input) to secondary (output) coil."}, {"section": "General Science & Ability", "q": "The voltage signal generated by a microphone, before digital conversion, is best described as:", "opts": ["Digital", "Analogue", "Binary", "Static"], "ans": 1, "exp": "A microphone produces a continuous (analogue) electrical signal that mirrors the original sound wave's amplitude and frequency."}, {"section": "General Science & Ability", "q": "After nitrogen and oxygen, the third most abundant gas in Earth's atmosphere is:", "opts": ["Hydrogen", "Neon", "Argon", "Helium"], "ans": 2, "exp": "Argon, a noble gas, makes up about 0.93% of the atmosphere, making it the third most abundant gas after nitrogen and oxygen."}, {"section": "General Science & Ability", "q": "Among electromagnetic waves, which has the maximum , Switzerland", "Brussels, Belgium"], "ans": 1, "exp": "The World Bank is headquartered in Washington D.C., alongside the IMF."}, {"section": "Current Affairs", "q": "The World Trade Organization (WTO) was established in:", "opts": ["1944", "1948", "1995", "2001"], "ans": 2, "exp": "The WTO was established in 1995, succeeding the earlier General Agreement on Tariffs and Trade (GATT)."}, {"section": "Current Affairs", "q": "The Organisation of Islamic Cooperation (OIC), headquartered in Jeddah, was established in:", "opts": ["1945", "1960", "1969", "1973"], "ans": 2, "exp": "The OIC was founded in 1969, in response to an arson attack on Al-Aqsa Mosque."}, {"section": "Current Affairs", "q": "The European Union's foundational treaty, the Maastricht Treaty, came into force in:", "opts": ["1957", "1973", "1993", "2001"], "ans": 2, "exp": "The Maastricht Treaty, establishing the European Union as it's structured today, came into force in 1993."}, {"section": "Current Affairs", "q": "ASEAN, headquartered in Jakarta, Indonesia, was founded in:", "opts": ["1961", "1967", "1975", "1985"], "ans": 1, "exp": "ASEAN (Association of Southeast Asian Nations) was founded in 1967."}, {"section": "Current Affairs", "q": "The UN Security Council has how many permanent members, each holding veto power?", "opts": ["Four", "Five", "Six", "Ten"], "ans": 1, "exp": "The five permanent members are the United States, United Kingdom, France, Russia, and China."}, {"section": "Current Affairs", "q": "The Special Investment Facilitation Council (SIFC) of Pakistan was established in:", "opts": ["2021", "2022", "2023", "2024"], "ans": 2, "exp": "The SIFC was established in 2023 to coordinate efforts attracting foreign investment in key sectors."}, {"section": "Current Affairs", "q": "Which Pakistani institution is primarily responsible for investigating and prosecuting corruption cases?", "opts": ["FIA", "NAB", "SECP", "FBR"], "ans": 1, "exp": "The National Accountability Bureau (NAB) is tasked with investigating and prosecuting corruption cases."}, {"section": "Current Affairs", "q": "Which institution manages citizen identity registration (CNIC) in Pakistan?", "opts": ["ECP", "NADRA", "SECP", "FBR"], "ans": 1, "exp": "NADRA (National Database and Registration Authority) manages citizen identity registration and issues CNICs."}, {"section": "Current Affairs", "q": "The Federal Board of Revenue (FBR) in Pakistan is primarily responsible for:", "opts": ["Election supervision", "Tax collection and customs administration", "Currency regulation", "Corporate sector regulation"], "ans": 1, "exp": "The FBR handles tax collection and customs administration at the federal level in Pakistan."}, {"section": "Current Affairs", "q": "The Securities & Exchange Commission of Pakistan (SECP) primarily regulates:", "opts": ["Elections", "The corporate sector and capital markets", "Immigration", "Currency issuance"], "ans": 1, "exp": "SECP regulates Pakistan's corporate sector and capital markets, overseeing company registration and securities trading."}, {"section": "Current Affairs", "q": "UNESCO's primary focus areas are:", "opts": ["Children's welfare only", "Education, science, and cultural cooperation", "Trade tariffs", "Military security"], "ans": 1, "exp": "UNESCO (United Nations Educational, Scientific and Cultural Organization) focuses on education, science, and culture."}, {"section": "Current Affairs", "q": "UNICEF's primary mandate concerns:", "opts": ["Children's welfare and rights worldwide", "Global trade regulation", "Refugee resettlement only", "Climate policy"], "ans": 0, "exp": "UNICEF focuses on protecting and promoting children's welfare and rights across the world."}, {"section": "Current Affairs", "q": "Pakistan became a full member of the Shanghai Cooperation Organisation (SCO) in:", "opts": ["2015", "2017", "2019", "2021"], "ans": 1, "exp": "Pakistan attained full SCO membership in 2017, alongside India."}, {"section": "Current Affairs", "q": "The Economic Cooperation Organization (ECO), of which Pakistan is a founding member, primarily focuses on:", "opts": ["Military alliance", "Regional economic and trade cooperation", "Religious affairs", "Education standards"], "ans": 1, "exp": "ECO promotes economic, technical, and trade cooperation among its member states, primarily in the region spanning Iran, Pakistan, Turkey, and Central Asia."}, {"section": "Current Affairs", "q": "D-8 (Developing 8) is a group of countries united primarily by:", "opts": ["Being former Soviet states", "Being major Muslim-majority developing economies", "Being European Union candidates", "Sharing a single currency"], "ans": 1, "exp": "D-8 is a cooperation framework among eight major Muslim-majority developing countries, including Pakistan, Turkey, Indonesia, and Egypt."}, {"section": "Current Affairs", "q": "Which global conflict has been shaping energy markets and grain supplies since February 2022?", "opts": ["Israel-Palestine conflict", "Russia-Ukraine conflict", "India-Pakistan tensions", "Yemen civil war"], "ans": 1, "exp": "Russia's full-scale invasion of Ukraine began in February 2022, significantly impacting global energy and grain markets."}, {"section": "Current Affairs", "q": "Since August 2021, the group governing Afghanistan has been:", "opts": ["The Northern Alliance", "The Taliban", "A UN transitional authority", "A coalition government"], "ans": 1, "exp": "The Taliban returned to power in Afghanistan in August 2021, reshaping regional security and refugee dynamics."}, {"section": "Current Affairs", "q": "World Human Rights Day is observed annually on:", "opts": ["5 June", "10 December", "1 March", "8 September"], "ans": 1, "exp": "Human Rights Day is observed on 10 December each year, marking the UN's adoption of the Universal Declaration of Human Rights."}, {"section": "Current Affairs", "q": "Article 6 of Pakistan's Constitution deals with:", "opts": ["Fundamental rights", "High Treason", "Election procedures", "Judicial appointments"], "ans": 1, "exp": "Article 6 of the 1973 Constitution defines and criminalizes High Treason, including the abrogation or subversion of the Constitution."}, {"section": "Current Affairs", "q": "Articles 62 and 63 of Pakistan's Constitution concern:", "opts": ["Provincial autonomy", "Qualifications and disqualifications of parliamentary members", "Judicial review", "Taxation powers"], "ans": 1, "exp": "Articles 62 and 63 set out the qualifications and disqualifications for membership of Parliament."}, {"section": "Current Affairs", "q": "The Gross Domestic Product (GDP) of a country measures:", "opts": ["Total government spending only", "The total value of goods and services produced within a country", "Only exports", "Foreign exchange reserves"], "ans": 1, "exp": "GDP measures the total monetary value of all goods and services produced within a country's borders over a given period."}, {"section": "Current Affairs", "q": "A 'current account deficit' occurs when:", "opts": ["A country's exports exceed its imports", "A country's imports/payments exceed its exports/receipts", "Government spending equals revenue", "Inflation decreases"], "ans": 1, "exp": "A current account deficit arises when a country's payments for imports and other outflows exceed its receipts from exports and inflows."}, {"section": "Current Affairs", "q": "'FDI' stands for:", "opts": ["Federal Development Index", "Foreign Direct Investment", "Fiscal Deficit Indicator", "Future Development Initiative"], "ans": 1, "exp": "FDI (Foreign Direct Investment) refers to investment made by a foreign entity into productive assets of another country."}, {"section": "Current Affairs", "q": "India announced holding the Indus Waters Treaty 'in abeyance' following the Pahalgam attack. On what date was this attack?", "opts": ["22 April 2025", "1 May 2025", "10 May 2025", "17 September 2025"], "ans": 0, "exp": "The Pahalgam attack in Indian-administered Kashmir occurred on 22 April 2025, which India cited as the reason for suspending the treaty the next day."}, {"section": "Current Affairs", "q": "In response to India suspending the Indus Waters Treaty, Pakistan placed which 1972 agreement in abeyance?", "opts": ["Tashkent Declaration", "Simla Agreement", "Lahore Declaration", "Karachi Agreement"], "ans": 1, "exp": "Pakistan responded by placing the 1972 Simla Agreement and other bilateral arrangements on hold."}, {"section": "Current Affairs", "q": "The brief India-Pakistan military exchange in May 2025 ended with a ceasefire on:", "opts": ["1 May 2025", "5 May 2025", "10 May 2025", "15 May 2025"], "ans": 2, "exp": "A cessation of firing between India and Pakistan was reached on 10 May 2025, after a brief military exchange earlier that month."}, {"section": "Current Affairs", "q": "The Strategic Mutual Defence Agreement (SMDA) between Pakistan and Saudi Arabia was signed on:", "opts": ["17 September 2025", "7 August 2026", "22 April 2025", "10 May 2025"], "ans": 0, "exp": "The SMDA was signed on 17 September 2025 in Riyadh, establishing that aggression against either country is treated as aggression against both."}, {"section": "Current Affairs", "q": "The Makkah Joint Defence Agreement, described as a 'NATO-style' pact, was signed between Pakistan, Saudi Arabia, and:", "opts": ["Iran", "Turkey", "UAE", "Qatar"], "ans": 1, "exp": "The trilateral Makkah Joint Defence Agreement, signed 7 August 2026, includes Pakistan, Saudi Arabia, and Turkey."}, {"section": "Current Affairs", "q": "Under the Makkah Joint Defence Agreement's core principle, an armed attack on any one signatory is treated as:", "opts": ["A matter for the UN Security Council only", "An attack against all three signatories", "Grounds for economic sanctions only", "A bilateral issue between the two other states"], "ans": 1, "exp": "The agreement follows a NATO-style collective defence principle: an attack on one signatory is regarded as an attack on all three."}, {"section": "Current Affairs", " panded to include more members."}, {"section": "Current Affairs", "q": "The New Development Bank (NDB), which funds infrastructure in member and partner countries, was established by:", "opts": ["The G7", "BRICS", "ASEAN", "The OIC"], "ans": 1, "exp": "The New Development Bank was established by BRICS member states to fund infrastructure and sustainable development."}, {"section": "Current Affairs", "q": "The 2025 Nobel Peace Prize was awarded to:", "opts": ["Volodymyr Zelensky", "María Corina Machado", "Narges Mohammadi", "António Guterres"], "ans": 1, "exp": "María Corina Machado of Venezuela won the 2025 Nobel Peace Prize for her work promoting democratic rights in Venezuela."}, {"section": "Current Affairs", "q": "The 2025 Nobel Prize in Literature was awarded to:", "opts": ["Han Kang", "László Krasznahorkai", "Annie Ernaux", "Jon Fosse"], "ans": 1, "exp": "Hungarian author László Krasznahorkai won the 2025 Nobel Prize in Literature for a visionary body of work."}, {"section": "Current Affairs", "q": "The 2025 Nobel Prize in Physics was awarded for discoveries related to:", "opts": ["Gravitational waves", "Macroscopic quantum mechanical tunnelling in an electric circuit", "Exoplanet detection", "CRISPR gene editing"], "ans": 1, "exp": "John Clarke, Michel Devoret, and John M. Martinis won the 2025 Physics Nobel for discovering macroscopic quantum tunnelling and energy quantisation in an electric circuit."}, {"section": "Current Affairs", "q": "The 2025 Nobel Prize in Chemistry recognized work on:", "opts": ["mRNA vaccines", "Metal-organic frameworks", "Carbon capture technology", "Battery chemistry"], "ans": 1, "exp": "Susumu Kitagawa, Richard Robson, and Omar M. Yaghi won the 2025 Chemistry Nobel for developing metal-organic frameworks."}, {"section": "Current Affairs", "q": "As of Pakistan's current IMF programme, the main facility is a 37-month arrangement of what type, approved 25 September 2024?", "opts": ["Stand-By Arrangement (SBA)", "Extended Fund Facility (EFF)", "Rapid Financing Instrument (RFI)", "Flexible Credit Line (FCL)"], "ans": 1, "exp": "Pakistan's primary IMF programme is a 37-month Extended Fund Facility (EFF), approved on 25 September 2024."}, {"section": "Current Affairs", "q": "Pakistan's companion IMF arrangement focused on climate resilience is called the:", "opts": ["Green Climate Facility", "Resilience and Sustainability Facility (RSF)", "Climate Adaptation Fund", "Loss and Damage Facility"], "ans": 1, "exp": "The Resilience and Sustainability Facility (RSF), approved 9 May 2025, runs alongside the EFF with a focus on climate resilience."}, {"section": "Current Affairs", "q": "A notable milestone in Pakistan's FY25 economic performance was:", "opts": ["Its first trade surplus in a decade", "Its first current account surplus in 14 years", "Zero inflation for the first time", "Full repayment of all IMF loans"], "ans": 1, "exp": "Pakistan recorded its first current account surplus in 14 years during FY25, a key positive economic indicator."}, {"section": "Current Affairs", "q": "As of mid-2026, Pakistan's State Bank policy rate stood at approximately:", "opts": ["8.5%", "9.5%", "10.5%", "11.5%"], "ans": 3, "exp": "The SBP policy rate was held at 11.5% as of mid-2026, according to the latest reported monetary policy stance."}, {"section": "Current Affairs", "q": "Who serves as Governor of the State Bank of Pakistan (as of the latest reporting)?", "opts": ["Reza Baqir", "Jameel Ahmad", "Ishrat Husain", "Shamshad Akhtar"], "ans": 1, "exp": "Jameel Ahmad has served as Governor of the State Bank of Pakistan in recent years."}, {"section": "Pakistan Affairs", "q": "Pakistan's 1962 Constitution introduced which system of government?", "opts": ["Parliamentary", "Presidential", "Monarchy", "Confederal"], "ans": 1, "exp": "The 1962 Constitution, promulgated under Ayub Khan, established a presidential system with a unicameral National Assembly."}, {"section": "Pakistan Affairs", "q": "Which of Pakistan's three endence Day, leading to widespread confusion and migration."}, {"section": "Pakistan Affairs", "q": "The Radcliffe Line was drawn by a Boundary Commission chaired by:", "opts": ["Lord Mountbatten", "Sir Cyril Radcliffe", "Lord Wavell", "Stafford Cripps"], "ans": 1, "exp": "Sir Cyril Radcliffe chaired the Boundary Commission responsible for drawing the India-Pakistan boundary line."}, {"section": "Pakistan Affairs", "q": "Which Muslim League annual session featured Allama Iqbal's presidential address proposing a separate Muslim state?", "opts": ["Dhaka, 1906", "Lucknow, 1916", "Allahabad, 1930", "Lahore, 1940"], "ans": 2, "exp": "Allama Iqbal delivered his famous presidential address at the Allahabad session in 1930, articulating the idea of a separate Muslim state."}, {"section": "Pakistan Affairs", "q": "The 1943 Muslim League session in Delhi was presided over by:", "opts": ["Allama Iqbal", "Liaquat Ali Khan", "Muhammad Ali Jinnah", "Sir Syed Ahmad Khan"], "ans": 2, "exp": "Quaid-e-Azam Muhammad Ali Jinnah presided over the 1943 Delhi session during the height of the independence movement."}, {"section": "Pakistan Affairs", "q": "The 27th Constitutional Amendment (passed November 2025) created which new military post for the first time in Pakistan's history?", "opts": ["Chief of Army Staff", "Chief of Defence Forces (CDF)", "Inspector-General", "Commander-in-Chief"], "ans": 1, "exp": "The 27th Amendment created the Chief of Defence Forces (CDF) post, Pakistan's first such position."}, {"section": "Pakistan Affairs", "q": "The 27th Amendment abolished which previous military coordinating post, replacing it with the CDF role?", "opts": ["Chief of Naval Staff", "Chief of Air Staff", "Chairman, Joint Chiefs of Staff Committee (CJCSC)", "Inspector-General Frontier Corps"], "ans": 2, "exp": "The post of Chairman, Joint Chiefs of Staff Committee (CJCSC) was abolished, its coordinating function absorbed into the new CDF role."}, {"section": "Pakistan Affairs", "q": "Field Marshal Syed Asim Munir was formally notified as Pakistan's first Chief of Defence Forces on:", "opts": ["17 September 2025", "5 December 2025", "7 August 2026", "26 October 2024"], "ans": 1, "exp": "Asim Munir was formally notified as Pakistan's first CDF on 5 December 2025, for a five-year term."}, {"section": "Pakistan Affairs", "q": "Besides Asim Munir, who was the only other officer in Pakistan's history to hold the rank of Field Marshal?", "opts": ["Ayub Khan", "Yahya Khan", "Zia-ul-Haq", "Pervez Musharraf"], "ans": 0, "exp": "Ayub Khan was the first and, until Asim Munir's 2025 promotion, the only Pakistani officer to hold the rank of Field Marshal."}, {"section": "Pakistan Affairs", "q": "The 26th Constitutional Amendment (passed October 2024) primarily reshaped:", "opts": ["Provincial boundaries", "Judicial appointments and Supreme Court procedures", "The election commission's structure", "Local government powers"], "ans": 1, "exp": "The 26th Amendment, also called the 'Constitutional Package', reformed how judges — especially the Chief Justice — are appointed and how the Supreme Court functions."}, {"section": "Pakistan Affairs", "q": "Under the 26th Amendment, who became the first Chief Justice of Pakistan appointed under the new parliamentary-committee process?", "opts": ["Qazi Faez Isa", "Yahya Afridi", "Umar Ata Bandial", "Gulzar Ahmed"], "ans": 1, "exp": "Justice Yahya Afridi became the first CJP appointed under the new process established by the 26th Amendment, taking office in October 2024."}, {"section": "Pakistan Affairs", "q": "The 26th Amendment fixed the Chief Justice's term at a maximum of:", "opts": ["Two years", "Three years", "Four years", "Five years"], "ans": 1, "exp": "The amendment capped the Chief Justice's tenure at a maximum of three years, regardless of the standard retirement age of 65."}, {"section": "Pakistan Affairs", "q": "Which constitutional right did the 26th Amendment add as a new Article 9A?", "opts": ["Right to education", "Right to a clean and healthy environment", "Right to privacy", "Right to information"], "ans": 1, "exp": "Article 9A, added by the 26th Amendment, guarantees the fundamental right to a clean and healthy environment."}, {"section": "Pakistan Affairs", "q": "As of the most recent reporting, who serves as Chief Justice of Pakistan?", "opts": ["Qazi Faez Isa", "Yahya Afridi", "Gulzar Ahmed", "Umar Ata Bandial"], "ans": 1, "exp": "Yahya Afridi has served as Chief Justice of Pakistan since 26 October 2024."}, {"section": "Pakistan Affairs", "q": "As of the most recent reporting, who serves as Chairman of the Senate of Pakistan?", "opts": ["Sadiq Sanjrani", "Yusuf Raza Gillani", "Raza Rabbani", "Mian Raza Rabbani"], "ans": 1, "exp": "Yusuf Raza Gillani has served as Chairman Senate since April 2024."}, {"section": "Pakistan Affairs", "q": "As of the most recent reporting, who serves as Speaker of Pakistan's National Assembly?", "opts": ["Asad Qaiser", "Sardar Ayaz Sadiq", "Raja Pervaiz Ashraf", "Fehmida Mirza"], "ans": 1, "exp": "Sardar Ayaz Sadiq has served as Speaker of the National Assembly since March 2024."}, {"section": "Pakistan Affairs", "q": "Which three provincial constitutional systems compare as follows — the 1956 Constitution used which legislative structure?", "opts": ["Bicameral", "Unicameral", "Tricameral", "No formal legislature"], "ans": 1, "exp": "The 1956 Constitution established a unicameral legislature, unlike the bicameral structure of the current 1973 Constitution."}, {"section": "English", "q": "Which sentence demonstrates correct use of the passive voice with a modal verb?", "opts": ["The report must finished by Friday.", "The report must be finished by Friday.", "The report must being finished by Friday.", "The report must finishing by Friday."], "ans": 1, "exp": "Passive voice with modals follows the pattern 'modal + be + past participle': 'must be finished'."}, {"section": "English", "q": "Choose the sentence with the correct use of 'whom':", "opts": ["Whom is calling?", "To whom should I address this letter?", "Whom is responsible?", "Whom did it?"], "ans": 1, "exp": "'Whom' is correct as the object of a preposition ('to whom'); as a subject, 'who' would be used instead."}, {"section": "English", "q": "'The company's profits have ___ significantly this quarter.'", "opts": ["rose", "raised", "risen", "rising"], "ans": 2, "exp": "'Rise' is intransitive (no object) and its past participle is 'risen'; 'raise' is transitive and requires an object."}, {"section": "English", "q": "Choose the sentence with correct comparative structure:", "opts": ["This is the most best solution.", "This is the best solution.", "This is more best solution.", "This is the bestest solution."], "ans": 1, "exp": "'Best' is already the superlative form of 'good'; adding 'most' creates a double superlative error."}, {"section": "English", "q": "'He is one of the students who ___ always late.'", "opts": ["is", "are", "was", "has been"], "ans": 1, "exp": "In 'one of the [plural noun] who', the relative clause verb agrees with the plural antecedent 'students': 'are'."}, {"section": "English", "q": "'Each of the boys ___ given a prize.'", "opts": ["were", "was", "have been", "are"], "ans": 1, "exp": "'Each' takes a singular verb regardless of the plural noun that follows it: 'was given'."}, {"section": "English", "q": "Choose the correct sentence using 'lay' vs 'lie':", "opts": ["I want to lay down for a while.", "I want to lie down for a while.", "I want to lied down for a while.", "I want to laying down for a while."], "ans": 1, "exp": "'Lie' (lie-lay-lain) means to recline and takes no object; 'lay' (lay-laid-laid) means to place something and requires an object."}, {"section": "English", "q": "'To add fuel to the fire' means:", "opts": ["To calm a situation down", "To make a bad situation worse", "To start a new project", "To celebrate success"], "ans": 1, "exp": "This idiom means to worsen an already difficult or tense situation."}, {"section": "English", "q": "'To turn a blind eye' means:", "opts": ["To look carefully", "To deliberately ignore something", "To become angry", "To lose one's sight"], "ans": 1, "exp": "This idiom means to deliberately ignore or pretend not to notice something wrong."}, {"section": "English", "q": "'To read between the lines' means:", "opts": ["To read very slowly", "To understand a hidden or implied meaning", "To skip parts of a text", "To read aloud"], "ans": 1, "exp": "This idiom means to detect an underlying or implied meaning not directly stated."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Priviledge", "Privilege", "Privelege", "Privilage"], "ans": 1, "exp": "The correct spelling is 'Privilege'."}, {"section": "English", "q": "Choose the correctly spelled word:", "opts": ["Concious", "Conscious", "Consious", "Conscous"], "ans": 1, "exp": "The correct spelling is 'Conscious'."}, {"section": "English", "q": "'Ubiquitous' most nearly means:", "opts": ["Rare and unusual", "Present everywhere", "Extremely large", "Difficult to understand"], "ans": 1, "exp": "'Ubiquitous' describes something that appears to be present everywhere at once."}, {"section": "English", "q": "'Esoteric' most nearly means:", "opts": ["Widely known", "Understood by only a small, specialized group", "Very simple", "Publicly available"], "ans": 1, "exp": "'Esoteric' describes knowledge or interests understood by only a small, specialized group of people."}, {"section": "English", "q": "'Gregarious' most nearly means:", "opts": ["Shy and withdrawn", "Sociable and fond of company", "Aggressive", "Intellectually curious"], "ans": 1, "exp": "'Gregarious' describes someone who is sociable and enjoys the company of others."}, {"section": "English", "q": "Choose the antonym of 'Verbose':", "opts": ["Wordy", "Concise", "Elaborate", "Lengthy"], "ans": 1, "exp": "'Verbose' means using more words than necessary; its antonym is 'concise' (brief and clear)."}, {"section": "English", "q": "Choose the antonym of 'Frugal':", "opts": ["Thrifty", "Extravagant", "Economical", "Prudent"], "ans": 1, "exp": "'Frugal' means economical or sparing; its antonym is 'extravagant' (spending lavishly)."}, {"section": "English", "q": "'The project, ___ by three departments, was completed on time.'", "opts": ["handle", "handled", "handling", "to handle"], "ans": 1, "exp": "A past participle phrase correctly modifies 'the project': 'handled by three departments' (passive sense)."}, {"section": "English", "q": "Choose the sentence with the correctly placed modifier:", "opts": ["She almost drove her kids to school every day.", "She drove her kids to school almost every day.", "Almost she drove her kids to school every day.", "She drove almost her kids to school every day."], "ans": 1, "exp": "'Almost' should modify 'every day' (the frequency), not the act of driving itself — 'almost every day' is correctly placed."}, {"section": "English", "q": "Which sentence correctly uses an appositive phrase?", "opts": ["My brother the doctor lives in Lahore.", "My brother, the doctor, lives in Lahore.", "My brother; the doctor; lives in Lahore.", "My brother the doctor, lives, in Lahore."], "ans": 1, "exp": "An appositive phrase renaming or explaining a noun should be set off with commas: 'My brother, the doctor, lives in Lahore.'"}, {"section": "General Science & Ability", "q": "A sum of money becomes Rs. 9,200 in 5 years and Rs. 11,000 in 8 years at simple interest. Find the annual interest.", "opts": ["Rs. 500", "Rs. 600", "Rs. 700", "Rs. 800"], "ans": 1, "exp": "The difference (3 years' worth of interest) is 11000−9200=1800, so annual simple interest = 1800/3 = Rs. 600."}, {"section": "General Science & Ability", "q": "If a:b:c = 2:3:4 and a+b+c = 54, find the value of b.", "opts": ["12", "18", "24", "27"], "ans": 1, "exp": "Total parts = 2+3+4 = 9; each part = 54/9 = 6; b = 3×6 = 18."}, {"section": "General Science & Ability", "q": "The LCM of 12, 15, and 20 is:", "opts": ["60", "120", "180", "240"], "ans": 0, "exp": "LCM of 12 (2²×3), 15 (3×5), and 20 (2²×5) = 2²×3×5 = 60."}, {"section": "General Science & Ability", "q": "The HCF of 36 and 60 is:", "opts": ["6", "12", "18", "24"], "ans": 1, "exp": "36=2²×3², 60=2²×3×5; HCF = 2²×3 = 12."}, {"section": "General Science & Ability", "q": "A sum of Rs. 12,000 is divided between A and B in the ratio 5:3. How much does A receive?", "opts": ["Rs. 4,500", "Rs. 6,500", "Rs. 7,500", "Rs. 9,000"], "ans": 2, "exp": "Total parts = 5+3 = 8; each part = 12000/8 = 1500; A's share = 5×1500 = 7500."}, {"section": "General Science & Ability", "q": "What is the next number in the sequence: 1, 4, 9, 16, 25, ___?", "opts": ["30", "36", "49", "64"], "ans": 1, "exp": "This is the sequence of perfect squares (1²,2²,3²,4²,5²); the next term is 6² = 36."}, {"section": "General Science & Ability", "q": "A car depreciates by 10% of its value each year. If its current value is Rs. 100,000, what will it be worth after 2 years?", "opts": ["Rs. 80,000", "Rs. 81,000", "Rs. 90,000", "Rs. 82,000"], "ans": 1, "exp": "After year 1: 100,000×0.9=90,000; after year 2: 90,000×0.9=81,000."}, {"section": "General Science & Ability", "q": "A boat travels 30 km downstream in 2 hours and the same distance upstream in 3 hours. What is the speed of the boat in still water?", "opts": ["10 km/h", "12.5 km/h", "15 km/h", "17.5 km/h"], "ans": 1, "exp": "Downstream speed=15 km/h, upstream speed=10 km/h. Boat speed in still water = (15+10)/2 = 12.5 km/h."}, {"section": "General Science & Ability", "q": "If 3 men or 5 women can complete a task in 12 days, how long will 6 men and 5 women take together?", "opts": ["3 days", "4 days", "5 days", "6 days"], "ans": 1, "exp": "3 men's rate = 5 women's rate (both = 1/12 per day for the group). So 1 man = (5/3) women in productivity. 6 men + 5 women = (6×5/3 + 5) = 15 women-equivalent; since 5 women take 12 days, 15 women-equivalent take 12×5/15 = 4 days."}, {"section": "General Science & Ability", "q": "The sum of the angles of a pentagon (5 sides) is:", "opts": ["360°", "450°", "540°", "720°"], "ans": 2, "exp": "Using (n−2)×180°: (5−2)×180° = 540°."}, {"section": "General Science & Ability", "q": "A cone has a base radius of 3 cm and height 4 cm. Its slant height is:", "opts": ["4 cm", "5 cm", "6 cm", "7 cm"], "ans": 1, "exp": "Slant height = √(r²+h²) = √(9+16) = √25 = 5 cm."}, {"section": "General Science & Ability", "q": "Convert 0.75 to a fraction in its simplest form:", "opts": ["3/4", "7/5", "3/5", "7/4"], "ans": 0, "exp": "0.75 = 75/100 = 3/4 when simplified."}, {"section": "General Science & Ability", "q": "The value of log₁₀(100) is:", "opts": ["1", "2", "10", "100"], "ans": 1, "exp": "log₁₀(100) = log₁₀(10²) = 2."}, {"section": "General Science & Ability", "q": "If the radius of a sphere is doubled, its volume increases by a factor of:", "opts": ["2", "4", "6", "8"], "ans": 3, "exp": "Volume of a sphere ∝ r³; doubling the radius increases volume by 2³ = 8 times."}, {"section": "General Science & Ability", "q": "Which planet has the most moons in our solar system (per current astronomical counts)?", "opts": ["Jupiter", "Saturn", "Uranus", "Neptune"], "ans": 1, "exp": "Saturn has been found to have the most confirmed moons among the planets in recent astronomical surveys, surpassing Jupiter."}, {"section": "General Science & Ability", "q": "The process by which a solid changes directly into a gas without passing through the liquid state is called:", "opts": ["Evaporation", "Condensation", "Sublimation", "Deposition"], "ans": 2, "exp": "Sublimation is the direct transition of a substance from solid to gas, as seen with dry ice (solid CO2)."}, {"section": "General Science & Ability", "q": "Which of these organs is part of the human endocrine system?", "opts": ["Liver", "Pancreas", "Lungs", "Stomach"], "ans": 1, "exp": "The pancreas, besides its digestive role, is part of the endocrine system, producing insulin and glucagon."}, {"section": "General Science & Ability", "q": "The study of fungi is called:", "opts": ["Mycology", "Virology", "Bacteriology", "Entomology"], "ans": 0, "exp": "Mycology is the branch of biology dealing with the study of fungi."}, {"section": "General Science & Ability", "q": "The study of insects is called:", "opts": ["Mycology", "Entomology", "Ornithology", "Herpetology"], "ans": 1, "exp": "Entomology is the scientific study of insects."}, {"section": "General Science & Ability", "q": "In computing, 'URL' stands for:", "opts": ["Universal Resource Link", "Uniform Resource Locator", "United Resource Locator", "Universal Reference Link"], "ans": 1, "exp": "URL stands for Uniform Resource Locator, the address used to access resources on the internet."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Ijtihad' refers to:", "opts": ["Following established rulings of a school of jurisprudence without question", "Independent legal reasoning by a qualified jurist on a matter not explicitly covered", "Consensus of Muslim scholars", "The study of Hadith narrators"], "ans": 1, "exp": "Ijtihad is independent legal reasoning by a qualified jurist to derive a ruling on issues not explicitly addressed in the Quran or Sunnah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Taqlid' refers to:", "opts": ["Independent legal reasoning", "Following the established rulings of a recognized school of jurisprudence (madhhab)", "A pilgrimage ritual", "A form of charity"], "ans": 1, "exp": "'Taqlid' means following an established school's rulings without independently re-deriving them — the opposite of Ijtihad."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Bait-e-Rizwan' refers to the pledge of allegiance given to the Prophet (PBUH) at which location, before a treaty was finalized?", "opts": ["Badr", "Uhud", "Hudaybiyyah", "Khyber"], "ans": 2, "exp": "Bait-e-Rizwan was the pledge given by Muslims to the Prophet at Hudaybiyyah, just before the Treaty of Hudaybiyyah (6 A.H.) was finalized."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which scholar translated the Quran into Persian and sought to reconcile different schools of thought?", "opts": ["Shah Waliullah", "Maulana Ashraf Ali Thanvi", "Sir Syed Ahmad Khan", "Allama Iqbal"], "ans": 0, "exp": "Shah Waliullah (1703-1762) was a reformist scholar known for translating the Quran into Persian and reconciling different schools of Islamic thought."}, {"section": "Islamic Studies / Civics & Ethics", "q": "In the ranked sources of Islamic law, which comes immediately after the Sunnah?", "opts": ["Qiyas", "Ijma", "Fiqh", "Taqlid"], "ans": 1, "exp": "The ranked order is: Quran (primary), Sunnah (second), Ijma/consensus (third), and Qiyas/analogical reasoning (fourth)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Ushr', the Islamic tax on agricultural produce, is charged at what rate on land irrigated by natural means (rain, rivers)?", "opts": ["2.5%", "5%", "10%", "20%"], "ans": 2, "exp": "Ushr is charged at 10% on land irrigated naturally (rain/rivers), and at 5% ('Nisf-e-Ushr') on land irrigated by artificial, cost-incurring means."}, {"section": "Islamic Studies / Civics & Ethics", "q": "'Zakat-ul-Fitr' (Fitrana) is best described as:", "opts": ["The same as annual wealth Zakat", "A separate obligatory charity paid per household member before Eid-ul-Fitr prayer", "A tax on agricultural produce", "A voluntary charity given any time of year"], "ans": 1, "exp": "Fitrana is a distinct, obligatory charity paid on behalf of each household member before the Eid-ul-Fitr prayer, separate from the annual 2.5% Zakat."}, {"section": "Islamic Studies / Civics & Ethics", "q": "According to Islamic tradition, how many prophets are specifically named in the Quran?", "opts": ["20", "25", "30", "33"], "ans": 1, "exp": "Islamic tradition holds that 25 prophets are specifically named in the Quran, out of a total of 124,000 prophets believed to have been sent to humanity."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The five prophets traditionally identified as 'Ulul Azm' (the most resolute Messengers) include Musa, Isa, Muhammad, Ibrahim, and:", "opts": ["Nuh", "Dawud", "Sulaiman", "Yunus"], "ans": 0, "exp": "The five Ulul Azm prophets are Nuh (Noah), Ibrahim (Abraham), Musa (Moses), Isa (Jesus), and Muhammad (PBUH)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "How many Fard (obligatory) Rakats are there in the Zuhr prayer?", "opts": ["2", "3", "4", "6"], "ans": 2, "exp": "Zuhr prayer has 4 Fard Rakats, along with additional Sunnah and Nafl rakats before and after."}, {"section": "Islamic Studies / Civics & Ethics", "q": "How many Fard (obligatory) Rakats are there in the Maghrib prayer?", "opts": ["2", "3", "4", "6"], "ans": 1, "exp": "Maghrib prayer has 3 Fard Rakats, fewer than Zuhr, Asr, or Isha."}, {"section": "Islamic Studies / Civics & Ethics", "q": "What is the total number of Fard Rakats across all five daily prayers?", "opts": ["15", "17", "19", "20"], "ans": 1, "exp": "Total Fard Rakats = 2 (Fajr) + 4 (Zuhr) + 4 (Asr) + 3 (Maghrib) + 4 (Isha) = 17."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Witr prayer, offered after Isha, is classified as:", "opts": ["Fard (obligatory)", "Wajib", "Sunnah Ghair Muakkadah", "Nafl only"], "ans": 1, "exp": "Witr prayer (3 rakats, typically after Isha) holds the status of Wajib (obligatory in a lesser but still binding sense) in Hanafi jurisprudence."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which Prophet is associated with the title 'Kalim-Allah' (one who spoke with Allah)?", "opts": ["Ibrahim (AS)", "Musa (AS)", "Isa (AS)", "Nuh (AS)"], "ans": 1, "exp": "Prophet Musa (Moses) is known by the title 'Kalim-Allah' due to his direct conversation with Allah, as described in the Quran."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which Prophet is associated with the title 'Khalil-Allah' (the friend of Allah)?", "opts": ["Ibrahim (AS)", "Musa (AS)", "Isa (AS)", "Dawud (AS)"], "ans": 0, "exp": "Prophet Ibrahim (Abraham) is known by the title 'Khalil-Allah', meaning 'the friend of Allah'."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which Prophet is associated with the title 'Ruh-Allah' (a soul from Allah)?", "opts": ["Musa (AS)", "Isa (AS)", "Yunus (AS)", "Dawud (AS)"], "ans": 1, "exp": "Prophet Isa (Jesus) is referred to as 'Ruh-Allah' in Islamic tradition, reflecting his miraculous birth."}];

const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
