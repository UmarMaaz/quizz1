<title>CSS/FPSC MPT Quiz — Real Past Paper (Nov 2025)</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

<script>
const QUESTIONS = [{"section": "Islamic Studies / Civics & Ethics", "q": "In which Surah are the rules of distribution of Mall-e-Ghaneemat (war booty) mentioned?", "opts": ["Sura Anfal", "Sura Toba", "Sura Nisa", "None of These"], "ans": 0, "exp": "Surah Al-Anfal (Ch.8), verse 41, explicitly distributes war spoils (Khums) — one-fifth to Allah, the Prophet , near relatives, orphans, the poor, and the wayfarer. 'Anfal' itself means spoils of war."}, {"section": "Islamic Studies / Civics & Ethics", "q": "In which Surah is the murder of children prohibited in fear of hunger/starvation?", "opts": ["Sura An'am", "Sura Mominoon", "Sura Hujrat", "None of These"], "ans": 0, "exp": "Surah Al-An'am (Ch.6), verse 151, forbids killing children due to fear of poverty, stating Allah provides sustenance for both parents and children. A related prohibition also appears in Surah Al-Isra (17:31)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "In how many Surahs are Haroof-e-Muqatta'at (disjointed letters) found?", "opts": ["20", "25", "29", "None of These"], "ans": 2, "exp": "Haroof-e-Muqatta'at (abbreviated letters/fawatih) appear at the beginning of 29 Surahs of the Holy Quran. Examples: Alif Lam Meem (Al-Baqarah), Ya Seen, Ha Meem. Their precise meaning remains among divine secrets (Mutashabihat)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "How many times is the name 'Muhammad ' directly mentioned in the Holy Quran?", "opts": ["4", "5", "6", "None of these"], "ans": 0, "exp": "The name 'Muhammad ' appears exactly 4 times: Al-Imran (3:144), Al-Ahzab (33:40), Muhammad (47:2), and Al-Fath (48:29). The name 'Ahmad' appears once in As-Saff (61:6). Muhammad specifically = 4 times."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which book of Seerat-e-Rasool  in Urdu is written entirely without dots/points?", "opts": ["Rasool Alam", "Hadi Alam", "Sarwar Alam", "None of These"], "ans": 2, "exp": "'Sarwar Alam' is the famous Seerat book written entirely in undotted (nuqta-free) Urdu letters — a remarkable literary feat. Avoiding dotted letters in Arabic/Urdu script is a traditional form of devotional literary artistry."}, {"section": "Islamic Studies / Civics & Ethics", "q": "For which Surah did the Holy Prophet  say 'it made me old'?", "opts": ["Sura Hood", "Sura Samood", "Sura Aad", "None of These"], "ans": 0, "exp": "The Prophet  said: 'Surah Hood and its sisters have turned my hair grey.' (Tirmidhi). The Surah's vivid description of divine accountability and the Day of Judgment is cited as the reason. The Prophet's hair greyed from contemplating its weight."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Who is the author of the book 'Sunnat Khair-ul-Anam'?", "opts": ["Qazi Salman Mansoorpuri", "Peer Muhammad Karam Shah", "Mufti Muhammad Shafi", "None of These"], "ans": 1, "exp": "'Sunnat Khair-ul-Anam' was authored by Pir Muhammad Karam Shah Al-Azhari (1918–1998), Pakistani Islamic scholar and founder of Dar-ul-Uloom Muhammadiyah Ghausiyah, Bhera. He also wrote the celebrated Urdu Tafseer 'Zia-ul-Quran.'"}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Hadith which is traced all the way back to the Prophet  is called:", "opts": ["Maroof", "Moqoof", "Qudsi", "None of these"], "ans": 3, "exp": "A Hadith traced back continuously to the Prophet  is called 'Marfu'' () — not listed among the options. 'Mauqoof' stops at a Companion; 'Maqtu'' stops at a Tabi'i; 'Qudsi' = divine words narrated by the Prophet in his own words. Correct answer is (D) None of these — it is Marfu'."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Who is called more honorable than the Ka'bah by the Holy Prophet ?", "opts": ["Safa Marwa", "Jable Noor", "Momin (Believer)", "Shaheed"], "ans": 2, "exp": "The Prophet  said while looking at the Ka'bah: 'How great you are — but a believer's sanctity before Allah is even greater!' (Ibn Majah, 3932). This highlights the supreme dignity of a true believer in Islamic theology."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which was the last Ghazwa (battle personally led) of the Holy Prophet ?", "opts": ["Khyber", "Tabook", "Hunain", "None of these"], "ans": 1, "exp": "Ghazwa Tabook (9 AH / 630 CE) was the last military expedition personally led by the Prophet . He led ~30,000 Muslims to confront the Byzantine threat at Tabook in northern Arabia; no battle occurred as Byzantine forces withdrew."}, {"section": "Islamic Studies / Civics & Ethics", "q": "What was the real name of the Holy Prophet's  uncle 'Abu Talib'?", "opts": ["Abdullah", "Abd Munaf", "Abd Kaaba", "None of these"], "ans": 1, "exp": "The real name of Abu Talib was 'Abd Munaf' according to classical Seerat literature (some scholars say 'Imran'). His Kunya (honorific) was Abu Talib — by which he is universally known. He was the paternal uncle and guardian of the Prophet ."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Ghazwa of Hunain was fought against which tribe?", "opts": ["Oass", "Khazraj", "Hawazin", "Knana"], "ans": 2, "exp": "Ghazwa Hunain (8 AH/630 CE), fought shortly after the conquest of Makkah, was against the Hawazin and Thaqeef tribes. Referenced in Surah At-Tawbah (9:25-26). Muslims initially faced difficulty due to an ambush but ultimately triumphed with Allah's help."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Who was the Muslim scientist who first described blood circulation / presented the concept of blood pressure?", "opts": ["Ibn un-Nafees", "Ibn al-Haytham", "Ibn Baitar", "None of These"], "ans": 0, "exp": "Ibn al-Nafees (1213–1288 CE), Syrian physician, first described pulmonary circulation in 'Sharh Tashrih al-Qanun.' His discovery predated William Harvey's European description by over 300 years. He is considered father of circulatory physiology."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Battlefield 'Badar' is situated near the city of:", "opts": ["Makkah", "Jeddah", "Taif", "None of these"], "ans": 3, "exp": "Badr is ~130 km southwest of Madinah in the Hejaz region of Saudi Arabia — not near Makkah, Jeddah, or Taif. The Battle of Badr (2 AH/624 CE) was the first major battle between Muslims and Quraysh. Answer: (D) None of these — it is near Madinah."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Where was the election of Caliph Abu Bakar  held?", "opts": ["House of Abu Bakar ", "Masjid-e-Nabwi", "Masjid-e-Haram", "None of these"], "ans": 3, "exp": "Hazrat Abu Bakar  was selected at Saqeefa Bani Saida — a roofed gathering place of the Bani Sa'idah tribe in Madinah — immediately after the Prophet's  death. Answer: (D) None of these. The correct venue is Saqeefa Bani Saida."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which commander was appointed by the Holy Prophet  and was NOT removed by Hazrat Abu Bakar ?", "opts": ["Usama b. Zaid ", "Khalid b. Waleed ", "Tariq b. Ziyad", "Maaz b. Jabal "], "ans": 0, "exp": "The Prophet  appointed Usama bin Zaid  to lead the Syria expedition. Abu Bakar  famously refused to replace him despite pressure, saying: 'I will not untie a knot that the Prophet  tied.' The expedition proceeded under Usama's command."}, {"section": "Islamic Studies / Civics & Ethics", "q": "In Islamic Jurisprudence books, the Law of Inheritance is called?", "opts": ["Ilm-ul-Fiqh", "Ilm-ul-Asool", "Ilm-ul-Faraiz", "None of These"], "ans": 2, "exp": "Ilm-ul-Faraiz ( ) deals with the law of inheritance (Miras). The Prophet  called it 'half of all knowledge.' It derives from 'Fard' (fixed shares) and is governed primarily by Surah An-Nisa (4:11-12, 176)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "When someone declares his wife equivalent to the back of his mother (a prohibited relation), that act is called:", "opts": ["Khula", "Fela", "Zihar", "None of These"], "ans": 2, "exp": "Zihar (): a man says to his wife 'You are to me like my mother's back' — a pre-Islamic form of oath. Islam deemed it neither divorce nor permissible; the man must pay Kaffarah (expiation). Addressed in Surah Al-Mujadila (58:2-4)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "What is the name of the consensus where scholars of one community silently adopt the ruling of another community without explicitly stating so?", "opts": ["Ijma Sukuti", "Ijma Qolbi", "Ijma Faili", "Ijma Taqriri"], "ans": 0, "exp": "Ijma Sukuti ( ): one scholar issues a ruling and other scholars of the era remain silent — their silence = tacit approval. Weaker form compared to Ijma Sarih (explicit verbal consensus). Widely discussed in Usool al-Fiqh."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Which Sahabi  is declared 'Imam-ul-Fuqaha' (Leader of Jurists)?", "opts": ["Hazrat Ali ", "Abdullah Bin Abbas ", "Maaz Bin Jabal ", "None of These"], "ans": 1, "exp": "Hazrat Abdullah ibn Abbas  (d. 68 AH) — known as 'Hibr-ul-Ummah' and 'Imam-ul-Fuqaha.' The Prophet  prayed: 'O Allah! Teach him religion and grant him understanding of the Quran.' He is the foundational authority for Quranic Tafseer."}, {"section": "English", "q": "SYNONYM for: Scraggly", "opts": ["Gaunt", "Underweight", "Slender", "Spindly"], "ans": 0, "exp": "Scraggly = thin, irregular, unkempt/jagged. Gaunt (thin and bony from hardship) is the closest synonym. Slender implies attractive thinness; underweight is clinical; spindly means long-thin but not unkempt."}, {"section": "English", "q": "SYNONYM for: Catacomb", "opts": ["Oasis", "Haven", "Crypt", "Shrine"], "ans": 2, "exp": "A catacomb is an underground tunnel-cemetery. A crypt (underground room under a church for burials) is the closest synonym. Oasis = fertile area; haven = safe place; shrine = sacred site of worship."}, {"section": "English", "q": "SYNONYM for: Sobriquet", "opts": ["Nickname", "Formal name", "Byname", "Pseudonym"], "ans": 0, "exp": "Sobriquet (French origin) = a nickname or informal name. 'Nickname' is the most direct synonym. A pseudonym is a deliberately assumed false name; byname is a secondary name — sobriquet specifically implies an informal/playful nickname."}, {"section": "English", "q": "SYNONYM for: Metanoia", "opts": ["Repentance", "Conversion", "Prostrate", "Submission"], "ans": 0, "exp": "Metanoia (Greek: µετνοια) = transformative change of heart, repentance. In theology it means deep inward turning from wrong. 'Repentance' is the most precise synonym capturing the internal moral turning that metanoia denotes."}, {"section": "English", "q": "SYNONYM for: Verisimilitude", "opts": ["Realism", "Artifice", "Conceit", "Actuality"], "ans": 0, "exp": "Verisimilitude = the appearance of being true or real; lifelike quality. 'Realism' is the closest synonym. 'Actuality' means real existence (verisimilitude is the appearance of reality, not reality itself). Artifice = deception — opposite."}, {"section": "English", "q": "ANTONYM for: Bastion", "opts": ["Defenseless", "Deformed", "Destroyed", "Demolished"], "ans": 0, "exp": "Bastion = a stronghold or well-defended fortification. Its antonym is 'Defenseless' (without protection). Demolished/destroyed relate to physical destruction, not the concept of defense. Deformed is unrelated."}, {"section": "English", "q": "ANTONYM for: Egregious", "opts": ["Flagrant", "Inconspicuous", "Audacious", "Blunt"], "ans": 1, "exp": "Egregious = outstandingly bad, shockingly conspicuous. Antonym: 'Inconspicuous' (not readily noticeable). Flagrant is a synonym of egregious; audacious = bold; blunt = direct."}, {"section": "English", "q": "ANTONYM for: Melange", "opts": ["Harmonious", "Homogeneous", "Amorphous", "Anomalous"], "ans": 1, "exp": "Melange = a varied mixture/medley of different things. Antonym: 'Homogeneous' (uniform, of the same kind throughout). A melange is diverse/heterogeneous; homogeneous is the direct opposite. Amorphous = shapeless."}, {"section": "English", "q": "ANTONYM for: Solipsist", "opts": ["Self-Centered", "Self-Absorbed", "Selfless", "Self-Stylist"], "ans": 2, "exp": "A solipsist believes only in their own mind's existence — entirely self-centered. Antonym: 'Selfless' (concerned more with others than oneself). Self-centered and self-absorbed are synonyms of solipsist."}, {"section": "English", "q": "ANTONYM for: Lionize", "opts": ["Mistreat", "Vilify", "Lampoon", "Ridicule"], "ans": 1, "exp": "To lionize = to treat someone as a celebrity and give great admiration. Antonym: 'Vilify' (speak or write about someone in an abusively disparaging manner). Lampoon/ridicule involve mockery but don't directly oppose the glorification that lionize entails."}, {"section": "English", "q": "Choose the grammatically CORRECT sentence about a new policy:", "opts": ["The new policy has been implemented, nor has it been communicated to the staff.", "The new policy has been implemented, but it has not been communicated to the staff.", "The new policy has been implemented, yet it has not been communicated to the staff.", "The new policy has been implemented, so it has not been communicated to the staff."], "ans": 1, "exp": "(A) Wrong — 'nor' requires a prior negative clause. (D) 'so' implies consequence — the opposite meaning. (B) correctly uses 'but' to show contrast between two positive facts. (C) 'yet' is possible but less natural; (B) is the standard correct form."}, {"section": "English", "q": "Choose the correct sentence (dangling modifier — walking down the street):", "opts": ["Walking down the street, the trees seemed to sway in the wind.", "Walking down the street, I noticed the trees swaying in the wind.", "Walking down the street, the wind caused the trees to sway.", "Walking down the street, the swaying trees were noticed."], "ans": 1, "exp": "Dangling modifier rule: 'Walking down the street' must attach to the subject that is actually walking. In (A)(C)(D), the subject is trees/wind — none can walk. Only (B) places 'I' as the subject, correcting the dangling modifier."}, {"section": "English", "q": "Choose the correct sentence (parallel structure — company values):", "opts": ["The company values innovation, teamwork, and to take risks.", "The company values innovation, teamwork, and taking risks.", "The company values innovation, teamwork, and risk-taking.", "The company values innovation, teamwork, and risks."], "ans": 1, "exp": "Parallel structure rule: all items in a list must be the same grammatical form. Innovation (noun), teamwork (noun), taking risks (gerund phrase) — (B) maintains parallel form. (A) breaks it with the infinitive 'to take.' (B) is the most naturally parallel answer."}, {"section": "English", "q": "Choose the correct sentence (demonstrative pronouns — restaurants):", "opts": ["These are the best restaurants in town, but those are too expensive.", "This are the best restaurants in town, but those are too expensive.", "These is the best restaurant in town, but those are too expensive.", "This is the best restaurant in town, but those are too expensive."], "ans": 0, "exp": "'These' (plural demonstrative) pairs correctly with 'restaurants' (plural) and 'are' (plural verb). (B) uses 'This' (singular) with plural 'are' — error. (C) uses 'These' with singular 'is' — error. (A) has consistent plural agreement throughout."}, {"section": "English", "q": "Choose the most grammatically and logically correct sentence (wish/hope about life):", "opts": ["I wish I could find a way to make amends and secure a better afterlife.", "I hope that my life will become more exciting in the time I have left.", "I fear that my lack of excitement will lead to a dull eternity.", "I wonder if there's still time to make a positive impact and change my fate."], "ans": 0, "exp": "(A) correctly uses the subjunctive 'wish I could' (expressing a desire about an uncertain situation). It is grammatically precise. The subjunctive mood after 'wish' requires 'could/would/were' — not 'will' or 'may' as in (B)."}, {"section": "English", "q": "Choose the correct sentence (Baudrillard's concern — simulation):", "opts": ["Simulation is Baudrillard's main concern, as even democracy needs exhibitionism and media twisting, authoritarianism is part of it.", "Simulation is Baudrillard's main concern, even democracy needs exhibitionism and media twisting, so authoritarianism is part of it.", "Simulation is Baudrillard's main concern, as democracy needs exhibitionism and media twisting, so authoritarianism is part of it.", "Simulation is Baudrillard's main concern, as even democracy needs exhibitionism and media twisting, because authoritarianism is part of it."], "ans": 0, "exp": "(A) correctly uses 'as' for a causal clause and 'even' to emphasize that democracy too requires simulation. (B) lacks a conjunction before 'even democracy.' (C) drops 'even,' weakening the argument. (D) 'because' distorts logical causality."}, {"section": "English", "q": "Choose the correct sentence (Dalit literature — resistance):", "opts": ["...resistance cannot be achieved by words alone, so the struggle for equality is a noteworthy quest...", "...resistance can be achieved by words alone, so the struggle for equality is a noteworthy quest...", "...resistance cannot be achieved by words alone, but the struggle for equality is a noteworthy quest...", "...resistance cannot be achieved by words alone, and the struggle for equality is a noteworthy quest..."], "ans": 3, "exp": "(D) uses 'and' to add a complementary idea — resistance needs more than words AND the struggle for equality remains noble. (A) 'so' creates false causation. (B) contradicts the premise. (C) 'but' implies contrast where the clauses are actually complementary."}, {"section": "English", "q": "Fill in blanks: 'The emperor advocated the expostulation __ calamities and reanimate officeholders...Yuan Dynasty.'", "opts": ["on, in", "about, in", "at, at", "over, inside"], "ans": 0, "exp": "'Expostulation on calamities' is the correct colocation — 'on' is the formal scholarly preposition for written discourse/commentary on a subject. 'In the Yuan Dynasty' correctly uses 'in' for a historical period. 'About' is informal; 'on' is the precise formal choice."}, {"section": "English", "q": "Fill in blanks: 'The museum is situated both __ the square and __ the library.'", "opts": ["on, beneath", "on, under", "at, underneath", "around, above"], "ans": 1, "exp": "'On the square' is standard idiom for being located at/on a public plaza. 'Under the library' implies physical position below or adjacent. 'Beneath/underneath' are more emphatic/literary; 'at' is less idiomatic for buildings on a named public square."}, {"section": "English", "q": "Fill in blanks: 'The politician's lack of courage reeked __ opportunism...causing supporters __ lose faith...'", "opts": ["off, of", "of, to", "in, in", "away, to"], "ans": 1, "exp": "Fixed collocation: 'reek OF' (one reeks of something — e.g., 'it reeked of corruption'). 'Causing someone TO [verb]' requires 'to' as the infinitive marker. 'Reeked off' is incorrect. Answer: (B) of, to."}, {"section": "English", "q": "'Emit smoke from seven orifices' means:", "opts": ["To be very happy", "To be extremely angry", "To be very sad", "To be very tired"], "ans": 1, "exp": "This is a Chinese idiom ( — q qiào shng yn) meaning to be so furious that smoke pours from all seven facial orifices. It describes extreme rage — equivalent to the English idiom 'fuming' or 'seeing red.'"}, {"section": "English", "q": "'To sell wolf tickets' means:", "opts": ["To be honest and authentic", "To talk tough but not back it up", "To be weak and timid", "To be intelligent and wise"], "ans": 1, "exp": "'Selling wolf tickets' is African-American slang meaning to bluff, brag, or make empty threats — talking tough without ability or intention to follow through. It originated in US prison slang — equivalent to 'all bark and no bite.'"}, {"section": "English", "q": "'The carrots are cooked' means:", "opts": ["The situation is under control", "The situation is hopeless", "The situation is changing", "The situation is improving"], "ans": 1, "exp": "'Les carottes sont cuites' (French) literally means the carrots are cooked — used to mean 'it's all over' / 'the situation is hopeless and cannot change.' Equivalent to 'it's done' in a fatalistic sense; similar to 'the die is cast.'"}, {"section": "English", "q": "'Forty winks' means:", "opts": ["A long, deep sleep", "A short nap or brief period of sleep", "A period of wakefulness", "A dream or vision"], "ans": 1, "exp": "'Forty winks' is a British idiom meaning a short nap or brief daytime sleep. The phrase dates to the 19th century. 'Winks' refers to the closing/opening of eyes. Equivalent to 'catnap' or 'power nap.'"}, {"section": "English", "q": "'As clear as a dumpling broth' means:", "opts": ["Something very clear and easy to understand", "Something completely unclear or confusing", "Something moderately clear", "Something partially clear"], "ans": 1, "exp": "Dumpling broth is typically cloudy and murky — this idiom (like 'clear as mud') means the opposite of clear: completely confusing or opaque. It is a sarcastic/ironic expression — 'as clear as a dumpling broth' = not clear at all."}, {"section": "English", "q": "Passage 1 (Studio/Wotton): The word fitting the blank '...bourdon note of a _______ organ' is:", "opts": ["Peeling", "Jarring", "Intimate", "Distant"], "ans": 3, "exp": "The studio is a tranquil cocoon; London's roar is described as 'dim' — suggesting it is far away and muffled. A 'distant organ' perfectly contrasts the closeness of studio sounds with the faraway urban hum. Passage is from Oscar Wilde's 'The Picture of Dorian Gray.'"}, {"section": "English", "q": "Passage 1: What is the dominant sensory experience?", "opts": ["Visual", "Auditory", "Olfactory", "Tactile"], "ans": 1, "exp": "Despite the opening smell ('rich odor of roses') and visual images, the dominant thread is auditory: 'sweet murmur of the fountain,' 'music of the bees,' 'sullen murmur of the bees,' 'dim roar of London,' 'bourdon note of an organ.' Sound motifs organize the passage's atmosphere."}, {"section": "English", "q": "Passage 1: What is the effect of the 'momentary Japanese effect' created by bird shadows?", "opts": ["It adds to the sense of stillness and calm", "It creates a sense of movement and energy", "It emphasizes the beauty of nature", "It highlights the artificiality of the scene"], "ans": 1, "exp": "The passage states Japanese painters 'seek to convey the sense of swiftness and motion' — this is what the bird shadows achieve. The flickering shadows momentarily break the stillness with kinetic energy, creating transient movement against the static studio backdrop."}, {"section": "English", "q": "Passage 1: Which would be the best title?", "opts": ["The city's beauty and music", "The city's noise and chaos", "A sense of distance and removal", "The city's power and dominance"], "ans": 2, "exp": "The passage establishes the studio as a cocoon apart from London, whose roar is only 'dim.' Lord Henry is cocooned in sensory luxuries isolating him from the city. The dominant theme is sensory withdrawal and removal from the outside urban world — making (C) most apt."}, {"section": "English", "q": "Passage 1: The underlined word 'tremulous' most nearly means:", "opts": ["Trembling", "Torpid", "Wavering", "Infirm"], "ans": 0, "exp": "Tremulous (Latin: tremulus) = shaking, quivering, trembling. In the passage, the laburnum's 'tremulous branches' quiver under the weight of heavy blossoms. 'Wavering' implies uncertainty; 'torpid' = sluggish; 'infirm' = weak. 'Trembling' is the most precise definition."}, {"section": "English", "q": "Passage 2 (Dilly's Deli): If you go to lunch there, you could expect to see:", "opts": ["Couples dining together", "The fire marshal", "A long line of customers", "Homemade pie"], "ans": 2, "exp": "The passage states: 'At lunchtime, Dilly's Deli is so crowded...The line snaked out of the door to the corner.' This directly supports (C). The fire marshal is only mentioned as a hypothetical concern, not an actual sighting."}, {"section": "English", "q": "Passage 2: If you eat lunch at Dilly's Deli, you should expect to:", "opts": ["Be called out by the staff", "Place your order with a waiter at your table", "Dress warmly", "Carry your own food to your table"], "ans": 3, "exp": "The passage implies self-service: the narrator collects food and sits at communal tables. Staff yelled at the reviewer to 'clean up after myself,' indicating no table service — customers carry their own food, self-service style."}, {"section": "English", "q": "Passage 2: Which best illustrates the critic's opinion of the food?", "opts": ["'At Dilly's you sit at one of four long tables.'", "'Dilly's Deli is so crowded, I wondered when the fire marshal had last visited.'", "'After I tasted all the food...one of the people working behind the counter yelled at me to clean up.'", "'Throwing away that plate of food was the most enjoyable part of dining at Dilly's.'"], "ans": 3, "exp": "(D) is the most devastating critique of the food — the reviewer says throwing it away was the most enjoyable part. (A)(B)(C) address ambience, overcrowding, and service — not food quality specifically."}, {"section": "English", "q": "Passage 2: The main purpose of the restaurant review is to:", "opts": ["Tell people about truck drivers at Dilly's Deli.", "Make fun of couples who argue in public.", "Recommend the hamburger steak special.", "Warn people that Dilly's Deli tends to be very crowded."], "ans": 3, "exp": "The review's overarching theme is the restaurant's severe crowding and poor experience — long lines, communal tables, fire marshal reference all convey this. The main takeaway for the reader is to expect crowds and a substandard dining experience."}, {"section": "English", "q": "Passage 2: The role of the 'fire marshal' appears to be:", "opts": ["Checking hygienic conditions.", "Checking overcrowding at public places.", "Ensuring disciplined conduct of staff.", "None of these."], "ans": 1, "exp": "The critic wonders when 'the fire marshal had last visited' — implying the restaurant is so crowded it may be a fire hazard. Fire marshals in the US/UK enforce fire safety compliance, including maximum occupancy limits. The reference implies dangerously excessive capacity."}, {"section": "General Science & Ability", "q": "Evaluate: 4^(1/2) × 4² − 4", "opts": ["24", "28", "31", "None of these"], "ans": 2, "exp": "4^(1/2) = 2; 4² = 16; 4 = 1. Using exponent law: 4^(1/2) × 4² = 4^(1/2+2) = 4^(5/2) = 32. Then 32 − 1 = 31. Answer is (C) 31."}, {"section": "General Science & Ability", "q": "What is k, given that 27 = 9?", "opts": ["1/3", "2/3", "4/3", "None of these"], "ans": 1, "exp": "27 = 9 → (3³) = 3² → 3^(3k) = 3² → 3k = 2 → k = 2/3. Both 27 and 9 are powers of 3 — converting to the same base and equating exponents gives the solution directly."}, {"section": "General Science & Ability", "q": "Cows consume food in 150 days. Remove 10 cows → food lasts 160 days. Original number of cows?", "opts": ["150", "160", "100", "None of these"], "ans": 1, "exp": "Let n = original cows. Total food = 150n. With (n−10) cows for 160 days: 160(n−10) = 150n → 160n − 1600 = 150n → 10n = 1600 → n = 160. Answer: (B) 160."}, {"section": "General Science & Ability", "q": "Train 99m long takes 11 sec to pass a station 231m long. Speed in km/h?", "opts": ["108", "75.6", "30", "None of these"], "ans": 0, "exp": "Total distance = 99+231 = 330m in 11 sec → Speed = 330/11 = 30 m/s. Convert: 30 × 3600/1000 = 108 km/h."}, {"section": "General Science & Ability", "q": "A, B, C share $112. B gets $12 less than A; C gets twice B. How much does C get?", "opts": ["$34", "$44", "$50", "None of these"], "ans": 2, "exp": "Let A=x; B=x−12; C=2(x−12). Sum: x+(x−12)+2(x−12)=112 → 4x−36=112 → x=37. B=25; C=50. Verify: 37+25+50=112 ✓. C gets $50."}, {"section": "General Science & Ability", "q": "Find integer: four times the number subtracted from two times its square = 15.", "opts": ["3", "-3", "-5/3", "None of these"], "ans": 3, "exp": "2x²−4x=15 → 2x²−4x−15=0. Discriminant=16+120=136. No integer solution from quadratic formula. Checking given options: x=3 → 18−12=6≠15; x=−3 → 18+12=30≠15. Answer: (D) None of these. No integer solution exists."}, {"section": "General Science & Ability", "q": "Zaid is 6× as old as Zoya now. In 7 years, sum of ages = 49. How old was Zaid when Zoya was born?", "opts": ["25", "35", "42", "None of these"], "ans": 0, "exp": "Let Zoya=z; Zaid=6z. In 7 yrs: (6z+7)+(z+7)=49 → 7z=35 → z=5. Zoya=5 now; Zaid=30 now. When Zoya was born (5 yrs ago): Zaid was 30−5=25."}, {"section": "General Science & Ability", "q": "Two consecutive positive numbers: sum of squares = 7 less than 120. Find them.", "opts": ["7, 8", "8, 9", "7, 9", "None of these"], "ans": 0, "exp": "Sum of squares = 120−7 = 113. Check 7,8: 49+64=113 ✓. Check 8,9: 64+81=145 ✗. Answer: 7 and 8."}, {"section": "General Science & Ability", "q": "Shop sold 25% of lights; 1,500 remain. How many originally?", "opts": ["2500", "2250", "2000", "None of these"], "ans": 2, "exp": "If 25% sold, 75% remain. 75% of total = 1500 → Total = 1500/0.75 = 2000. Answer: (C) 2000."}, {"section": "General Science & Ability", "q": "Given x² − 11x + 10 = 0, then x is:", "opts": ["−1, −10", "−1, +10", "+1, −10", "None of these (+1, +10)"], "ans": 3, "exp": "Factor: (x−1)(x−10)=0 → x=1 or x=10. Verify: 1−11+10=0 ✓; 100−110+10=0 ✓. Roots are +1 and +10. Answer: (D) None of these — correct roots are +1 and +10."}, {"section": "General Science & Ability", "q": "5 markers + 1 pencil = Rs.245; 3 markers + 3 pencils = Rs.327. Cost of one marker?", "opts": ["Rs. 32", "Rs. 34", "Rs. 74", "None of these"], "ans": 1, "exp": "5m+p=245 → p=245−5m. m+p=109 (dividing eq2 by 3). m+(245−5m)=109 → 245−4m=109 → 4m=136 → m=Rs.34. Verify: p=75; 5(34)+75=245 ✓; 3(34)+3(75)=327 ✓."}, {"section": "General Science & Ability", "q": "Sequence: T1=1, T2=5. From T3, each term = arithmetic mean of all preceding. What is the 27th term?", "opts": ["2.5", "3", "5.5", "None of these"], "ans": 1, "exp": "T3=(1+5)/2=3. T4=(1+5+3)/3=3. From T3 onwards, each new term equals 3 (the running average stabilizes). So the 27th term = 3."}, {"section": "General Science & Ability", "q": "Small cake=$x; large cake=$(2x+3). 3 small + 2 large = $16.36. Cost of one small?", "opts": ["$1.91", "$1.48", "$2.34", "None of these"], "ans": 1, "exp": "3x+2(2x+3)=16.36 → 7x+6=16.36 → 7x=10.36 → x=$1.48. Verify: 3(1.48)+2(2.96+3)=4.44+11.92=16.36 ✓. Answer: (B) $1.48."}, {"section": "General Science & Ability", "q": "If one angle of an isosceles triangle is 68°, possible values of the second angle are:", "opts": ["Any value between 68° and 180°", "Any value between 68° and 112°", "Any value between 1° and 112°", "None of these"], "ans": 3, "exp": "If 68° is base angle: other base=68°, apex=44°. If 68° is apex: each base=(180−68)/2=56°. So second angle is specifically 68° or 44° or 56° — not any range. Answer: (D) None of these — specific values apply."}, {"section": "General Science & Ability", "q": "Total perimeter of a semicircle is 20.6 cm. Approximate radius?", "opts": ["4 cm", "5 cm", "6.6 cm", "None of these"], "ans": 0, "exp": "Perimeter = r(π+2). 20.6=r(5.1416) → r=20.6/5.1416≈4.005≈4 cm. Answer: (A) 4 cm."}, {"section": "General Science & Ability", "q": "Water tank (cuboid): length 1.5m, width 1.0m, depth 60cm. How many litres?", "opts": ["900 litres", "90 litres", "90 litres", "None of these"], "ans": 0, "exp": "Volume=1.5×1.0×0.6=0.9 m³. 1 m³=1000 litres. 0.9×1000=900 litres. Answer: (A) 900 litres."}, {"section": "General Science & Ability", "q": "Inner circumference of circular race track = 440m. Width = 14m. Radius of outer circle?", "opts": ["70m", "77m", "84m", "None of these"], "ans": 2, "exp": "Inner radius: 2πr=440 → r=440/(2×22/7)=70m. Outer radius=70+14=84m. Answer: (C) 84m."}, {"section": "General Science & Ability", "q": "200 people: 90 like tennis, 108 like cricket, 46 like both. How many like neither?", "opts": ["44", "48", "62", "None of these"], "ans": 1, "exp": "Union=90+108−46=152. Neither=200−152=48. Answer: (B) 48."}, {"section": "General Science & Ability", "q": "450 visitors on Mondays, 120 on other 6 days. 30-day month starting Monday. Daily average?", "opts": ["164", "160", "175", "None of these"], "ans": 2, "exp": "30-day month starting Monday has 5 Mondays (days 1,8,15,22,29) and 25 other days. Total=5×450+25×120=2250+3000=5250. Average=5250/30=175. Answer: (C) 175."}, {"section": "General Science & Ability", "q": "A is B's daughter; C is B's mother; D is B's sister; E is D's son. How is A related to E?", "opts": ["Uncle", "Grand daughter", "Cousin", "None of these"], "ans": 2, "exp": "B's daughter=A. B's sister=D. D's son=E. A's parent (B) and E's parent (D) are siblings → A and E are first cousins. Answer: (C) Cousin."}, {"section": "General Science & Ability", "q": "'I have no brother, and that girl's father is my father's son.' Whose photograph was it?", "opts": ["His father", "His own", "His daughter", "None of these"], "ans": 2, "exp": "No brother → 'my father's son' = the man himself. 'That girl's father is [the man]' → the girl is his daughter. Photograph is of his daughter."}, {"section": "General Science & Ability", "q": "Bus every 52 min. Last bus 16 min ago; next at 08:15pm. What time did the officer speak?", "opts": ["07:23 pm", "07:39 pm", "07:49 pm", "None of these"], "ans": 1, "exp": "Next bus 08:15pm. Previous bus: 08:15−52min=07:23pm. Officer says bus left 16 min ago → current time=07:23+16=07:39pm. Verify: 07:39+36min=08:15 ✓ (52−16=36 min remaining)."}, {"section": "General Science & Ability", "q": "Pearl>Sky; Ocean>Pearl; Ocean=MCB; Bahria>Pearl. Which is 2nd shortest?", "opts": ["Pearl Tower", "Sky Tower", "Ocean Tower", "None of these"], "ans": 0, "exp": "Sky is shortest (Pearl>Sky). Pearl is second shortest (Pearl>Sky, but Pearl"}, {"section": "General Science & Ability", "q": "Peter East of Tom. Tom North of John. Mike South of John. Mike is in which direction of Peter?", "opts": ["South-East", "South-West", "South", "None of these"], "ans": 1, "exp": "Peter=East of Tom; Tom=North of John; Mike=South of John (even further south). Peter is East+North relative to Mike. Therefore Mike is South-West of Peter."}, {"section": "General Science & Ability", "q": "Schedule (G after H, K before G, M before L, M adj. J): If Literature before Kinetics, History is in position:", "opts": ["First", "Third", "Fifth", "None of these"], "ans": 2, "exp": "Constraints: H-G consecutive; K before G; M before L; M adj J. If L before K: valid order = L,M,J,K,H,G. History (H) is in position 5. All constraints satisfied with Literature (1st) earlier than Kinetics (4th)."}, {"section": "General Science & Ability", "q": "Six girls in circle: R between N&S; P next left of V; R 4th right of P. Position of T?", "opts": ["Immediate right of V", "Second to left of P", "Second to right of R", "None of these"], "ans": 0, "exp": "Placing: P,V,_,_,R,_ in circle (R is 4th right of P). R between N and S: order P,V,N,S,R,T or P,V,S,N,R,T. T fills the 6th spot. T is immediately to the right of V in the circular arrangement. Answer: (A)."}, {"section": "General Science & Ability", "q": "Roni: 100m in 45 sec; Willy: 100m in 36 sec. Willy beats Roni by how much distance?", "opts": ["20m", "22.5m", "25m", "None of these"], "ans": 0, "exp": "When Willy finishes (36 sec), Roni has run=(100/45)×36=80m. Willy at 100m, Roni at 80m. Willy beats by 20m. Answer: (A) 20m."}, {"section": "General Science & Ability", "q": "Sequence: a, 13, 9, 3, −5, −15, b. Find a and b.", "opts": ["15, −25", "15, −27", "16, −28", "None of these"], "ans": 1, "exp": "Differences: −4,−6,−8,−10 (decreasing by 2 each time). First difference=13−a=−2 → a=15. Next difference after −10 = −12: b=−15+(−12)=−27. Answer: (B) 15, −27."}, {"section": "General Science & Ability", "q": "Sum of prime numbers less than 21?", "opts": ["58", "64", "77", "None of these"], "ans": 2, "exp": "Primes <21: 2,3,5,7,11,13,17,19. Sum=2+3+5+7+11+13+17+19=77. Answer: (C) 77."}, {"section": "General Science & Ability", "q": "Old generation (born 1965–1981) can do tasks independently; called Entrepreneurial generation. Logical conclusion?", "opts": ["They have a natural tendency of being self-employed", "They work harder than any recent generation", "They require some assistance to do tasks", "None of these"], "ans": 0, "exp": "'Entrepreneurial generation' + 'do most tasks independently' directly implies self-employment tendency. (B) is a comparison not stated in the premise. (C) contradicts 'independently.' The label 'Entrepreneurial' logically supports (A)."}, {"section": "General Science & Ability", "q": "Evaluate: 3(−4 × 5 − 6)", "opts": ["12", "−78", "−15", "None of these"], "ans": 1, "exp": "Inside bracket: −4×5=−20; −20−6=−26. Then: 3×(−26)=−78. Answer: (B) −78."}, {"section": "General Science & Ability", "q": "Arrange smallest to largest: (i)(0.5)² (ii)0.5 (iii)(0.5)³ (iv)0.5", "opts": ["iv, ii, i, iii", "iii, i, ii, iv", "ii, i, iii, iv", "None of these"], "ans": 1, "exp": "Values: (i)0.25; (ii)0.5; (iii)0.125; (iv)0.5≈0.794. Ascending: 0.125<0.25<0.5<0.794 → iii, i, ii, iv. Answer: (B)."}, {"section": "General Science & Ability", "q": "200 trees in 30 days (group 1). After removing 20 workers, 200 trees in 40 days. Original group size?", "opts": ["60", "70", "80", "None of these"], "ans": 2, "exp": "Work=workers×days. 30n=40(n−20) → 30n=40n−800 → 10n=800 → n=80. Answer: (C) 80 workers."}, {"section": "General Science & Ability", "q": "Noon temperature in Murree: 16.6°C. Midnight is 20.4°C lower. Midnight temperature?", "opts": ["−4.8°C", "−4.2°C", "−3.8°C", "None of these"], "ans": 2, "exp": "16.6−20.4=−3.8°C. Answer: (C) −3.8°C."}, {"section": "General Science & Ability", "q": "Roni has 25 sweets; Tony has 55. How many should Roni give Tony so Tony has 4× Roni?", "opts": ["5", "7", "9", "None of these"], "ans": 2, "exp": "Let Roni give x sweets. Tony:55+x; Roni:25−x. Condition: 55+x=4(25−x) → 55+x=100−4x → 5x=45 → x=9. Verify: Tony=64; Roni=16; 64=4×16 ✓. Answer: (C) 9."}, {"section": "General Science & Ability", "q": "Divide 45 into two parts such that 4× one part is 9 less than 5× the other.", "opts": ["20, 25", "21, 24", "19, 26", "None of these"], "ans": 1, "exp": "Let parts=x and 45−x. 4x=5(45−x)−9 → 4x=225−5x−9 → 9x=216 → x=24. Parts: 24 and 21. Verify: 4×24=96; 5×21−9=96 ✓. Answer: (B) 21, 24."}, {"section": "General Science & Ability", "q": "Man is 5× as old as son now. 4 years ago, product of ages = 52. Present ages?", "opts": ["8 and 40", "7 and 35", "6 and 30", "None of these"], "ans": 2, "exp": "Son=s; Father=5s. 4 yrs ago: (5s−4)(s−4)=52 → 5s²−24s+16=52 → 5s²−24s−36=0. Discriminant=576+720=1296. s=(24+36)/10=6. Son=6, Father=30. Verify: (30−4)(6−4)=26×2=52 ✓. Answer: (C) 6 and 30."}, {"section": "General Science & Ability", "q": "John is 4 yrs older than David; Joe is 2 yrs younger than David. Sum=44. How old will John be in 8 years?", "opts": ["24", "25", "17", "None of these"], "ans": 3, "exp": "David=d; John=d+4; Joe=d−2. Sum: (d+4)+d+(d−2)=44 → 3d+2=44 → d=14. John now=18. In 8 yrs=26. Answer: (D) None of these — John will be 26."}, {"section": "General Science & Ability", "q": "Integer values of n given −7 < 4n ≤ 8?", "opts": ["−1, 0, 1, 2", "−2, −1, 0, 1, 2", "−6 to 8", "None of these"], "ans": 0, "exp": "Divide by 4: −7/4 < n ≤ 2 → −1.75 < n ≤ 2. Integer values: −1, 0, 1, 2. Answer: (A)."}, {"section": "General Science & Ability", "q": "Student spends 15% on food, 45% on tuition. Then 50% of remaining on hostel. Left: Rs.8000. Scholarship?", "opts": ["32,000", "40,000", "45,000", "None of these"], "ans": 1, "exp": "After food+tuition (60%): remaining=40%. After hostel (50% of 40%=20%): left=20%. 20% of total=8000 → Total=Rs.40,000. Answer: (B)."}, {"section": "General Science & Ability", "q": "Find a²+b², when a+b=5 and ab=6.", "opts": ["37", "25", "13", "None of these"], "ans": 2, "exp": "(a+b)²=a²+2ab+b². So a²+b²=(a+b)²−2ab=25−12=13. Answer: (C) 13."}, {"section": "General Science & Ability", "q": "y=x²+8x−5 written as (x+a)²+b. Find a.", "opts": ["8", "5", "4", "None of these"], "ans": 2, "exp": "Complete the square: x²+8x−5=(x+4)²−16−5=(x+4)²−21. So a=4, b=−21. Answer: (C) 4."}, {"section": "General Science & Ability", "q": "Find x when A=(2π+y)x², where A=36 and y=2.77.", "opts": ["3", "4", "2", "None of these"], "ans": 2, "exp": "36=(2π+2.77)x²=(6.2832+2.77)x²=9.0532x² → x²=36/9.0532≈3.977 → x≈1.99≈2. Answer: (C) 2."}, {"section": "General Science & Ability", "q": "Child ticket=adult−Rs.240. 18,500 adults+2,500 children. Total=Rs.41,440,000. Adult ticket price?", "opts": ["Rs. 2460", "Rs. 1940", "Rs. 2000", "None of these"], "ans": 2, "exp": "18500a+2500(a−240)=41,440,000 → 21000a=41,440,000+600,000=42,040,000 → a≈Rs.2002≈Rs.2000. Answer: (C) Rs. 2000."}, {"section": "General Science & Ability", "q": "Name the regular polygon with exterior angle 36°.", "opts": ["Pentagon", "Hexagon", "Decagon", "None of these"], "ans": 2, "exp": "Number of sides=360/36=10. A 10-sided polygon is a Decagon. Answer: (C) Decagon."}, {"section": "General Science & Ability", "q": "Perimeter of semicircle lake with radius 700m?", "opts": ["127.4 km", "3.6 km", "2.9 km", "None of these"], "ans": 1, "exp": "Perimeter=r(π+2)=700×(3.1416+2)=700×5.1416=3599m≈3.6 km. Answer: (B) 3.6 km."}, {"section": "General Science & Ability", "q": "Total surface area of cylinder with radius 3.5cm and height 5.5cm?", "opts": ["211.5 cm²", "198 cm²", "121 cm²", "None of these"], "ans": 1, "exp": "TSA=2πr(h+r)=2×(22/7)×3.5×(5.5+3.5)=2×22×0.5×9=198 cm². Answer: (B) 198 cm²."}, {"section": "General Science & Ability", "q": "30 bicycles: 27 passed lights, 21 passed brakes, 1 failed both. How many passed both?", "opts": ["19", "21", "20", "None of these"], "ans": 0, "exp": "Let x=passed both. (27−x)+(21−x)+x+1=30 → 49−x=30 → x=19. Answer: (A) 19."}, {"section": "General Science & Ability", "q": "Box: 8 red, 6 green, 7 blue toys. Probability of picking neither red nor green?", "opts": ["7/21", "14/21", "7/14", "None of these"], "ans": 0, "exp": "Total=21. Neither red nor green=blue=7. P=7/21=1/3. Answer: (A) 7/21."}, {"section": "General Science & Ability", "q": "P is brother of Q and R. S is mother of R. T is father of P. Which statement is NOT exactly true?", "opts": ["T is Q's father", "P is S's son", "S is P's mother", "Q is T's son"], "ans": 3, "exp": "T is father of P→also Q's and R's father (A ✓). S is mother of R→also P's and Q's mother (B ✓; C ✓). (D) 'Q is T's son' — Q's gender not specified. Q could be a daughter. 'Son' is not exactly true as stated. Answer: (D)."}, {"section": "General Science & Ability", "q": "Dictionary order: 1.Apparent 2.Apostate 3.Appoint 4.Apparel", "opts": ["2,1,4,3", "2,3,4,1", "1,4,3,2", "2,4,1,3"], "ans": 3, "exp": "Apo- comes before App-: Apostate(2) first. Then App-: Appar-e-l(4) before Appar-e-n-t(1) (l"}, {"section": "General Science & Ability", "q": "Salma>Mehak only; Adil>Badar>Dawood. Who has the highest amount?", "opts": ["Badar", "Dawood", "Adil", "None of these"], "ans": 2, "exp": "Adil>Badar>Dawood. Salma has more than only Mehak → 4th in overall ranking. Order: Adil>Badar>Dawood>Salma>Mehak. Adil has the highest amount."}, {"section": "General Science & Ability", "q": "B", "opts": ["D", "E", "C", "None of these"], "ans": 1, "exp": "Combining: B"}, {"section": "General Science & Ability", "q": "Given: PQS, QRT, RSU, STV... What follows?", "opts": ["TUV", "SUV", "STU", "None of these"], "ans": 0, "exp": "Pattern in each triplet: 1st letters P,Q,R,S→T; 2nd letters Q,R,S,T→U; 3rd letters S,T,U,V→V. Next triplet: T,U,V. Answer: (A) TUV."}, {"section": "General Science & Ability", "q": "Clock at 6:00pm: hour hand points NE. Where does minute hand point at 9:15pm?", "opts": ["South-East", "North-West", "South-West", "None of these"], "ans": 2, "exp": "At 6:00pm, hour hand (at 6 o'clock position) points NE → clock's 6=NE. At 9:15pm, minute hand points at 3 (15 min). Clock's 3 is directly opposite to 9. Clock's 9=SW (opposite of NE). So minute hand points SW. Answer: (C)."}, {"section": "General Science & Ability", "q": "Boxes: 20kg, 30kg, 50kg, 70kg. Which combination weight is impossible?", "opts": ["170 kg", "160 kg", "150 kg", "None of these"], "ans": 1, "exp": "All possible combinations: singles(20,30,50,70), pairs(50,60,70,80,90,100,120), triples(100,120,140,150), all four(170). 160 kg cannot be made from any combination. Answer: (B) 160 kg."}, {"section": "General Science & Ability", "q": "Number 5109238674: positions 1↔6, 2↔7, 3↔8, 4↔9, 5↔10 interchanged. 3rd digit from right?", "opts": ["9", "0", "6", "None of these"], "ans": 1, "exp": "Original: 5(1)1(2)0(3)9(4)2(5)3(6)8(7)6(8)7(9)4(10). After swap: pos1←3, pos2←8, pos3←6, pos4←7, pos5←4, pos6←5, pos7←1, pos8←0, pos9←9, pos10←2. New number: 3867451092. Right to left: 2(1st), 9(2nd), 0(3rd). 3rd from right=0. Answer: (B) 0."}, {"section": "General Science & Ability", "q": "16 men+12 women complete work in 20 days. 18 women complete same work in 40 days. Days for 12 men+27 women?", "opts": ["16", "18", "21", "None of these"], "ans": 0, "exp": "1 woman's work/day=1/(18×40)=1/720. From eq1: 16M+12W=1/20. 12W=12/720=1/60. 16M=1/20−1/60=2/60=1/30 → 1M=1/480. 12M+27W=12/480+27/720=1/40+3/80=5/80=1/16. Days=16. Answer: (A) 16."}, {"section": "General Science & Ability", "q": "Capsule Vitamin C doesn't have same effect as fresh fruit Vitamin C. What logically follows?", "opts": ["Only (i): Sale of capsule Vitamin C should be banned.", "Only (ii): People should eat fresh fruits and vegetables for Vitamin C.", "Neither (i) nor (ii) follows.", "Both (i) and (ii) follow."], "ans": 1, "exp": "(i) Banning capsule Vitamin C is extreme — the statement says it's less beneficial, not harmful. Banning is not a logical conclusion. (ii) Encouraging fresh fruits is a direct, moderate, and logical conclusion from the research finding. Only (ii) follows."}, {"section": "General Science & Ability", "q": "Next term in the series: 11, 20, 38, 56, 83?", "opts": ["108", "116", "127", "None of these"], "ans": 3, "exp": "Differences: 9, 18, 18, 27. Pattern: differences increase by 9 every alternate step (+9,+18,+18,+27,+27...). Next difference=27 → 83+27=110. Answer: (D) None of these — the next term is 110."}, {"section": "General Science & Ability", "q": "If output voltage > input voltage, the transformer is:", "opts": ["Step up", "Step down", "Faulty", "None of these"], "ans": 0, "exp": "A step-up transformer increases voltage from primary (input) to secondary (output) coil by having more turns in the secondary. Vout/Vin=Nsecondary/Nprimary. Higher output voltage = step-up transformer."}, {"section": "General Science & Ability", "q": "The voltage signal generated by a microphone is called:", "opts": ["Digital", "Analogue", "Hybrid", "None of these"], "ans": 1, "exp": "A microphone converts sound waves into continuous electrical signals — these are analogue signals varying continuously in amplitude and frequency, mirroring the original sound. Digital signals are discrete (0s and 1s), produced only after ADC conversion."}, {"section": "General Science & Ability", "q": "Third most common gas in air we breathe is:", "opts": ["Hydrogen", "Neon", "Argon", "None of these"], "ans": 2, "exp": "Atmospheric composition: Nitrogen (78%), Oxygen (21%), Argon (0.93%), CO (0.04%). Argon, a noble gas, is the third most abundant gas in Earth's atmosphere."}, {"section": "General Science & Ability", "q": "Electromagnetic radiation with maximum wavelength is:", "opts": ["Ultraviolet", "Radio waves", "Infrared", "None of these"], "ans": 1, "exp": "In the electromagnetic spectrum, radio waves have the longest wavelength (up to thousands of meters) and the lowest frequency. Order (shortest to longest wavelength): Gamma→X-ray→UV→Visible→Infrared→Microwave→Radio."}, {"section": "General Science & Ability", "q": "The most dangerous type of radiation is:", "opts": ["Alpha radiation", "Beta radiation", "Gamma radiation", "None of these"], "ans": 2, "exp": "Gamma radiation is the most penetrating ionizing radiation — it can pass through the human body and requires lead or thick concrete to block. Alpha is stopped by skin; beta by thin aluminum. Gamma causes DNA damage and cancer from external exposure."}, {"section": "General Science & Ability", "q": "Solar energy is radiated in the form of:", "opts": ["Electromagnetic waves", "Transverse waves", "Infrared waves", "None of these"], "ans": 0, "exp": "Solar energy is radiated as electromagnetic waves — covering the entire electromagnetic spectrum (visible light, UV, infrared, X-rays, etc.). While EM waves are also transverse, (A) is the more comprehensive and scientifically precise answer."}, {"section": "General Science & Ability", "q": "The study of human body cells is called:", "opts": ["Physiology", "Cytology", "Mycology", "None of these"], "ans": 1, "exp": "Cytology (from Greek 'kytos'=cell) is the branch of biology dealing with cell structure and function. Physiology studies organism functions; Mycology studies fungi; Histology studies tissues. Cytology is correct."}, {"section": "General Science & Ability", "q": "Excessive bleeding during injury is due to deficiency of:", "opts": ["Vitamin B", "Vitamin K", "Vitamin E", "None of these"], "ans": 1, "exp": "Vitamin K is essential for blood clotting. It activates coagulation factors II, VII, IX, and X. Deficiency leads to impaired clotting and excessive bleeding. 'K' comes from German 'Koagulation.' Warfarin (blood thinner) works by inhibiting Vitamin K."}, {"section": "General Science & Ability", "q": "Which fuel is used in gas welding?", "opts": ["Acetylene", "Methane", "Ethylene", "None of these"], "ans": 0, "exp": "Oxy-acetylene welding uses acetylene (CH) combined with oxygen, producing a flame of ~3500°C — hot enough to melt steel. Acetylene stored dissolved in acetone produces the hottest and most concentrated flame of any fuel gas."}, {"section": "General Science & Ability", "q": "Drum printers belong to which category?", "opts": ["Ink jet printer", "Laser printer", "Line printer", "None of these"], "ans": 2, "exp": "Drum printers are a type of line printer — they print an entire line at once using a rotating drum with characters embossed on its surface. They are impact printers, fast for their era. Line printers include drum, chain, and band types."}, {"section": "General Science & Ability", "q": "Machine learning is a sub-area of:", "opts": ["Hardware Engineering", "Artificial Intelligence", "Cyber Forensics", "None of these"], "ans": 1, "exp": "Machine Learning (ML) is a subset of Artificial Intelligence (AI) that enables systems to learn from data without being explicitly programmed. Hierarchy: AI ⊃ Machine Learning ⊃ Deep Learning."}, {"section": "General Science & Ability", "q": "Which can be classified as a renewable energy source?", "opts": ["Geothermal energy", "Tidal energy", "Biomass energy", "All of these"], "ans": 3, "exp": "All three are renewable: Geothermal uses Earth's continuously replenished internal heat. Tidal uses gravitational forces of Moon/Sun (inexhaustible). Biomass is organic material that can be continuously grown. All qualify under international energy classifications."}, {"section": "General Science & Ability", "q": "How do scientists know Earth's core is made of metal?", "opts": ["Density of surface layer is much less than Earth's average density.", "Earth's rotation speed indicates core structure.", "Density of surface layer is greater than total density.", "None of these"], "ans": 0, "exp": "Earth's surface rocks average ~2.7–3 g/cm³, but Earth's average density is ~5.5 g/cm³. This discrepancy means the interior must contain much denser material — consistent with an iron-nickel metallic core (~10–13 g/cm³). Seismic waves confirm the structure."}, {"section": "General Science & Ability", "q": "Maintenance of soil fertility without extra nutrition is due to:", "opts": ["Floods", "Crop residue", "Microbial activity", "None of these"], "ans": 2, "exp": "Soil microorganisms (bacteria, fungi, actinomycetes) break down organic matter, fix atmospheric nitrogen, and cycle nutrients — naturally maintaining fertility. Nitrogen-fixing bacteria (Rhizobium, Azotobacter) convert N to plant-available forms without fertilizers."}, {"section": "General Science & Ability", "q": "Nanocomposite materials prevent packaged food damage due to:", "opts": ["Oxygen", "Carbon dioxide", "Moisture", "All of these"], "ans": 3, "exp": "Nanocomposite packaging (e.g., clay nanocomposites) provides barrier properties against oxygen, moisture, and gases including CO. They improve shelf life by blocking gas permeation via tortuous path mechanisms. Used in beer bottles, food wraps, and meat packaging."}, {"section": "General Science & Ability", "q": "Which statement about vitamins is TRUE?", "opts": ["Water-soluble vitamins cannot be stored in the body", "Fat-soluble vitamins can be stored in the body", "Body can absorb more of fat-soluble vitamins than required", "All of these"], "ans": 3, "exp": "All three are true. (A) Water-soluble (C, B-complex) vitamins are excreted in urine and not stored. (B) Fat-soluble (A,D,E,K) vitamins are stored in liver and fatty tissues. (C) Excess fat-soluble vitamins accumulate, potentially causing toxicity (hypervitaminosis A or D)."}, {"section": "Current Affairs", "q": "Global agreement signed in 2015 to limit warming to well below 2°C above pre-industrial levels?", "opts": ["Kyoto Protocol", "Paris Agreement", "Copenhagen Accord", "None of these"], "ans": 1, "exp": "The Paris Agreement was adopted at COP21 in December 2015 (entered into force November 2016). Goal: limit temperature rise to well below 2°C (pursuing 1.5°C). 196 parties signed it. The Kyoto Protocol (1997) was its predecessor."}, {"section": "Current Affairs", "q": "Which organization is responsible for the B3W (Build Back Better World) Initiative?", "opts": ["United Nations (UN)", "Group of Seven (G7)", "NATO", "None of these"], "ans": 1, "exp": "B3W was launched by the G7 at the Cornwall Summit (June 2021) as a high-standard infrastructure partnership for developing nations. It was later rebranded as the 'Partnership for Global Infrastructure and Investment' (PGII) in 2022."}, {"section": "Current Affairs", "q": "How many points were in China's 2023 Peace Plan for Ukraine?", "opts": ["6", "10", "12", "None of these"], "ans": 2, "exp": "China's 12-point peace plan for Ukraine was released on February 24, 2023 (exactly one year after Russia's invasion). It called for ceasefire, peace talks, opposition to nuclear threats, and rejection of unilateral sanctions."}, {"section": "Current Affairs", "q": "What describes the use of information warfare and disinformation to undermine other countries?", "opts": ["Soft power", "Sharp power", "Smart power", "None of these"], "ans": 1, "exp": "'Sharp power' was coined by the National Endowment for Democracy (2017) to describe authoritarian states' use of manipulation and disinformation — as opposed to 'soft power' (attraction) or 'hard power' (coercion). China and Russia are frequently cited examples."}, {"section": "Current Affairs", "q": "RCEP is a free trade agreement among nations of:", "opts": ["North America", "Europe", "Asia-Pacific", "None of these"], "ans": 2, "exp": "RCEP (signed November 2020, effective January 2022) is the world's largest FTA comprising 15 Asia-Pacific nations: 10 ASEAN members + China, Japan, South Korea, Australia, and New Zealand. Covers ~30% of global GDP. India withdrew in 2019."}, {"section": "Current Affairs", "q": "The AIIB was established by:", "opts": ["Asian Development Bank", "ASEAN", "Group of Seven (G7) countries", "China and some other Asian countries"], "ans": 3, "exp": "AIIB was proposed by China in 2013, established in 2015, with headquarters in Beijing. Began operations January 2016. China is the largest shareholder. Conceived as a China-led alternative to the World Bank and ADB, now with 109 approved members."}, {"section": "Current Affairs", "q": "What does the 'I2-U2' alliance stand for?", "opts": ["India-Israel-Ukraine-US", "India-Israel-US-UAE", "Italy-Israel-Ukraine-UK", "None of these"], "ans": 1, "exp": "I2U2 (West Asia Quad) comprises India, Israel, UAE, and the United States. Formally launched July 2022. Focuses on joint investments in water, energy, transportation, space, health, and food security across the Middle East and South Asia."}, {"section": "Current Affairs", "q": "'G-2 or Group of Two' is an informal diplomacy between:", "opts": ["Germany and Greece", "US and China", "Germany and Ghana", "None of these"], "ans": 1, "exp": "The G-2 concept refers to bilateral diplomacy between the United States and China — the world's two largest economies. Proposed by economist Fred Bergsten in 2008, suggesting US-China cooperation is essential for managing global challenges."}, {"section": "Current Affairs", "q": "Which country hosted the SCO Foreign Ministers Council meeting in 2023?", "opts": ["China", "India", "Uzbekistan", "None of these"], "ans": 1, "exp": "India held the SCO Chairmanship 2022–2023. The SCO Council of Foreign Ministers meeting was held in Goa, India, in May 2023. The SCO Summit was held virtually in July 2023, also chaired by India."}, {"section": "Current Affairs", "q": "BRI consists of the Silk Road Economic Belt and:", "opts": ["The Desert Oasis Corridor", "The Himalayan Trade Route", "The 21st Century Maritime Silk Road", "None of these"], "ans": 2, "exp": "China's BRI (announced 2013) has two pillars: (1) The Silk Road Economic Belt — overland routes via Central Asia; (2) The 21st Century Maritime Silk Road — sea routes through Southeast Asia, South Asia, Africa, and Europe. CPEC is one of BRI's six economic corridors."}, {"section": "Current Affairs", "q": "When was 'Made in China 2025' initiated?", "opts": ["2010", "2015", "2020", "None of these"], "ans": 1, "exp": "'Made in China 2025' was announced by Premier Li Keqiang in May 2015. It aims to upgrade manufacturing in 10 high-tech sectors (robotics, AI, semiconductors, aerospace) by 2025. Modeled on Germany's 'Industrie 4.0.'"}, {"section": "Current Affairs", "q": "Djibouti is strategically located at the mouth of which sea?", "opts": ["Mediterranean Sea", "South China Sea", "Red Sea", "None of these"], "ans": 2, "exp": "Djibouti is at the southern entrance of the Red Sea at the Bab-el-Mandeb strait — one of the world's most strategic chokepoints. Multiple nations (US, France, China, Japan) maintain military bases there."}, {"section": "Current Affairs", "q": "The Horn of Africa (HoA) is located in which part of Africa?", "opts": ["Eastern Africa", "Western Africa", "Northern Africa", "None of these"], "ans": 0, "exp": "The Horn of Africa is a peninsula in Northeast/Eastern Africa jutting into the Arabian Sea. It includes Djibouti, Eritrea, Ethiopia, and Somalia — the easternmost point of the African continent. Vital for Red Sea and Indian Ocean trade routes."}, {"section": "Current Affairs", "q": "SEATO formally came to an end in:", "opts": ["1977", "1968", "1991", "None of These"], "ans": 0, "exp": "SEATO was established in 1954 (Manila Treaty) and officially dissolved on June 30, 1977. Weakened by the Vietnam War's outcome and US disengagement from the region. Pakistan was a member until 1972."}, {"section": "Current Affairs", "q": "What does 'CARICOM' stand for?", "opts": ["Canada, Austria, Romania, Indie-Community", "Caribbean Community", "Canada, Argentina, Russia, Italy-Community", "None of these"], "ans": 1, "exp": "CARICOM (Caribbean Community) is a political and economic union of 15 Caribbean nations, established by the Treaty of Chaguaramas in 1973. Members include Jamaica, Trinidad and Tobago, Barbados, Guyana, and others."}, {"section": "Current Affairs", "q": "What does BECA stand for?", "opts": ["Basic Exchange and Cooperation Agreement", "Bilateral Exchange and Cooperation Accord", "Basic Economic and Cultural Agreement", "None of these"], "ans": 0, "exp": "BECA (Basic Exchange and Cooperation Agreement for Geo-Spatial Cooperation) is a US-India defense agreement signed in October 2020. It allows sharing of advanced geospatial intelligence, maps, and satellite data. One of four US foundational defense agreements with India."}, {"section": "Current Affairs", "q": "Which nation is the top investor in Africa by 2023?", "opts": ["United States", "China", "Russia", "None of these"], "ans": 1, "exp": "China has been Africa's largest trading partner since 2009 and its top foreign investor. BRI projects have pumped hundreds of billions into 50+ African nations. China-Africa trade exceeded $282 billion in 2023."}, {"section": "Current Affairs", "q": "Which shipping lane connecting Arabian Sea to Persian Gulf passes through Pakistani waters?", "opts": ["Strait of Hormuz", "Gulf of Aden", "The Bab-el-Mandeb", "None of these"], "ans": 0, "exp": "The Strait of Hormuz connects the Persian Gulf to the Gulf of Oman and Arabian Sea. About 20% of world's oil passes through it. Shipping from Pakistan's ports (including Gwadar) uses this route for access to/from the Persian Gulf."}, {"section": "Current Affairs", "q": "Which US military operation in 2011 killed Osama bin Laden in Pakistan?", "opts": ["Operation Enduring Freedom", "Operation Eradicating Terrorism", "Operation Neptune Spear", "None of these"], "ans": 2, "exp": "Operation Neptune Spear was conducted by US Navy SEAL Team Six (DEVGRU) on May 2, 2011, in Abbottabad, Pakistan. Osama bin Laden was killed. The operation was authorized by President Obama and conducted without Pakistan's knowledge."}, {"section": "Current Affairs", "q": "The Siachen Glacier (world's highest battlefield) is in which mountain range?", "opts": ["Himalayas", "Karakoram", "Hindu Kush", "None of these"], "ans": 1, "exp": "Siachen Glacier (length ~76km) is in the Eastern Karakoram range at 5,400–6,700m altitude. India and Pakistan have disputed it since India's 1984 Operation Meghdoot. It is the world's highest-altitude armed conflict zone."}, {"section": "Current Affairs", "q": "Pakistan joined SCO in 2017. SCO's primary purpose is:", "opts": ["To facilitate trade amongst member countries", "To establish a common currency for members", "To promote regional cooperation and stability in Eurasia", "None of these"], "ans": 2, "exp": "SCO (founded 2001) is a Eurasian political, economic, and security alliance. Primary objectives: political/security cooperation, economic partnership, cultural exchange — particularly combating the 'three evils': terrorism, separatism, and extremism."}, {"section": "Current Affairs", "q": "Which Pakistani diplomat served as President of the UN General Assembly?", "opts": ["Feroz Khan Noon", "Zulfikar Ali Bhutto", "Muhammad Zafrulla Khan", "None of these"], "ans": 2, "exp": "Sir Muhammad Zafrulla Khan (1893–1985) — Pakistan's first Foreign Minister — served as President of the UN General Assembly (7th Session, 1962–63) and as President of the International Court of Justice (1970–73). Pakistan's most distinguished diplomat and jurist."}, {"section": "Current Affairs", "q": "Length of the Batura Glacier, one of the largest outside polar regions?", "opts": ["57 km", "61 km", "64 km", "None of these"], "ans": 2, "exp": "The Batura Glacier in Hunza District, Gilgit-Baltistan, is approximately 64 km long — one of the longest glaciers outside the polar regions. Pakistan has the highest concentration of glaciers of any non-polar region on Earth."}, {"section": "Current Affairs", "q": "Pakistan's largest island, called 'Jazira Haft Talar' (island of seven mountains)?", "opts": ["Manora Island", "Astola Island", "Churna Island", "None of these"], "ans": 1, "exp": "Astola Island (Jazira Haft Talar = Island of Seven Hills) is Pakistan's largest offshore island in the Arabian Sea o ction": "Pakistan Affairs", "q": "Mujeeb-ur-Rehman presented his six points in:", "opts": ["1966", "1959", "1968", "None of these"], "ans": 0, "exp": "Sheikh Mujibur Rahman presented his 6-Point Programme — a demand for provincial autonomy for East Pakistan — in February 1966 at a conference in Lahore. These six points became the charter of the autonomy movement and later the basis for Bangladesh's independence."}, {"section": "Pakistan Affairs", "q": "The Chief Justice of the Supreme Court of Pakistan is appointed by the:", "opts": ["President", "Prime Minister", "Majority vote in the Parliament", "None of these"], "ans": 0, "exp": "Under Article 177 of Pakistan's Constitution, the Chief Justice of Pakistan is appointed by the President. The 26th Constitutional Amendment (2024) altered the appointment mechanism to involve a parliamentary committee, but constitutionally the President makes the formal appointment."}];

const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>

</html>
