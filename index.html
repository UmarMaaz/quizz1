<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CSS/FPSC MPT Quiz — Set 2</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1c1c1c; --sub:#6b6b6b;
  --accent:#0f5132; --accent2:#8a6d00; --line:#e4e1da; --danger:#8a1f11; --good:#0f5132bb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161512; --card:#1f1e1a; --ink:#f0efe9; --sub:#a9a69d; --line:#33322c;
  }
}
:root[data-theme="dark"]{--bg:#161512;--card:#1f1e1a;--ink:#f0efe9;--sub:#a9a69d;--line:#33322c;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Georgia','Times New Roman',serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:24px 18px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.3px;}
.sub{color:var(--sub);font-size:.85rem;font-family:system-ui,sans-serif;}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
.section-picker{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
.chip{
  font-family:system-ui,sans-serif;font-size:.8rem;padding:7px 13px;border-radius:20px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.progress-row{display:flex;justify-content:space-between;align-items:center;font-family:system-ui,sans-serif;font-size:.8rem;color:var(--sub);margin-bottom:10px;}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px;}
.bar-fill{height:100%;background:var(--accent);transition:width .25s;}
.qtag{font-family:system-ui,sans-serif;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.qtext{font-size:1.15rem;line-height:1.5;margin-bottom:18px;}
.opt{
  display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);
  font-family:system-ui,sans-serif;font-size:.95rem;cursor:pointer;
}
.opt:hover{border-color:var(--accent);}
.opt.correct{background:#0f513222;border-color:var(--accent);}
.opt.wrong{background:#8a1f1122;border-color:var(--danger);}
.opt[disabled]{cursor:default;}
.explain{
  margin-top:14px;padding:12px 14px;border-radius:8px;background:var(--bg);
  border:1px dashed var(--line);font-family:system-ui,sans-serif;font-size:.88rem;line-height:1.5;color:var(--sub);
}
.explain b{color:var(--ink);}
.nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;font-family:system-ui,sans-serif;}
button.nav{
  flex:1;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#fff;
  font-size:.9rem;cursor:pointer;
}
button.nav.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
button.nav:disabled{opacity:.4;cursor:default;}
.score-screen{text-align:center;}
.score-num{font-size:3rem;margin:10px 0;color:var(--accent);font-family:system-ui,sans-serif;font-weight:700;}
.start-screen p{font-family:system-ui,sans-serif;color:var(--sub);font-size:.9rem;line-height:1.6;}
footer{text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:var(--sub);margin-top:20px;}
</style>
</head>

<script>
const QUESTIONS = [{"section": "English", "q": "Which verb correctly follows 'enjoy' as a gerund-only verb?", "opts": ["She enjoys to read novels.", "She enjoys reading novels.", "She enjoy reading novels.", "She enjoys read novels."], "ans": 1, "exp": "'Enjoy' is always followed by a gerund (V-ing), never a to-infinitive: 'enjoys reading'."}, {"section": "English", "q": "'He is good ___ mathematics.'", "opts": ["in", "at", "on", "with"], "ans": 1, "exp": "The fixed collocation is 'good AT' a subject or skill."}, {"section": "English", "q": "Which sentence uses 'less' correctly?", "opts": ["There are less students today.", "There is less water in the tank.", "He has less books than me.", "Fewer sugar, please."], "ans": 1, "exp": "'Less' modifies uncountable nouns like 'water'; 'fewer' is used for countable nouns like 'students' or 'books'."}, {"section": "English", "q": "'Between you and ___, this is a secret.'", "opts": ["I", "me", "myself", "mine"], "ans": 1, "exp": "'Between' is a preposition and takes the objective case pronoun: 'me', not the subjective 'I'."}, {"section": "English", "q": "The idiom 'once in a blue moon' means:", "opts": ["Every night", "Very rarely", "Regularly", "Never"], "ans": 1, "exp": "This idiom describes something that happens very rarely or infrequently."}, {"section": "English", "q": "'I wish I ___ taller.'", "opts": ["am", "was", "were", "be"], "ans": 2, "exp": "Wishes about the present/unreal situations use the subjunctive 'were' for all subjects."}, {"section": "English", "q": "'Pernicious' most nearly means:", "opts": ["Harmless", "Harmful in a gradual, subtle way", "Extremely fast", "Very cheap"], "ans": 1, "exp": "'Pernicious' describes something that causes harm in a gradual or insidious manner."}, {"section": "English", "q": "Correct the error: 'Everybody have their own opinion.'", "opts": ["Everybody has his or her own opinion.", "Everybody having own opinion.", "Everybody have own opinions.", "No error"], "ans": 0, "exp": "'Everybody' is grammatically singular and requires a singular verb ('has') and singular pronoun reference."}, {"section": "English", "q": "Correct the error: 'I am knowing the answer.'", "opts": ["I am knowing the answer well.", "I know the answer.", "I was knowing the answer.", "No error"], "ans": 1, "exp": "'Know' is a stative verb and is not normally used in continuous (-ing) forms; simple present is correct."}, {"section": "English", "q": "Correct the error: 'She is married with a doctor.'", "opts": ["She is married to a doctor.", "She is married by a doctor.", "She is married for a doctor.", "No error"], "ans": 0, "exp": "The correct preposition after 'married' (as a state) is 'to', not 'with'."}, {"section": "English", "q": "Correct the error: 'Although he was tired, but he continued working.'", "opts": ["Although he was tired, he continued working.", "Although he was tired, so he continued working.", "He was tired although but continued.", "No error"], "ans": 0, "exp": "'Although' should not be paired with 'but' in the same sentence — only one connector is needed."}, {"section": "English", "q": "'Adopt' most correctly fits which sentence?", "opts": ["The committee will ___ the new policy tomorrow.", "She had to ___ to the new environment.", "He is quite ___ at his job.", "They were ___ to change."], "ans": 0, "exp": "'Adopt' means to formally take up or accept (e.g., a policy); 'adapt' means to adjust to new conditions."}, {"section": "English", "q": "'Sound counsel' means:", "opts": ["Sound advice", "A legal council meeting", "A loud noise", "A written agreement"], "ans": 0, "exp": "'Counsel' (noun) means advice; 'council' refers to a group or committee — a commonly confused pair."}, {"section": "English", "q": "'Desert' and 'Dessert' differ in that:", "opts": ["Desert = arid land/to abandon; Dessert = sweet course after a meal", "Both mean the same", "Desert = sweet food; Dessert = arid land", "Neither is a real word"], "ans": 0, "exp": "'Desert' (one 's') means arid land or to abandon; 'dessert' (two 's's) is the sweet food course."}, {"section": "English", "q": "'Precede' most nearly means:", "opts": ["To come before", "To continue forward", "To follow after", "To stop completely"], "ans": 0, "exp": "'Precede' means to come before something in time or order; 'proceed' means to continue or go forward."}, {"section": "English", "q": "Complete the analogy: Author : Book :: Composer : ?", "opts": ["Instrument", "Symphony", "Concert", "Audience"], "ans": 1, "exp": "A composer creates a symphony just as an author creates a book — creator to their creation."}, {"section": "English", "q": "Complete the analogy: Fish : Water :: Bird : ?", "opts": ["Nest", "Air", "Tree", "Egg"], "ans": 1, "exp": "A fish's natural medium is water, just as a bird's natural medium is air."}, {"section": "English", "q": "A gerund functions grammatically as a:", "opts": ["Verb only", "Noun", "Adjective only", "Preposition"], "ans": 1, "exp": "A gerund (V-ing form) functions as a noun in a sentence, e.g., 'Swimming is good exercise.'"}, {"section": "English", "q": "Which collocation is correct?", "opts": ["Do a decision", "Make a decision", "Make a homework", "Do an effort"], "ans": 1, "exp": "The standard English collocation is 'make a decision', not 'do a decision'."}, {"section": "General Science & Ability", "q": "A car's odometer reads distance in km. If it travels at 80 km/h for 45 minutes, the distance covered is:", "opts": ["40 km", "60 km", "70 km", "90 km"], "ans": 1, "exp": "45 minutes = 0.75 hours; Distance = Speed × Time = 80 × 0.75 = 60 km."}, {"section": "General Science & Ability", "q": "The next term in the series 5, 10, 20, 40, ___ is:", "opts": ["60", "70", "80", "90"], "ans": 2, "exp": "Each term is double the previous one (geometric progression with ratio 2): 40 × 2 = 80."}, {"section": "General Science & Ability", "q": "If the perimeter of a square is 48 cm, its area is:", "opts": ["100 cm²", "121 cm²", "144 cm²", "169 cm²"], "ans": 2, "exp": "Side = Perimeter/4 = 48/4 = 12 cm; Area = side² = 144 cm²."}, {"section": "General Science & Ability", "q": "A sum invested at compound interest doubles in 10 years. In how many years (approx.) will it become four times the original, at the same rate?", "opts": ["15 years", "20 years", "25 years", "30 years"], "ans": 1, "exp": "Doubling twice (2×2=4) takes roughly twice the doubling period: 10 + 10 = 20 years (approximate rule for compound growth)."}, {"section": "General Science & Ability", "q": "The boiling point of water decreases at higher altitudes because:", "opts": ["Temperature increases with altitude", "Atmospheric pressure decreases with altitude", "Gravity increases with altitude", "Air becomes denser at altitude"], "ans": 1, "exp": "Lower atmospheric pressure at high altitudes means water boils at a lower temperature."}, {"section": "General Science & Ability", "q": "Which organ in the human body is primarily responsible for filtering blood and producing urine?", "opts": ["Liver", "Kidney", "Pancreas", "Spleen"], "ans": 1, "exp": "The kidneys filter blood to remove waste and excess fluid, producing urine."}, {"section": "General Science & Ability", "q": "The chemical formula for water is:", "opts": ["H2O2", "HO2", "H2O", "H3O"], "ans": 2, "exp": "Water consists of two hydrogen atoms and one oxygen atom: H2O."}, {"section": "General Science & Ability", "q": "Which of the following is NOT a state of matter?", "opts": ["Solid", "Liquid", "Gas", "Energy"], "ans": 3, "exp": "The classical states of matter are solid, liquid, gas (and plasma) — 'energy' is not a state of matter."}, {"section": "General Science & Ability", "q": "A ratio of 3:5 needs to be expressed as a percentage. What is it?", "opts": ["50%", "60%", "65%", "70%"], "ans": 1, "exp": "3/(3+5) = 3/8... but if the ratio itself (3 out of 5 parts, i.e., 3/5) is meant: 3/5 = 60%."}, {"section": "General Science & Ability", "q": "If 15 workers can build a wall in 12 days, how many days will 20 workers take (at the same rate)?", "opts": ["8 days", "9 days", "10 days", "11 days"], "ans": 1, "exp": "Using inverse proportion: 15×12 = 20×x → x = 180/20 = 9 days."}, {"section": "General Science & Ability", "q": "The main gas responsible for the greenhouse effect (in largest human-caused quantity) is:", "opts": ["Oxygen", "Carbon dioxide", "Nitrogen", "Helium"], "ans": 1, "exp": "Carbon dioxide (CO2) is the primary greenhouse gas emitted by human activity contributing to global warming."}, {"section": "General Science & Ability", "q": "An angle greater than 90° but less than 180° is called:", "opts": ["Acute", "Right", "Obtuse", "Reflex"], "ans": 2, "exp": "An obtuse angle measures between 90° and 180°."}, {"section": "General Science & Ability", "q": "Which vitamin is primarily obtained from sunlight exposure on skin?", "opts": ["Vitamin A", "Vitamin B12", "Vitamin C", "Vitamin D"], "ans": 3, "exp": "Vitamin D is synthesized in the skin upon exposure to sunlight (UVB rays)."}, {"section": "General Science & Ability", "q": "The value of 2^5 is:", "opts": ["16", "32", "64", "10"], "ans": 1, "exp": "2^5 = 2×2×2×2×2 = 32."}, {"section": "General Science & Ability", "q": "If the average of 4 numbers is 20, their total sum is:", "opts": ["60", "70", "80", "90"], "ans": 2, "exp": "Sum = Average × Count = 20 × 4 = 80."}, {"section": "General Science & Ability", "q": "Which of these numbers is NOT a perfect square?", "opts": ["36", "49", "54", "64"], "ans": 2, "exp": "54 is not a perfect square; 36=6², 49=7², 64=8²."}, {"section": "General Science & Ability", "q": "Sound travels faster in which medium?", "opts": ["Vacuum", "Air", "Water", "Steel"], "ans": 3, "exp": "Sound travels fastest through solids like steel, due to closely packed molecules, and cannot travel through a vacuum at all."}, {"section": "General Science & Ability", "q": "The process of a liquid changing directly into a gas at its surface (below boiling point) is called:", "opts": ["Boiling", "Evaporation", "Condensation", "Sublimation"], "ans": 1, "exp": "Evaporation is the gradual conversion of liquid to vapor at the surface, occurring below the boiling point."}, {"section": "General Science & Ability", "q": "If a clock shows 3:15, the angle between the hour and minute hands is approximately:", "opts": ["0°", "7.5°", "15°", "30°"], "ans": 1, "exp": "At 3:15, the minute hand is at 90°, the hour hand has moved slightly past 90° (by 0.5°×15=7.5°), giving a gap of about 7.5°."}, {"section": "Pakistan Affairs", "q": "According to the 1973 Constitution, the National Assembly has how many total seats?", "opts": ["272", "336", "342", "350"], "ans": 1, "exp": "The National Assembly comprises 336 seats: 266 general + 60 reserved for women + 10 for non-Muslims."}, {"section": "Pakistan Affairs", "q": "The Senate of Pakistan has how many total seats?", "opts": ["96", "100", "104", "110"], "ans": 0, "exp": "The Senate comprises 96 seats, with equal representation ensured across the four provinces."}, {"section": "Pakistan Affairs", "q": "The term of a Senator in Pakistan is:", "opts": ["4 years", "5 years", "6 years", "7 years"], "ans": 2, "exp": "Senators serve a 6-year term, with half the House retiring every 3 years."}, {"section": "Pakistan Affairs", "q": "The Khyber Pass connects Pakistan to which neighboring country?", "opts": ["Iran", "Afghanistan", "China", "India"], "ans": 1, "exp": "The historic Khyber Pass connects Peshawar, Pakistan, to Jalalabad/Kabul in Afghanistan."}, {"section": "Pakistan Affairs", "q": "The Karakoram Pass connects Gilgit-Baltistan to which country?", "opts": ["Afghanistan", "Iran", "China", "India"], "ans": 2, "exp": "The Karakoram Pass provides a route connecting Gilgit-Baltistan, Pakistan, to Xinjiang, China."}, {"section": "Pakistan Affairs", "q": "Nanga Parbat, nicknamed the 'Killer Mountain', is the world's:", "opts": ["Highest peak", "2nd highest peak", "9th highest peak", "15th highest peak"], "ans": 2, "exp": "Nanga Parbat, at 8,126 m, is the world's 9th-highest mountain and is notorious for its difficulty and danger."}, {"section": "Pakistan Affairs", "q": "Pakistan's largest freshwater lake is:", "opts": ["Attabad Lake", "Manchar Lake", "Saif-ul-Malook Lake", "Keenjhar Lake"], "ans": 1, "exp": "Manchar Lake, located in Sindh, is Pakistan's largest freshwater lake."}, {"section": "Pakistan Affairs", "q": "Youm-e-Takbeer, commemorating Pakistan's 1998 nuclear tests, is observed on:", "opts": ["23 March", "1 May", "28 May", "6 September"], "ans": 2, "exp": "Youm-e-Takbeer marks the anniversary of Pakistan's nuclear tests at Chagai on 28 May 1998."}, {"section": "Pakistan Affairs", "q": "Defence Day, commemorating the 1965 war with India, is observed on:", "opts": ["23 March", "6 September", "5 February", "9 November"], "ans": 1, "exp": "Defence Day is observed on 6 September each year, commemorating Pakistan's defence in the 1965 war."}, {"section": "Pakistan Affairs", "q": "According to Pakistan's 2023 digital census, the total population was approximately:", "opts": ["207.7 million", "220 million", "241.5 million", "260 million"], "ans": 2, "exp": "The 2023 census recorded Pakistan's population at approximately 241.5 million, up from 207.7 million in 2017."}, {"section": "Pakistan Affairs", "q": "According to the 2023 census, which is the most widely spoken mother tongue in Pakistan?", "opts": ["Urdu", "Punjabi", "Pashto", "Sindhi"], "ans": 1, "exp": "Punjabi is the most common mother tongue (about 37%), even though Urdu is the national/official language."}, {"section": "Pakistan Affairs", "q": "Shah Abdul Latif Bhittai, author of the 'Shah Jo Risalo', is a celebrated Sufi poet of:", "opts": ["Punjab", "Sindh", "Balochistan", "Khyber Pakhtunkhwa"], "ans": 1, "exp": "Shah Abdul Latif Bhittai was a renowned Sindhi Sufi poet who authored the 'Shah Jo Risalo'."}, {"section": "Pakistan Affairs", "q": "Khushal Khan Khattak, called the 'Father of Pashto Poetry', was also known as a:", "opts": ["Diplomat", "Warrior-poet", "Scientist", "Painter"], "ans": 1, "exp": "Khushal Khan Khattak is remembered both as a warrior and a major figure in Pashto literature."}, {"section": "Pakistan Affairs", "q": "The Indus Waters Treaty (1960) was brokered and guaranteed by:", "opts": ["The United Nations", "The World Bank", "NATO", "The IMF"], "ans": 1, "exp": "The World Bank facilitated and guaranteed the Indus Waters Treaty signed between Pakistan and India in 1960."}, {"section": "Pakistan Affairs", "q": "Under the Indus Waters Treaty, the three Western Rivers allocated to Pakistan are:", "opts": ["Ravi, Beas, Sutlej", "Indus, Jhelum, Chenab", "Indus, Ravi, Sutlej", "Jhelum, Beas, Chenab"], "ans": 1, "exp": "Pakistan received primary rights to the Indus, Jhelum, and Chenab rivers under the treaty."}, {"section": "Pakistan Affairs", "q": "Which political party was founded by Zulfikar Ali Bhutto in 1967?", "opts": ["Jamaat-e-Islami", "Pakistan Peoples Party (PPP)", "Pakistan Muslim League", "MQM"], "ans": 1, "exp": "Zulfikar Ali Bhutto founded the Pakistan Peoples Party (PPP) in 1967."}, {"section": "Pakistan Affairs", "q": "Jamaat-e-Islami (JI) was founded in 1941 by:", "opts": ["Maulana Abul Ala Maududi", "Allama Iqbal", "Liaquat Ali Khan", "Altaf Hussain"], "ans": 0, "exp": "Maulana Abul Ala Maududi founded Jamaat-e-Islami in 1941."}, {"section": "Pakistan Affairs", "q": "The National Command Authority (NCA), overseeing Pakistan's strategic nuclear assets, was established in:", "opts": ["1956", "1976", "1998", "2000"], "ans": 3, "exp": "The NCA was established in 2000 as the apex body for Pakistan's nuclear policy and strategic assets."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Holy Quran consists of how many Surahs?", "opts": ["110", "114", "116", "120"], "ans": 1, "exp": "The Quran is divided into 114 Surahs (chapters)."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Quran is divided into how many Paras (Juz)?", "opts": ["28", "29", "30", "32"], "ans": 2, "exp": "The Quran is traditionally divided into 30 Paras (Juz) for ease of recitation."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The longest Surah in the Quran is:", "opts": ["Al-Baqarah", "Al-Kausar", "Al-Fatiha", "Yaseen"], "ans": 0, "exp": "Al-Baqarah is the longest Surah of the Quran, while Al-Kausar is the shortest."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The shortest Surah in the Quran is:", "opts": ["Al-Ikhlas", "Al-Kausar", "An-Nas", "Al-Falaq"], "ans": 1, "exp": "Al-Kausar, with just three verses, is the shortest Surah in the Quran."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Surahs revealed before the Prophet's migration to Madinah are classified as:", "opts": ["Madani", "Makki", "Hijri", "Qudsi"], "ans": 1, "exp": "Surahs revealed in Makkah before Hijrah are called 'Makki'; those revealed after migration to Madinah are 'Madani'."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Prophet Muhammad (PBUH) was born in the year traditionally known as the:", "opts": ["Year of the Elephant", "Year of Sorrow", "Year of Victory", "Year of Unity"], "ans": 0, "exp": "The Prophet was born in 570 CE, referred to as the 'Year of the Elephant' due to Abraha's failed attack on the Kaaba."}, {"section": "Islamic Studies / Civics & Ethics", "q": "At what age did Prophet Muhammad (PBUH) receive his first revelation?", "opts": ["25", "30", "40", "50"], "ans": 2, "exp": "The Prophet received his first revelation at age 40, in the Cave of Hira."}, {"section": "Islamic Studies / Civics & Ethics", "q": "The Quran was standardized into a single authoritative text during the caliphate of:", "opts": ["Abu Bakr", "Umar", "Uthman", "Ali"], "ans": 2, "exp": "While initial compilation occurred under Abu Bakr, the standardized text was produced and distributed under Caliph Uthman."}, {"section": "Islamic Studies / Civics & Ethics", "q": "Zakat is calculated on wealth held for how long before it becomes due?", ty, as though one sees Allah."}, {"section": "Current Affairs", "q": "The term 'Youm-e-Takbeer' is specifically linked to Pakistan's:", "opts": ["Independence", "Nuclear tests of 1998", "First constitution", "First elections"], "ans": 1, "exp": "Youm-e-Takbeer commemorates Pakistan's successful nuclear tests conducted at Chagai on 28 May 1998."}, {"section": "Current Affairs", "q": "CPEC 2.0, the current phase of the China-Pakistan Economic Corridor, primarily shifts emphasis toward:", "opts": ["Only road construction", "Special Economic Zones, agriculture, and industrial relocation", "Military cooperation only", "Tourism exclusively"], "ans": 1, "exp": "CPEC 2.0 emphasizes Special Economic Zones, agricultural cooperation, industrial relocation from China, and social-sector development."}, {"section": "Current Affairs", "q": "India's announcement of holding the Indus Waters Treaty 'in abeyance' occurred in:", "opts": ["2020", "2022", "April 2025", "2018"], "ans": 2, "exp": "India announced holding the Indus Waters Treaty in abeyance in April 2025, marking a major shift in a treaty that had survived decades of tension."}, {"section": "Current Affairs", "q": "The 'Strategic Plans Division (SPD)' functions as the secretariat of which Pakistani body?", "opts": ["Ministry of Defence", "National Command Authority (NCA)", "Pakistan Army GHQ", "Senate of Pakistan"], "ans": 1, "exp": "The SPD serves as the secretariat supporting the National Command Authority, which oversees Pakistan's strategic assets."}, {"section": "Current Affairs", "q": "Which international body sets global rules for international trade disputes?", "opts": ["IMF", "World Bank", "WTO", "UNCTAD"], "ans": 2, "exp": "The World Trade Organization (WTO) establishes and enforces rules governing international trade."}, {"section": "Current Affairs", "q": "The 'Paris Agreement' is an international accord primarily concerning:", "opts": ["Nuclear disarmament", "Climate change mitigation", "Trade tariffs", "Refuge const SECTIONS = [...new Set(QUESTIONS.map(q=>q.section))];
let state = {
  section: 'All',
  pool: [],
  idx: 0,
  answered: {},
  score: 0
};

function buildPool(section){
  const list = section === 'All' ? QUESTIONS : QUESTIONS.filter(q=>q.section===section);
  return list.map((q,i)=>({...q, poolIndex:i}));
}

function startQuiz(section){
  state.section = section;
  state.pool = buildPool(section);
  state.idx = 0;
  state.answered = {};
  state.score = 0;
  renderQuestion();
}

function renderStart(){
  const app = document.getElementById('app');
  let chips = SECTIONS.map(s=>`<div class="chip" data-sec="${s}">${s} (${QUESTIONS.filter(q=>q.section===s).length})</div>`).join('');
  app.innerHTML = `
    <div class="card start-screen">
      <p>Choose a section to focus on, or take the full mixed quiz. Each question shows a short explanation right after you answer.</p>
      <div class="section-picker">
        <div class="chip active" data-sec="All">All Sections (${QUESTIONS.length})</div>
        ${chips}
      </div>
      <div class="nav-row">
        <button class="nav" id="beginBtn">Start Quiz</button>
      </div>
    </div>`;
  let chosen = 'All';
  document.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      chosen = c.dataset.sec;
    });
  });
  document.getElementById('beginBtn').addEventListener('click', ()=> startQuiz(chosen));
}

function renderQuestion(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const q = state.pool[state.idx];
  const pct = Math.round((state.idx/total)*100);
  const already = state.answered[state.idx];

  const optsHtml = q.opts.map((opt,i)=>{
    let cls = 'opt';
    let disabledAttr = '';
    if(already !== undefined){
      disabledAttr = 'disabled';
      if(i === q.ans) cls += ' correct';
      else if(i === already) cls += ' wrong';
    }
    return `<button class="${cls}" data-i="${i}" ${disabledAttr}>${String.fromCharCode(65+i)}. ${opt}</button>`;
  }).join('');

  const explainHtml = already !== undefined ? `<div class="explain"><b>${already===q.ans?'Correct. ':'Not quite. '}</b>${q.exp}</div>` : '';

  app.innerHTML = `
    <div class="progress-row">
      <span>Question ${state.idx+1} / ${total}</span>
      <span>Score: ${state.score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="qtag">${q.section}</div>
      <div class="qtext">${q.q}</div>
      ${optsHtml}
      ${explainHtml}
      <div class="nav-row">
        <button class="nav secondary" id="prevBtn" ${state.idx===0?'disabled':''}>Previous</button>
        <button class="nav" id="nextBtn" ${already===undefined?'disabled':''}>${state.idx===total-1?'Finish':'Next'}</button>
      </div>
    </div>`;

  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(state.answered[state.idx] !== undefined) return;
      const i = parseInt(btn.dataset.i);
      state.answered[state.idx] = i;
      if(i === q.ans) state.score++;
      renderQuestion();
    });
  });
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.idx>0){ state.idx--; renderQuestion(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(state.idx < total-1){ state.idx++; renderQuestion(); }
    else renderScore();
  });
}

function renderScore(){
  const app = document.getElementById('app');
  const total = state.pool.length;
  const pct = Math.round((state.score/total)*100);
  app.innerHTML = `
    <div class="card score-screen">
      <div class="qtag">${state.section}</div>
      <div>You scored</div>
      <div class="score-num">${state.score} / ${total}</div>
      <div class="sub">${pct}% correct</div>
      <div class="nav-row">
        <button class="nav secondary" id="retryBtn">Retry Section</button>
        <button class="nav" id="homeBtn">Choose Another Section</button>
      </div>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', ()=> startQuiz(state.section));
  document.getElementById('homeBtn').addEventListener('click', renderStart);
}

renderStart();
</script>
